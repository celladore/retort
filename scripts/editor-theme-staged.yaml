# =============================================================================
# editor-theme.yaml — Maps brand colors to editor workspace color customizations
# Version: 1.1.0
# =============================================================================
# This file defines how brand.yaml colors are applied to editor UI surfaces.
# The sync engine resolves dot-notation references (e.g. colors.primary.brand)
# against brand.yaml and generates workbench.colorCustomizations.
#
# Supports light, dark, or both modes. Each mode maps VS Code color keys
# to brand.yaml color paths. Cursor and Windsurf consume the same format.
#
# Repo-specific overlays can override any field for context-specific branding.
#
# Tier markers (# --- tier: minimal|medium|full ---) control which keys are
# emitted. The filter-theme-tier.js script strips keys below the selected tier
# before the sync engine runs. Keys accumulate: minimal ⊂ medium ⊂ full.
# =============================================================================

enabled: true # Master toggle — set false to skip theme generation
mode: both # light | dark | both — generate both for broad compatibility

# ─────────────────────────────────────────────────────────────────────────────
# Brand density tier — controls how many editor surfaces are themed
# ─────────────────────────────────────────────────────────────────────────────
# full    — All surfaces: title bar, activity bar, status bar, sidebar,
#           editor, tabs, badges, lists, buttons, panel, terminal, inputs,
#           dropdowns, breadcrumbs, scrollbar, notifications, quick input,
#           peek view, minimap, menus
# medium  — Key chrome only: title bar, activity bar, status bar, sidebar
# minimal — Title bar only — one glanceable surface to identify the project
tier: full

# ─────────────────────────────────────────────────────────────────────────────
# Color scheme preference — light | dark
# ─────────────────────────────────────────────────────────────────────────────
# Controls which mapping (light/dark) is primary when mode is 'both'.
# In dark scheme the palette uses deep muted hues with the brand accent
# on the title bar for instant project identification.
scheme: dark

# ─────────────────────────────────────────────────────────────────────────────
# Output targets — which editor config files to generate
# ─────────────────────────────────────────────────────────────────────────────
# Each output gets the resolved colorCustomizations merged in.
# Set a path to null to skip that target.
outputs:
  vscode: '.vscode/settings.json'
  cursor: '.cursor/settings.json'
  windsurf: '.windsurf/settings.json'

# ─────────────────────────────────────────────────────────────────────────────
# Light mode mapping — brand token → VS Code color slot
# ─────────────────────────────────────────────────────────────────────────────
light:
  # --- tier: minimal ---
  # Title bar
  titleBar.activeBackground: colors.primary.brand
  titleBar.activeForeground: colors.darkMode.textPrimary
  titleBar.inactiveBackground: colors.primary.surface
  titleBar.border: colors.neutral.400

  # --- tier: medium ---
  # Activity bar
  activityBar.background: colors.primary.brand
  activityBar.foreground: colors.darkMode.textPrimary
  activityBar.activeBorder: colors.primary.coral
  activityBar.border: colors.neutral.400
  # Status bar
  statusBar.background: colors.primary.teal
  statusBar.foreground: colors.neutral.900
  statusBar.debuggingBackground: colors.semantic.warning
  statusBar.noFolderBackground: colors.neutral.700
  statusBar.border: colors.neutral.400
  # Sidebar
  sideBar.background: colors.primary.surface
  sideBar.foreground: colors.neutral.700
  sideBar.border: colors.neutral.400
  sideBarSectionHeader.background: colors.neutral.100
  sideBarSectionHeader.foreground: colors.neutral.900

  # --- tier: full ---
  # Editor
  editor.background: colors.primary.surface
  editor.foreground: colors.neutral.900
  editorLineNumber.foreground: colors.neutral.400
  editorGroupHeader.tabsBackground: colors.neutral.100
  editorWidget.background: colors.primary.surface
  editorWidget.foreground: colors.neutral.900
  editorWidget.border: colors.neutral.400
  # Tabs
  tab.activeBackground: colors.primary.surface
  tab.inactiveBackground: colors.neutral.100
  tab.activeForeground: colors.primary.brand
  tab.inactiveForeground: colors.neutral.700
  tab.border: colors.neutral.100
  tab.activeBorderTop: colors.primary.brand
  # Badges
  badge.background: colors.primary.coral
  badge.foreground: colors.neutral.900
  # Lists
  list.activeSelectionBackground: colors.primary.brand
  list.activeSelectionForeground: colors.darkMode.textPrimary
  list.inactiveSelectionBackground: colors.neutral.100
  list.hoverBackground: colors.neutral.100
  list.focusBackground: colors.neutral.100
  # Buttons
  button.background: colors.primary.brand
  button.foreground: colors.darkMode.textPrimary
  button.hoverBackground: colors.primary.dark
  # Panel (terminal area)
  panel.background: colors.primary.surface
  panel.border: colors.neutral.400
  panelTitle.activeBorder: colors.primary.brand
  panelTitle.activeForeground: colors.neutral.900
  panelTitle.inactiveForeground: colors.neutral.700
  # Terminal
  terminal.background: colors.primary.surface
  terminal.foreground: colors.neutral.900
  # Input fields
  input.background: colors.primary.surface
  input.foreground: colors.neutral.900
  input.border: colors.neutral.400
  input.placeholderForeground: colors.neutral.400
  # Dropdowns
  dropdown.background: colors.primary.surface
  dropdown.foreground: colors.neutral.900
  dropdown.border: colors.neutral.400
  # Breadcrumbs
  breadcrumb.foreground: colors.neutral.700
  breadcrumb.focusForeground: colors.neutral.900
  breadcrumb.activeSelectionForeground: colors.neutral.900
  # Scrollbar
  scrollbarSlider.background: colors.neutral.400
  scrollbarSlider.hoverBackground: colors.neutral.700
  scrollbarSlider.activeBackground: colors.neutral.700
  # Notifications
  notifications.background: colors.primary.surface
  notifications.foreground: colors.neutral.900
  notificationCenterHeader.background: colors.neutral.100
  # Quick input (command palette)
  quickInput.background: colors.primary.surface
  quickInput.foreground: colors.neutral.900
  quickInputTitle.background: colors.neutral.100
  # Peek view
  peekViewEditor.background: colors.primary.surface
  peekViewResult.background: colors.neutral.100
  peekViewTitle.background: colors.primary.brand
  peekView.border: colors.primary.brand
  # Minimap
  minimap.background: colors.primary.surface
  # Menu
  menu.background: colors.primary.surface
  menu.foreground: colors.neutral.900
  menu.selectionBackground: colors.primary.brand
  menu.selectionForeground: colors.darkMode.textPrimary
  menu.separatorBackground: colors.neutral.400

# ─────────────────────────────────────────────────────────────────────────────
# Dark mode mapping — brand token → VS Code color slot
# ─────────────────────────────────────────────────────────────────────────────
dark:
  # --- tier: minimal ---
  # Title bar
  titleBar.activeBackground: colors.primary.dark
  titleBar.activeForeground: colors.darkMode.textPrimary
  titleBar.inactiveBackground: colors.darkMode.surface
  titleBar.border: colors.darkMode.background

  # --- tier: medium ---
  # Activity bar
  activityBar.background: colors.primary.dark
  activityBar.foreground: colors.primary.teal
  activityBar.activeBorder: colors.primary.brand
  activityBar.border: colors.darkMode.background
  # Status bar
  statusBar.background: colors.primary.brand
  statusBar.foreground: colors.darkMode.textPrimary
  statusBar.debuggingBackground: colors.semantic.warning
  statusBar.noFolderBackground: colors.neutral.900
  statusBar.border: colors.darkMode.background
  # Sidebar
  sideBar.background: colors.darkMode.surface
  sideBar.foreground: colors.darkMode.textSecondary
  sideBar.border: colors.darkMode.background
  sideBarSectionHeader.background: colors.darkMode.background
  sideBarSectionHeader.foreground: colors.darkMode.textPrimary

  # --- tier: full ---
  # Editor
  editor.background: colors.darkMode.background
  editor.foreground: colors.darkMode.textPrimary
  editorLineNumber.foreground: colors.darkMode.textSecondary
  editorGroupHeader.tabsBackground: colors.darkMode.background
  editorWidget.background: colors.darkMode.surface
  editorWidget.foreground: colors.darkMode.textPrimary
  editorWidget.border: colors.primary.dark
  # Tabs
  tab.activeBackground: colors.darkMode.surface
  tab.inactiveBackground: colors.darkMode.background
  tab.activeForeground: colors.primary.brand
  tab.inactiveForeground: colors.darkMode.textSecondary
  tab.border: colors.darkMode.background
  tab.activeBorderTop: colors.primary.brand
  # Badges
  badge.background: colors.primary.teal
  badge.foreground: colors.darkMode.textPrimary
  # Lists
  list.activeSelectionBackground: colors.primary.coral
  list.activeSelectionForeground: colors.neutral.900
  list.inactiveSelectionBackground: colors.darkMode.surface
  list.hoverBackground: colors.darkMode.surface
  list.focusBackground: colors.darkMode.surface
  # Buttons
  button.background: colors.primary.coral
  button.foreground: colors.darkMode.textPrimary
  button.hoverBackground: colors.primary.brand
  # Panel (terminal area)
  panel.background: colors.darkMode.background
  panel.border: colors.darkMode.surface
  panelTitle.activeBorder: colors.primary.brand
  panelTitle.activeForeground: colors.darkMode.textPrimary
  panelTitle.inactiveForeground: colors.darkMode.textSecondary
  # Terminal
  terminal.background: colors.darkMode.background
  terminal.foreground: colors.darkMode.textPrimary
  # Input fields
  input.background: colors.darkMode.background
  input.foreground: colors.darkMode.textPrimary
  input.border: colors.darkMode.surface
  input.placeholderForeground: colors.darkMode.textSecondary
  # Dropdowns
  dropdown.background: colors.darkMode.background
  dropdown.foreground: colors.darkMode.textPrimary
  dropdown.border: colors.darkMode.surface
  # Breadcrumbs
  breadcrumb.foreground: colors.darkMode.textSecondary
  breadcrumb.focusForeground: colors.darkMode.textPrimary
  breadcrumb.activeSelectionForeground: colors.darkMode.textPrimary
  # Scrollbar
  scrollbarSlider.background: colors.darkMode.surface
  scrollbarSlider.hoverBackground: colors.neutral.700
  scrollbarSlider.activeBackground: colors.neutral.700
  # Notifications
  notifications.background: colors.darkMode.surface
  notifications.foreground: colors.darkMode.textPrimary
  notificationCenterHeader.background: colors.darkMode.background
  # Quick input (command palette)
  quickInput.background: colors.darkMode.surface
  quickInput.foreground: colors.darkMode.textPrimary
  quickInputTitle.background: colors.darkMode.background
  # Peek view
  peekViewEditor.background: colors.darkMode.background
  peekViewResult.background: colors.darkMode.surface
  peekViewTitle.background: colors.primary.dark
  peekView.border: colors.primary.brand
  # Minimap
  minimap.background: colors.darkMode.background
  # Menu
  menu.background: colors.darkMode.surface
  menu.foreground: colors.darkMode.textPrimary
  menu.selectionBackground: colors.primary.dark
  menu.selectionForeground: colors.darkMode.textPrimary
  menu.separatorBackground: colors.darkMode.background

# ─────────────────────────────────────────────────────────────────────────────
# Base themes — set VS Code color theme per workspace per mode
# ─────────────────────────────────────────────────────────────────────────────
baseTheme:
  light: 'Default Light Modern'
  dark: 'Default Dark Modern'

# ─────────────────────────────────────────────────────────────────────────────
# Optional: inject editor font from brand typography
# ─────────────────────────────────────────────────────────────────────────────
# fontFromBrand: true  # If true, sets editor.fontFamily from brand.typography.mono
