# =============================================================================
# Repo-specific editor theme override
# =============================================================================
# This file is copied by `agentkit init` and customized per repo.
# Uncomment and fill in to override the shared editor-theme.yaml spec.
# Only include fields you want to override — everything else inherits.
#
# Values use brand token references (dot-notation paths into brand.yaml):
#   colors.primary.brand      — Core brand color
#   colors.primary.coral      — Collaboration warmth accent
#   colors.primary.teal       — Inviting accent / success
#   colors.primary.surface    — Light surface background
#   colors.primary.dark       — Dark mode brand surface
#   colors.primary.accent     — Highlight / attention
#   colors.secondary.lilac    — Modern accent
#   colors.secondary.mint     — Inclusive touch
#   colors.semantic.success   — Success states
#   colors.semantic.warning   — Warning states
#   colors.semantic.error     — Error states
#   colors.semantic.info      — Info states (= brand)
#   colors.neutral.900        — Deep neutral (headings)
#   colors.neutral.700        — Body text / secondary UI
#   colors.neutral.400        — Dividers / disabled
#   colors.neutral.100        — Softest background
#   colors.darkMode.background — Deep muted background
#   colors.darkMode.surface    — Layered surface (cards/panels)
#   colors.darkMode.textPrimary  — High-contrast text
#   colors.darkMode.textSecondary — Muted hints
# =============================================================================

# ─── Master toggle ───────────────────────────────────────────────────────────
# enabled: true

# ─── Mode ────────────────────────────────────────────────────────────────────
# light | dark | both — which mode(s) to generate
# mode: both

# ─── Brand density tier ──────────────────────────────────────────────────────
# full    — All 20+ surface groups (title bar through menus)
# medium  — Key chrome: title bar, activity bar, status bar, sidebar
# minimal — Title bar only — one glanceable surface to identify the project
# tier: full

# ─── Color scheme preference ─────────────────────────────────────────────────
# dark  — Deep muted hues with brand accent on title bar
# light — Light surfaces with brand color on chrome elements
# scheme: dark

# ─── Output targets ──────────────────────────────────────────────────────────
# Set a path to null to skip that target.
# outputs:
#   vscode: '.vscode/settings.json'
#   cursor: '.cursor/settings.json'
#   windsurf: '.windsurf/settings.json'

# ─── Base themes ─────────────────────────────────────────────────────────────
# baseTheme:
#   light: 'Default Light Modern'
#   dark: 'Default Dark Modern'

# ─── Font injection ──────────────────────────────────────────────────────────
# fontFromBrand: true  # Sets editor.fontFamily from brand.yaml typography.mono

