# =============================================================================
# merge-conflict-detection.yml — Detect merge conflicts on open PRs
# =============================================================================
# Triggers when dev is updated (push) and checks all open PRs targeting dev
# for merge conflicts. Posts a PR comment when conflicts are detected so
# developers can resolve proactively rather than discovering conflicts at
# merge time.
#
# This workflow does NOT auto-merge or modify feature branches. It only
# detects and reports, leaving resolution to the developer (manually or
# via scripts/resolve-merge.sh).
# =============================================================================

name: Merge Conflict Detection

on:
  push:
    branches: [dev, main]

  # Allow manual trigger for ad-hoc checks
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to check conflicts against'
        required: false
        default: 'dev'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-conflicts:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup GitHub CLI
        run: |
          if command -v gh &>/dev/null; then
            echo "gh already installed: $(gh --version | head -1)"
          else
            echo "Installing GitHub CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update && sudo apt-get install -y gh
            echo "Installed: $(gh --version | head -1)"
          fi

      - name: Detect conflicts on open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || github.ref_name }}
        run: |
          set -euo pipefail

          echo "Checking for merge conflicts against ${BASE_BRANCH}..."

          # Get all open PRs targeting the base branch
          prs=$(gh pr list \
            --base "$BASE_BRANCH" \
            --state open \
            --json number,headRefName,title \
            --limit 100)

          pr_count=$(echo "$prs" | jq length)
          echo "Found ${pr_count} open PR(s) targeting ${BASE_BRANCH}"

          conflict_count=0

          # Use process substitution to avoid subshell scoping issue with pipe
          while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            branch=$(echo "$pr" | jq -r '.headRefName')
            title=$(echo "$pr" | jq -r '.title')

            echo ""
            echo "Checking PR #${number}: ${title} (${branch})..."

            # Fetch PR head using pull/<number>/head to handle fork-based PRs
            if ! git fetch origin "pull/${number}/head:pr-${number}" 2>/dev/null; then
              echo "  Warning: could not fetch PR #${number}, skipping"
              continue
            fi

            # Try a test merge (without committing)
            git checkout "origin/${BASE_BRANCH}" --detach 2>/dev/null

            if git merge --no-commit --no-ff "pr-${number}" 2>/dev/null; then
              echo "  OK — no conflicts"
              git merge --abort 2>/dev/null || true
            else
              echo "  CONFLICT detected"
              conflict_count=$((conflict_count + 1))

              # Gather conflicted file list
              conflicted_files=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "(unable to list)")

              # Categorize files
              auto_resolvable=""
              manual_required=""
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  .agents/skills/*/SKILL.md|\
                  .github/agents/*|\
                  .github/chatmodes/*|\
                  .github/prompts/*|\
                  docs/*/README.md|\
                  pnpm-lock.yaml|\
                  .agentkit/pnpm-lock.yaml|\
                  package-lock.json|\
                  .github/copilot-instructions.md|\
                  .github/PULL_REQUEST_TEMPLATE.md|\
                  .gemini/config.yaml)
                    auto_resolvable="${auto_resolvable}
              - \`${file}\` (auto-resolvable)"
                    ;;
                  *)
                    manual_required="${manual_required}
              - \`${file}\` (manual merge needed)"
                    ;;
                esac
              done <<< "$conflicted_files"

              git merge --abort 2>/dev/null || true

              # Check if we already posted a conflict comment recently
              existing_comment=$(gh pr view "$number" \
                --json comments \
                --jq '.comments[] | select(.body | contains("Merge Conflict Detected")) | select(.createdAt > (now - 86400 | todate)) | .id' \
                2>/dev/null | head -1 || true)

              if [ -n "$existing_comment" ]; then
                echo "  Skipping comment — already notified within 24h"
                continue
              fi

              # Post a helpful comment on the PR
              comment_body="## Merge Conflict Detected

          This branch (\`${branch}\`) has merge conflicts with \`${BASE_BRANCH}\`.

          ### Auto-resolvable files
          These will be handled automatically by \`scripts/resolve-merge.sh\`:
          ${auto_resolvable:-"
          _(none)_"}

          ### Manual resolution required
          ${manual_required:-"
          _(none — all conflicts are auto-resolvable!)_"}

          ### How to resolve

          **Option 1 — Use the resolution script:**
          \`\`\`bash
          git checkout ${branch}
          scripts/resolve-merge.sh ${BASE_BRANCH}
          \`\`\`

          **Option 2 — Manual merge:**
          \`\`\`bash
          git checkout ${branch}
          git merge origin/${BASE_BRANCH}
          # resolve conflicts, then:
          git add -A && git commit
          \`\`\`

          ---
          _Posted by [Merge Conflict Detection](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow_"

              gh pr comment "$number" --body "$comment_body"
              echo "  Posted conflict notification on PR #${number}"
            fi

            # Reset for next PR
            git checkout --detach "origin/${BASE_BRANCH}" 2>/dev/null || true
          done < <(echo "$prs" | jq -c '.[]')

          echo ""
          echo "Done. Conflicts detected on ${conflict_count} PR(s)."
