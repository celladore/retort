name: Semgrep (Advisory)

on:
  pull_request:
    branches: [main]
    paths:
      - '.agentkit/engines/node/src/**'
      - '.github/workflows/**'
      - '.github/instructions/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep-advisory
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (advisory)
        continue-on-error: true
        run: |
          semgrep scan \
            --config=.semgrep/semgrep.yml \
            --include='.agentkit/engines/node/src/**' \
            --include='.github/workflows/**' \
            --include='.github/instructions/**' \
            --sarif \
            --output=semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818 # v3.32.6
        with:
          sarif_file: semgrep.sarif
