# Minimal Compose for local/staging-style validation of the framework.
# Use: docker compose run --rm agentkit pnpm install && pnpm -C .agentkit agentkit:sync
services:
  agentkit:
    image: node:22-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo
    command: ['pnpm', 'install', '--frozen-lockfile']
    profiles:
      - full
  agentkit-sync:
    image: node:22-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo
    command: ['sh', '-c', 'pnpm install --frozen-lockfile && pnpm -C .agentkit agentkit:sync']
    profiles:
      - sync
