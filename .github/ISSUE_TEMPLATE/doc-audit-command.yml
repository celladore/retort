name: 'feat: add /doc-audit slash command'
description: Add a repeatable documentation audit command to agentkit-forge
title: '[FEATURE] add /doc-audit slash command for repeatable documentation audits'
labels: ['enhancement', 'documentation', 'triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Summary

        Add a dedicated `/doc-audit` command to agentkit-forge that provides repeatable, systematic documentation audits. Currently, documentation auditing is either a manual one-off exercise or a narrow subset of `/project-review --focus docs`.

        ## Context

        During the documentation audit session on 2026-03-04 (branch `claude/documentation-audit-AAygZ`), we identified that:

        - 5 commands were completely undocumented
        - 9 commands had incomplete flag documentation
        - Cross-document counts were inconsistent (command counts, agent counts)
        - No automated way exists to detect these issues going forward

        A detailed proposal has been committed at `docs/06_engineering/doc-audit-command-proposal.md`.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the project does this feature relate to?
      options:
        - backend
        - frontend
        - data
        - infra
        - devops
        - testing
        - security
        - docs
        - product
        - quality
        - cli
        - sync-engine
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - 'P0 — Critical (blocking other work)'
        - 'P1 — High (key feature, needed soon)'
        - 'P2 — Medium (valuable but not urgent)'
        - 'P3 — Low (nice-to-have)'
        - 'P4 — Trivial (cosmetic, polish)'
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which project lifecycle phase does this relate to?
      options:
        - greenfield
        - active
        - maintenance
        - legacy
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact Scope
      description: How broadly will this feature affect users?
      options:
        - 'all users'
        - 'most users'
        - 'some users'
        - 'specific configuration only'
        - 'developer/CI only'
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the feature you'd like.
      placeholder: Describe the feature...
      value: |
        Add a dedicated `/doc-audit` command that implements a 7-phase documentation audit:

        | Phase | Purpose |
        |---|---|
        | 1. Inventory | Scan docs/ structure, verify 8-category completeness |
        | 2. Spec-Doc Cross-Reference | Compare commands.yaml, agents.yaml, teams.yaml against published docs |
        | 3. Link & Reference Integrity | Check all internal markdown links resolve |
        | 4. Content Freshness | Detect stale counts, outdated versions, lingering TODOs |
        | 5. Quality Assessment | Evaluate API docs, ADR coverage, onboarding path |
        | 6. Report | Structured findings with DOC-GAP-*, DOC-DRIFT-*, DOC-LINK-*, DOC-STALE-* IDs |
        | 7. Auto-Fix (--fix only) | Safe corrections: counts, broken links, stale markers |
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
      value: |
        Currently there is no automated, repeatable way to audit documentation.
        `/project-review --focus docs` covers a narrow subset and lacks spec
        cross-referencing, link checking, count validation, auto-fix, and a
        dedicated finding taxonomy.

        | Aspect | `/project-review --focus docs` | `/doc-audit` |
        |---|---|---|
        | Spec cross-reference | No | Yes |
        | Link checking | No | Yes |
        | Count validation | No | Yes |
        | Auto-fix | No | Yes (--fix flag) |
        | Standalone report | Embedded in broader review | Dedicated DOCUMENTATION_AUDIT.md |
        | Finding taxonomy | Generic DOC-* | Specific: DOC-GAP-*, DOC-DRIFT-*, DOC-LINK-*, DOC-STALE-*, DOC-DUP-* |
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Include any API designs, CLI flags, or UI mockups.
      value: |
        1. Add spec entry to `.agentkit/spec/commands.yaml` — new `doc-audit` command (type: `workflow`) with flags:
           - `--scope` — limit audit to specific doc categories
           - `--fix` — auto-fix safe issues (counts, broken links)
           - `--output` — report format (markdown/json)
           - `--save` — persist report to `.agentkit/docs/DOCUMENTATION_AUDIT.md`

        2. Create template at `.agentkit/templates/claude/commands/doc-audit.md` implementing all 7 phases.

        3. Run `pnpm -C .agentkit agentkit:sync` to generate outputs for all 15+ platform targets.

        The full spec YAML entry and complete Handlebars template (with all 7 phases) are in `docs/06_engineering/doc-audit-command-proposal.md`.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider and why were they rejected?
      value: |
        - **`/project-review --focus docs`** — too narrow, lacks spec cross-referencing, link checking, count validation, auto-fix, and a dedicated finding taxonomy.
        - **Manual one-off audits** — not repeatable, findings are lost between sessions.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met for this feature to be considered complete?
      value: |
        - [ ] `commands.yaml` entry passes `spec-validate`
        - [ ] Template renders correctly via `agentkit sync`
        - [ ] `/doc-audit` produces a structured report when run
        - [ ] `--fix` mode safely corrects count mismatches and broken links
        - [ ] `--scope` filters to specific doc categories
        - [ ] Report is saved to `.agentkit/docs/DOCUMENTATION_AUDIT.md` by default
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references here.
    validations:
      required: false
