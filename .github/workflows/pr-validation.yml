#
# Validates PR changes: Terraform formatting, shell script linting, and
# YAML syntax. Non-blocking for most checks — surfaces issues as annotations.

name: PR Validation

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: Terraform format check
    runs-on: self-hosted
    continue-on-error: true
    if: >-
      contains(github.event.pull_request.changed_files, '.tf') ||
      contains(github.event.pull_request.changed_files, '.tfvars')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Terraform formatting
        run: |
          echo "## Terraform Format Check" >> $GITHUB_STEP_SUMMARY
          if command -v terraform &>/dev/null; then
            # Find all .tf files and check formatting
            unformatted=$(find . -name '*.tf' -not -path './.terraform/*' -exec terraform fmt -check -diff {} + 2>&1) || true
            if [ -n "$unformatted" ]; then
              echo "::warning::Terraform files are not formatted. Run 'terraform fmt -recursive' to fix."
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$unformatted" | head -50 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "All Terraform files are properly formatted." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::notice::terraform not installed — skipping format check"
            echo "terraform not available — skipping" >> $GITHUB_STEP_SUMMARY
          fi

  shellcheck:
    name: Shell script lint
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint shell scripts
        run: |
          echo "## Shell Script Lint" >> $GITHUB_STEP_SUMMARY
          if command -v shellcheck &>/dev/null; then
            errors=0
            # Find all .sh files, excluding vendor/generated directories
            while IFS= read -r -d '' script; do
              if ! shellcheck -S warning "$script" 2>&1; then
                errors=$((errors + 1))
                echo "::warning file=$script::shellcheck found issues"
              fi
            done < <(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -not -path './.terraform/*' -print0)

            if [ "$errors" -gt 0 ]; then
              echo "$errors script(s) have shellcheck warnings — see annotations" >> $GITHUB_STEP_SUMMARY
            else
              echo "All shell scripts pass shellcheck." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::notice::shellcheck not installed — skipping lint"
            echo "shellcheck not available — skipping" >> $GITHUB_STEP_SUMMARY
          fi

  yaml-lint:
    name: YAML syntax check
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate YAML syntax
        run: |
          echo "## YAML Syntax Check" >> $GITHUB_STEP_SUMMARY
          errors=0
          # Check all YAML files for syntax errors
          while IFS= read -r -d '' yamlfile; do
            if ! python3 -c "import yaml; yaml.safe_load(open('$yamlfile'))" 2>/dev/null; then
              echo "::warning file=$yamlfile::Invalid YAML syntax"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.yml' -o -name '*.yaml' | grep -v node_modules | grep -v .git | tr '\n' '\0')

          if [ "$errors" -gt 0 ]; then
            echo "$errors YAML file(s) have syntax errors — see annotations" >> $GITHUB_STEP_SUMMARY
          else
            echo "All YAML files have valid syntax." >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Validation summary
    runs-on: self-hosted
    needs: [terraform-fmt, shellcheck, yaml-lint]
    if: always()
    steps:
      - name: Report
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "_This check is non-blocking and does not gate merges._" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          echo "| Terraform fmt | ${{ needs.terraform-fmt.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

          echo "| ShellCheck | ${{ needs.shellcheck.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML syntax | ${{ needs.yaml-lint.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
