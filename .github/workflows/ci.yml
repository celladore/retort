name: AgentKit Forge CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Run tests
        run: pnpm test
        working-directory: .agentkit

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Enforce dev to main promotion path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests targeting main must come from dev. Open this PR against dev instead."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Validate spec schemas
        run: node engines/node/src/cli.mjs spec-validate
        working-directory: .agentkit

      - name: Run sync
        run: node engines/node/src/cli.mjs sync
        working-directory: .agentkit

      - name: Validate generated outputs
        run: node engines/node/src/cli.mjs validate
        working-directory: .agentkit

      - name: Run discover
        run: node engines/node/src/cli.mjs discover --output json
        working-directory: .agentkit

      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of sync. Run 'pnpm -C .agentkit agentkit:sync' and commit."
            git diff --stat
            exit 1
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Validate YAML spec files
        working-directory: .agentkit
        run: |
          for f in spec/*.yaml; do
            echo "Checking $f..."
            SPEC_FILE="$f" node --input-type=module -e "import yaml from 'js-yaml'; import fs from 'fs'; yaml.load(fs.readFileSync(process.env.SPEC_FILE,'utf8'));"
          done

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Lint Markdown files
        run: pnpm lint:md
        working-directory: .agentkit
