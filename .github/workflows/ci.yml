name: Retort CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Branch protection depends on these check names. A required context is the job's
# `name:` — or its job id when `name:` is omitted — never "Workflow / Job" (that
# form is only for reusable workflows called via `uses:` at job level). A context
# that never matches can never go green, which blocks every PR to the branch.
#
# The required set is declared in .agentkit/spec/project.yaml under
# branchProtection.requiredStatusChecks and applied by the generated
# .github/scripts/setup-branch-protection.sh — update the spec, not this comment,
# then re-run that script.
#
# Current required checks: Test (below), Validate (below), Prettier (below),
# branch-rules (branch-protection.yml — job id, no `name:` field).
#
# `Prettier` (below) moved here from the Vitest suite (ADR-12 decision 3) and was
# promoted to a required check once it was confirmed reliably green. Note that a
# repo-wide `prettier --check .` run from inside a `.claude/worktrees/` agent
# worktree on Windows reports ~18 false positives: the harness seeds `.claude/**`
# and `CLAUDE.md` with CRLF, bypassing the `eol=lf` filters in .gitattributes.
# Those never reach CI — `text eol=lf` normalises CRLF→LF on staging — so a red
# Prettier job here is a genuine formatting regression, not that artifact.
#
# `Quarantined Tests` (below) is NOT a required check by design (ADR-12
# decision 5): a quarantined test is a known flake with a tracking issue, so it
# must stay visible without blocking merges. If it were required, quarantine
# would be indistinguishable from leaving the flake in the blocking suite.
# Markdown Lint lives in quality-lint.yml — required on main, warning-only on dev.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      # Advisory on hosted runners: the ci profile uses a much lower disk floor
      # than a developer host and never blocks (see scripts/preflight-capacity.mjs).
      # It exists so a capacity-shaped failure is visible in the log as capacity
      # rather than as a suite of unrelated test errors. Set
      # RETORT_PREFLIGHT_ENFORCE=1 to make it blocking.
      - name: Capacity preflight
        run: node scripts/preflight-capacity.mjs --profile=ci

      # Root suite runs without --coverage: its coverage thresholds (vitest.config.mjs)
      # cover src/start/** too, which currently sits well under 80% branch coverage
      # for reasons unrelated to this suite. Wiring --coverage in here would flip a
      # required check red over a pre-existing, out-of-scope gap. `pnpm test:coverage`
      # remains available locally once that gap is addressed on its own.
      - name: Run tests with coverage
        run: pnpm test:start && pnpm -C .agentkit coverage

      # Machine-readable per-test results (ADR-12 decision 5). Console scrollback
      # is not inspectable after the fact; these are. Uploaded before the
      # reconciliation gate so the evidence survives a failing gate.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: .agentkit/test-results/
          retention-days: 14
          if-no-files-found: warn

      # A Vitest run can drop tests and still print a passing summary: when a
      # worker dies mid-file, the tests it had collected stay in the reported
      # total but land in none of the pass/fail/skip buckets. One observed run
      # printed "Tests 2273 passed | 1 skipped (2327)" — 53 tests and a whole
      # file silently gone, with Vitest's own warning that this "might cause
      # false positive tests". This step fails when the outcomes do not add up.
      # A run that does not reconcile is void, not green.
      - name: Reconcile test results
        if: always()
        run: pnpm test:reconcile
        working-directory: .agentkit

      - name: Coverage summary
        if: always()
        run: |
          SUMMARY=".agentkit/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            python3 -c "
          import json, sys
          with open('$SUMMARY') as f:
              d = json.load(f)
          t = d.get('total', {})
          lines = t.get('lines', {}).get('pct', 'n/a')
          branches = t.get('branches', {}).get('pct', 'n/a')
          functions = t.get('functions', {}).get('pct', 'n/a')
          print('## Test Coverage')
          print('')
          print('| Metric | Coverage |')
          print('|--------|----------|')
          print(f'| Lines | {lines}% |')
          print(f'| Branches | {branches}% |')
          print(f'| Functions | {functions}% |')
          " >> \$GITHUB_STEP_SUMMARY
          else
            echo "No coverage-summary.json found — run \`pnpm coverage\` locally." >> \$GITHUB_STEP_SUMMARY
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Enforce dev to main promotion path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests targeting main must come from dev. Open this PR against dev instead."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Validate spec schemas
        run: node engines/node/src/cli.mjs spec-validate
        working-directory: .agentkit

      - name: Run sync
        run: node engines/node/src/cli.mjs sync
        working-directory: .agentkit

      - name: Validate generated outputs
        run: node engines/node/src/cli.mjs validate
        working-directory: .agentkit

      - name: Run discover
        run: node engines/node/src/cli.mjs discover --output json
        working-directory: .agentkit

      - name: Validate merge driver configuration
        run: |
          if ! grep -q 'merge=agentkit-generated' .gitattributes 2>/dev/null; then
            echo "::error::.gitattributes is missing merge=agentkit-generated rules. Run sync to generate them."
            exit 1
          fi
          echo "✓ .gitattributes merge driver rules present"

      - name: Run doctor diagnostics
        run: node engines/node/src/cli.mjs doctor
        working-directory: .agentkit

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::group::Sync drift — changed files"
            git status --short
            echo "::endgroup::"
            {
              echo "## Sync Drift Detected"
              echo ""
              echo "Generated outputs are out of sync with spec sources."
              echo "Run \`pnpm --dir .agentkit agentkit:sync\` locally and commit the changes."
              echo ""
              echo "### Changed files"
              echo '```'
              git status --short
              echo '```'
              echo ""
              echo "### Fix"
              echo '```bash'
              echo "pnpm --dir .agentkit agentkit:sync"
              echo "git add -A && git commit -m 'chore(sync): regenerate outputs'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Sync produced uncommitted changes — generated outputs are out of sync with sources."
            exit 1
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Validate YAML spec files
        working-directory: .agentkit
        run: |
          for f in spec/*.yaml; do
            echo "Checking $f..."
            SPEC_FILE="$f" node --input-type=module -e "import yaml from 'js-yaml'; import fs from 'fs'; yaml.load(fs.readFileSync(process.env.SPEC_FILE,'utf8'));"
          done

  # Runs only the files listed in .agentkit/test-quarantine.json — confirmed
  # flakes, each with a tracking issue, excluded from the blocking `Test` job.
  # Exits immediately when the registry is empty, which is the healthy state.
  # Non-blocking: the point of quarantine is to keep a known flake visible
  # without letting it corrupt the merge signal (ADR-12 decision 5).
  quarantined-tests:
    name: Quarantined Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Run quarantined tests
        run: pnpm test:quarantine
        working-directory: .agentkit

      - name: Upload quarantined test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quarantined-test-results
          path: .agentkit/test-results/
          retention-days: 14
          if-no-files-found: ignore

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      # Whole-repo format check. This used to live in the Vitest suite
      # (prettier.test.mjs), where it scanned the entire repository from inside
      # the unit run — ~90s of runtime that raced with the sync-heavy suites
      # creating and deleting files mid-scan. That test carried an explicit
      # retry-once workaround documenting exactly that race. A format check is
      # lint, not a unit test; it belongs here. See ADR-12 decision 3.
      # Runs from the repository root, not .agentkit: Prettier resolves
      # .prettierignore relative to the working directory, so invoking it from
      # .agentkit would silently ignore the root .prettierignore and start
      # flagging pnpm-lock.yaml and friends.
      - name: Check formatting
        run: node .agentkit/node_modules/prettier/bin/prettier.cjs --check .
