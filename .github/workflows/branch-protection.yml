name: Branch Protection

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Enforce that all PRs to main pass required checks before merge.
# Configure GitHub branch protection rules to require these status checks:
#   - Retort CI / Test (ubuntu-latest)
#   - Retort CI / Validate
#   - Branch Protection / branch-rules

jobs:
  branch-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check PR is not targeting main from main
        run: |
          # Only block same-repo PRs from main to main; allow fork PRs with a main branch
          if [ "$GITHUB_HEAD_REF" = "main" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "::error::Cannot create a PR from main to main in the same repository"
            exit 1
          fi

      - name: Enforce conventional commit titles
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?!?:\s.+/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" does not follow Conventional Commits.\n` +
                `Expected format: type(scope): description\n` +
                `Types: feat, fix, docs, style, refactor, test, chore, ci, perf, build, revert`
              );
            } else {
              core.info(`PR title follows Conventional Commits: "${title}"`);
            }

      - name: Check for breaking changes documentation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = context.payload.pull_request.title;

            if (title.includes('!:') || title.includes('BREAKING')) {
              // Check if there's an ADR or breaking change note in the PR body
              const body = context.payload.pull_request.body || '';
              const hasBreakingDocs =
                body.includes('## Breaking Changes') ||
                body.includes('ADR') ||
                body.includes('migration');

              if (!hasBreakingDocs) {
                core.setFailed(
                  'This PR contains breaking changes but the body does not ' +
                  'mention an ADR, migration guide, or "## Breaking Changes" section. ' +
                  'Please document breaking changes before merging.'
                );
              }
            }

      - name: Require upstream issue link for .agentkit changes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              },
              (response) => response.data
            );

            const touchesAgentkit = files.some(
              (file) =>
                file.filename.startsWith('.agentkit/') ||
                (file.previous_filename && file.previous_filename.startsWith('.agentkit/'))
            );

            if (!touchesAgentkit) {
              core.info('No .agentkit changes detected; upstream issue link check skipped.');
              return;
            }

            const isAgentkitForgeRepo =
              context.repo.owner.toLowerCase() === 'justaghost' &&
              context.repo.repo.toLowerCase() === 'retort';

            if (isAgentkitForgeRepo) {
              core.info('Running in retort source repo; upstream issue link check skipped.');
              return;
            }

            const body = pr.body || '';
            const hasUpstreamIssueLink = /https:\/\/github\.com\/JustAGhosT\/retort\/issues\/\d+/i.test(body);

            if (!hasUpstreamIssueLink) {
              core.setFailed(
                'This PR modifies .agentkit/** and must include an upstream issue link in the PR body.\n' +
                'Required format example: https://github.com/JustAGhosT/retort/issues/170'
              );
              return;
            }

            core.info('Upstream issue link found for .agentkit changes.');

      - name: Verify no secrets in diff
        run: |
          # Check for common secret patterns in added lines only (not removals)
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'
            'ghp_[A-Za-z0-9]{36}'
            'sk-[A-Za-z0-9]{32,}'
          )

          # Filter to added lines only (lines starting with + but not +++)
          ADDED=$(git diff --unified=0 origin/${{ github.event.pull_request.base.ref }}...HEAD -- . ':!*.lock' ':!pnpm-lock.yaml' ':!.agentkit/pnpm-lock.yaml' | grep -E '^\+[^+]' || true)

          for pattern in "${PATTERNS[@]}"; do
            if echo "$ADDED" | grep -qE "$pattern"; then
              echo "::error::Potential secret detected in added lines matching pattern: $pattern"
              echo "Please remove secrets before merging."
              exit 1
            fi
          done
          echo "No secrets detected in added lines."
