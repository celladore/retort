name: Template Protection

on:
  pull_request:
    paths:
      - '.agentkit/templates/**'
      - '.agentkit/spec/**'
      - '.agentkit/engines/**'
      - '.agentkit/overlays/**'
      - '.agentkit/bin/**'

jobs:
  label-and-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Label PR as forge-source-change
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['forge-source-change', 'needs-maintainer-review']
            });

      - name: Post review guidance comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## AgentKit Forge Source Change Detected

            This PR modifies files in the AgentKit Forge source directories:
            - \`.agentkit/templates/\` — output templates
            - \`.agentkit/spec/\` — YAML specifications
            - \`.agentkit/engines/\` — sync engine code
            - \`.agentkit/overlays/\` — per-repo customizations
            - \`.agentkit/bin/\` — CLI scripts

            **These are the upstream source-of-truth for all generated AI tool configs.**

            ### Review checklist
            - [ ] Changes are intentional and not accidental AI agent modifications
            - [ ] Spec schema validation passes (\`pnpm -C .agentkit agentkit:spec-validate\`)
            - [ ] Sync produces expected output (\`pnpm -C .agentkit agentkit:sync\`)
            - [ ] No secrets or credentials in template variables
            - [ ] Breaking changes documented in an ADR

            > **AI agents**: Do not modify these files directly. Propose changes in a dedicated PR.`;

            // Check if we already posted this comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.body.includes('AgentKit Forge Source Change Detected')
            );

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Validate spec schemas
        run: node engines/node/src/cli.mjs spec-validate
        working-directory: .agentkit

      - name: Run sync and check for consistency
        run: |
          node engines/node/src/cli.mjs sync
          node engines/node/src/cli.mjs validate
        working-directory: .agentkit

      - name: Run tests
        run: pnpm test
        working-directory: .agentkit
