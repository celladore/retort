#
# Non-blocking CI job that validates retrospective records (issues and lessons).
# This workflow is informational — it MUST NOT be added to branch protection
# required checks. It runs on push to docs/history/issues/ and
# docs/history/lessons-learned/ and reports quality without gating merges.

name: Retrospective Quality

on:
  push:
    paths:
      - 'docs/history/issues/**'
      - 'docs/history/lessons-learned/**'
      - 'docs/history/.index.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-retrospective:
    runs-on: self-hosted
    # Non-blocking: continue-on-error ensures this never gates delivery
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate .index.json integrity
        run: |
          INDEX_FILE="docs/history/.index.json"
          if [ ! -f "$INDEX_FILE" ]; then
            echo "::warning::No .index.json found — skipping validation"
            exit 0
          fi

          # Validate JSON syntax
          if ! python3 -m json.tool "$INDEX_FILE" > /dev/null 2>&1; then
            echo "::error::docs/history/.index.json is not valid JSON"
            exit 1
          fi

          # Validate required sequence keys exist
          for key in issue lesson; do
            if ! python3 -c "import json; d=json.load(open('$INDEX_FILE')); assert '$key' in d.get('sequences', {})" 2>/dev/null; then
              echo "::warning::Missing sequence key '$key' in .index.json"
            fi
          done

          echo "OK — .index.json is valid"

      - name: Validate issue records
        run: |
          ISSUES_DIR="docs/history/issues"
          if [ ! -d "$ISSUES_DIR" ] || ! compgen -G "$ISSUES_DIR/[0-9]*.md" > /dev/null 2>&1; then
            echo "No issue records to validate"
            exit 0
          fi

          errors=0
          for file in "$ISSUES_DIR"/*.md; do
            [ "$(basename "$file")" = "README.md" ] && continue

            # Check required sections exist
            for section in "Summary" "Severity" "Status"; do
              if ! grep -qi "$section" "$file"; then
                echo "::warning file=$file::Missing section: $section"
                errors=$((errors + 1))
              fi
            done

            # Check naming convention: XXXX-YYYY-MM-DD-*-issue.md
            basename_file=$(basename "$file")
            if ! echo "$basename_file" | grep -qE '^[0-9]{4}-[0-9]{4}-[0-9]{2}-[0-9]{2}-.*-issue\.md$'; then
              echo "::warning file=$file::Filename does not match XXXX-YYYY-MM-DD-slug-issue.md convention"
              errors=$((errors + 1))
            fi
          done

          echo "Issue validation complete ($errors warnings)"

      - name: Validate lesson records
        run: |
          LESSONS_DIR="docs/history/lessons-learned"
          if [ ! -d "$LESSONS_DIR" ] || ! compgen -G "$LESSONS_DIR/[0-9]*.md" > /dev/null 2>&1; then
            echo "No lesson records to validate"
            exit 0
          fi

          errors=0
          for file in "$LESSONS_DIR"/*.md; do
            [ "$(basename "$file")" = "README.md" ] && continue

            # Check required sections exist
            for section in "Key Insight" "Category"; do
              if ! grep -qi "$section" "$file"; then
                echo "::warning file=$file::Missing section: $section"
                errors=$((errors + 1))
              fi
            done

            # Check naming convention: XXXX-YYYY-MM-DD-*-lesson.md
            basename_file=$(basename "$file")
            if ! echo "$basename_file" | grep -qE '^[0-9]{4}-[0-9]{4}-[0-9]{2}-[0-9]{2}-.*-lesson\.md$'; then
              echo "::warning file=$file::Filename does not match XXXX-YYYY-MM-DD-slug-lesson.md convention"
              errors=$((errors + 1))
            fi
          done

          echo "Lesson validation complete ($errors warnings)"

      - name: Summary
        if: always()
        run: |
          issue_count=$(find docs/history/issues -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l || echo 0)
          lesson_count=$(find docs/history/lessons-learned -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l || echo 0)
          echo "## Retrospective Records" >> $GITHUB_STEP_SUMMARY
          echo "- Issues: $issue_count" >> $GITHUB_STEP_SUMMARY
          echo "- Lessons: $lesson_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_This check is non-blocking and does not gate merges._" >> $GITHUB_STEP_SUMMARY
