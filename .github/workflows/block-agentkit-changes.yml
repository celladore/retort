name: Block AgentKit Changes

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-agentkit-changes:
    name: Check for .agentkit changes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect .agentkit changes
        shell: bash
        run: |
          if [[ "${{ github.repository }}" == "JustAGhosT/agentkit-forge" ]]; then
            echo "Info: Skipping .agentkit/ change block for exception repository JustAGhosT/agentkit-forge."
            exit 0
          fi

          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)

          if echo "$CHANGED" | grep -qE '^\.agentkit/'; then
            echo "Error: Changes under .agentkit/ are not allowed in pull requests to main/dev."
            exit 1
          fi

          echo "No forbidden .agentkit/ changes detected."
