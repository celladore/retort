# Repo-specific editor theme override
# This file is copied by `agentkit init` and customized per repo.
# Uncomment and fill in to override the shared editor-theme.yaml spec.
# Only include fields you want to override — everything else inherits.

# enabled: true
# mode: dark  # light | dark | both

# Per-tool overrides — use direct hex or brand token references.
# These merge on top of the base light/dark mapping for that tool only.
# cursor:
#   sideBar.background: colors.neutral.900
#   activityBar.background: "#262A36"
#   statusBar.background: colors.secondary.lilac

# windsurf:
#   sideBar.background: colors.darkMode.surface
