# Retort repo overlay settings
# This is retort's own overlay — configures how the framework generates output for itself.
repoName: retort
defaultBranch: main # Production branch — never commit directly
integrationBranch: dev # PRs must target dev, not main
primaryStack: auto
windowsFirst: true

aiSynthesisLayer: false

renderTargets:
  - claude
  - cursor
  - windsurf
  - copilot
  - gemini
  - codex
  - warp
  - cline
  - roo
  - ai
  - mcp
  - junie

featurePreset: standard

# Suppress date churn in generated file headers (issue #417).
# 'none' writes an empty string for {{syncDate}} so headers are stable across runs.
syncDateMode: none

# Retort itself runs sync before every push to catch generated-file drift early.
# New adopters get autoSyncOnPush: false (the framework default).
autoSyncOnPush: true
