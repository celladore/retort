name: Documentation Validation

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  documentation-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation requirement
        id: doc-check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x ./scripts/check-documentation-requirement.sh
          ./scripts/check-documentation-requirement.sh

      - name: Validate documentation structure
        id: doc-structure
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-documentation.sh
          ./scripts/validate-documentation.sh 2>&1 | tee /tmp/doc-structure.txt

      - name: Validate sequential numbering
        id: doc-numbering
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-numbering.sh
          ./scripts/validate-numbering.sh 2>&1 | tee /tmp/doc-numbering.txt

      - name: Report validation results
        if: steps.doc-structure.outcome == 'failure' || steps.doc-numbering.outcome == 'failure'
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          {
            echo "## Documentation Validation Issues"
