# GENERATED by AgentKit Forge v{{version}} — DO NOT EDIT
# Source: .agentkit/spec + .agentkit/overlays/{{repoName}}
# Regenerate: pnpm -C .agentkit agentkit:sync
#
# Collects code coverage from test runs and reports regressions on PRs.
# Non-blocking (continue-on-error). Threshold defaults to {{testingCoverage}}%
# from project.yaml; override with COVERAGE_THRESHOLD env var in repo settings.

name: Coverage Report

on:
  pull_request:
    branches: [{{protectedBranches}}]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-node:
    name: Node.js coverage
    runs-on: self-hosted
    continue-on-error: true
    if: hashFiles('package.json') != '' || hashFiles('**/package.json') != ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: {{nodeVersion}}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Detect project root
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          elif [ -f .agentkit/pnpm-lock.yaml ]; then
            echo "project_dir=.agentkit" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "cmd=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "cmd=yarn" >> $GITHUB_OUTPUT
          else
            echo "cmd=npm" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ steps.detect.outputs.project_dir }}

      - name: Install dependencies
        run: |
          PM="${{ steps.pm.outputs.cmd }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile 2>/dev/null || true ;;
            yarn) yarn install --frozen-lockfile 2>/dev/null || true ;;
            *)    npm ci 2>/dev/null || npm install --no-audit --prefer-offline 2>/dev/null || true ;;
          esac
        working-directory: ${{ steps.detect.outputs.project_dir }}

      - name: Run tests with coverage
        run: |
          PM="${{ steps.pm.outputs.cmd }}"

          # Try coverage script first, fall back to test with coverage flag
          if $PM run coverage 2>/dev/null; then
            echo "Ran dedicated coverage script"
          elif $PM run vitest -- run --coverage 2>/dev/null; then
            echo "Ran vitest with coverage"
          elif $PM run jest -- --coverage 2>/dev/null; then
            echo "Ran jest with coverage"
          else
            echo "::notice::No coverage runner detected — running tests without coverage"
            $PM test || true
          fi
        working-directory: ${{ steps.detect.outputs.project_dir }}

      - name: Parse coverage summary
        id: coverage
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY

          # Look for common coverage output files
          COVERAGE_FILE=""
          for candidate in coverage/coverage-summary.json .agentkit/coverage/coverage-summary.json; do
            if [ -f "$candidate" ]; then
              COVERAGE_FILE="$candidate"
              break
            fi
          done

          if [ -n "$COVERAGE_FILE" ]; then
            COVERAGE_FILE="$COVERAGE_FILE" python3 -c "
          import json, os
          with open(os.environ['COVERAGE_FILE']) as f:
              data = json.load(f)
          total = data.get('total', {})
          lines = total.get('lines', {}).get('pct', 0)
          branches = total.get('branches', {}).get('pct', 0)
          functions = total.get('functions', {}).get('pct', 0)
          stmts = total.get('statements', {}).get('pct', 0)
          print(f'| Metric | Coverage |')
          print(f'|--------|----------|')
          print(f'| Lines | {lines}% |')
          print(f'| Branches | {branches}% |')
          print(f'| Functions | {functions}% |')
          print(f'| Statements | {stmts}% |')
          # Write coverage to GITHUB_OUTPUT for threshold enforcement
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'lines={lines}\n')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage-summary.json found — coverage data unavailable" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Configure your test runner to output coverage-summary.json for automated tracking"
          fi

      - name: Enforce threshold
        if: env.COVERAGE_THRESHOLD != '' || '{{testingCoverage}}' != ''
        env:
          COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD }}
        run: |
          THRESHOLD="${COVERAGE_THRESHOLD:-{{testingCoverage}}}"
          ACTUAL="${{ steps.coverage.outputs.lines }}"
          if [ -n "$ACTUAL" ] && [ "$THRESHOLD" -gt 0 ] 2>/dev/null && awk "BEGIN {exit !($ACTUAL < $THRESHOLD)}" 2>/dev/null; then
            echo "::warning::Line coverage ${ACTUAL}% is below threshold ${THRESHOLD}%"
          fi

{{#if hasLanguageRust}}
  coverage-rust:
    name: Rust coverage
    runs-on: self-hosted
    continue-on-error: true
    if: hashFiles('Cargo.toml') != ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin 2>/dev/null || true

      - name: Run coverage
        run: |
          echo "## Rust Coverage" >> $GITHUB_STEP_SUMMARY
          if command -v cargo-tarpaulin &>/dev/null; then
            cargo tarpaulin --out json --output-dir /tmp 2>&1 || true
            if [ -f /tmp/tarpaulin-report.json ]; then
              python3 -c "
          import json
          with open('/tmp/tarpaulin-report.json') as f:
              data = json.load(f)
          covered = sum(1 for f in data.get('files', []) for t in f.get('traces', []) if t.get('stats', {}).get('Line', 0) > 0)
          total = sum(len(f.get('traces', [])) for f in data.get('files', []))
          pct = (covered / total * 100) if total > 0 else 0
          print(f'Line coverage: {pct:.1f}%')
          " >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "cargo-tarpaulin not available — skipping" >> $GITHUB_STEP_SUMMARY
          fi
{{/if}}

  summary:
    name: Coverage summary
    runs-on: self-hosted
    needs: [coverage-node{{#if hasLanguageRust}}, coverage-rust{{/if}}]
    if: always()
    steps:
      - name: Report
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Coverage threshold: {{testingCoverage}}% (from project.yaml). Override with COVERAGE_THRESHOLD env var._" >> $GITHUB_STEP_SUMMARY
