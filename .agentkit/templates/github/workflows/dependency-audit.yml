# GENERATED by AgentKit Forge v{{version}} — DO NOT EDIT
# Source: .agentkit/spec + .agentkit/overlays/{{repoName}}
# Regenerate: pnpm -C .agentkit agentkit:sync
#
# Non-blocking dependency audit. Runs when lockfiles or manifests change.
# Reports vulnerabilities and license issues as annotations — MUST NOT be
# added to branch protection required checks.

name: Dependency Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - '**/pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '*.csproj'
      - 'Directory.Packages.props'

jobs:
  audit-node:
    name: Node.js dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('package.json') != '' || hashFiles('**/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || npm ci 2>/dev/null || true

      - name: Run npm audit
        run: |
          echo "## Node.js Dependency Audit" >> $GITHUB_STEP_SUMMARY

          # Try pnpm audit first, fall back to npm audit
          if command -v pnpm &>/dev/null && [ -f pnpm-lock.yaml ]; then
            if pnpm audit --json 2>/dev/null | tee /tmp/audit.json | python3 -c "
import json, sys
data = json.load(sys.stdin)
advisories = data.get('advisories', {})
if advisories:
    print(f'::warning::Found {len(advisories)} vulnerability advisories')
    for id, adv in list(advisories.items())[:10]:
        severity = adv.get('severity', 'unknown')
        title = adv.get('title', 'Unknown')
        module_name = adv.get('module_name', 'unknown')
        print(f'::warning::{severity.upper()}: {module_name} — {title}')
" 2>/dev/null; then
              echo "Audit complete — see annotations above" >> $GITHUB_STEP_SUMMARY
            else
              echo "No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ -f package-lock.json ]; then
            npm audit --json 2>/dev/null | python3 -c "
import json, sys
try:
    data = json.load(sys.stdin)
    vulns = data.get('vulnerabilities', {})
    if vulns:
        print(f'::warning::Found {len(vulns)} vulnerabilities')
        for name, info in list(vulns.items())[:10]:
            severity = info.get('severity', 'unknown')
            print(f'::warning::{severity.upper()}: {name}')
except Exception: pass
" 2>/dev/null || echo "Audit parsing skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for new dependencies in diff
        run: |
          # Detect newly added dependencies in the PR
          BASE="${{ github.base_ref }}"
          git diff "origin/${BASE}...HEAD" -- package.json '*/package.json' 2>/dev/null | \
            grep -E '^\+.*"(dependencies|devDependencies|peerDependencies)"' -A 50 | \
            grep -E '^\+\s+"[^"]+":\s+"' | \
            sed 's/^\+\s*//' | while IFS= read -r line; do
              pkg=$(echo "$line" | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
              echo "::notice::New dependency added: $pkg — verify it is well-maintained and license-compatible"
            done

  audit-rust:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('Cargo.toml') != '' || hashFiles('**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit 2>/dev/null || true

      - name: Run cargo audit
        run: |
          echo "## Rust Dependency Audit" >> $GITHUB_STEP_SUMMARY
          if command -v cargo-audit &>/dev/null; then
            cargo audit 2>&1 | tee /tmp/cargo-audit.txt
            if grep -q "Crate:" /tmp/cargo-audit.txt; then
              echo "::warning::cargo audit found vulnerabilities — see log output"
              echo "Vulnerabilities found — see job log" >> $GITHUB_STEP_SUMMARY
            else
              echo "No known vulnerabilities" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "cargo-audit not available — skipping" >> $GITHUB_STEP_SUMMARY
          fi

  audit-python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements*.txt') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit 2>/dev/null || true

      - name: Run pip-audit
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          if command -v pip-audit &>/dev/null; then
            if [ -f requirements.txt ]; then
              pip-audit -r requirements.txt 2>&1 | tee /tmp/pip-audit.txt || true
            elif [ -f pyproject.toml ]; then
              pip-audit 2>&1 | tee /tmp/pip-audit.txt || true
            fi
            if [ -f /tmp/pip-audit.txt ] && grep -q "VULN" /tmp/pip-audit.txt; then
              echo "::warning::pip-audit found vulnerabilities — see log output"
            else
              echo "No known vulnerabilities" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "pip-audit not available — skipping" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Audit summary
    runs-on: ubuntu-latest
    needs: [audit-node, audit-rust, audit-python]
    if: always()
    steps:
      - name: Report
        run: |
          echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "_This check is non-blocking and does not gate merges._" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stack | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ needs.audit-node.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust | ${{ needs.audit-rust.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.audit-python.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
