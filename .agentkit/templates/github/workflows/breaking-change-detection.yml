# GENERATED by AgentKit Forge v{{version}} — DO NOT EDIT
# Source: .agentkit/spec + .agentkit/overlays/{{repoName}}
# Regenerate: pnpm -C .agentkit agentkit:sync
#
# Detects potential breaking changes in PRs by analyzing version files,
# changelogs, public API surfaces, and export maps. Non-blocking — reports
# as annotations. MUST NOT be added to branch protection required checks.

name: Breaking Change Detection

on:
  pull_request:
    branches: [main, dev]

jobs:
  detect:
    name: Detect breaking changes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version file changes
        run: |
          echo "## Breaking Change Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          BASE="${{ github.base_ref }}"
          DIFF=$(git diff "origin/${BASE}...HEAD" --name-only)

          # Track version-bearing files that changed
          VERSION_FILES_CHANGED=false
          for pattern in package.json Cargo.toml pyproject.toml *.csproj; do
            if echo "$DIFF" | grep -q "$pattern"; then
              VERSION_FILES_CHANGED=true
              echo "::notice::Version file changed: $(echo "$DIFF" | grep "$pattern" | head -5 | tr '\n' ', ')"
            fi
          done

          echo "version_changed=$VERSION_FILES_CHANGED" >> $GITHUB_ENV

      - name: Check for version bump on breaking changes
        run: |
          BASE="${{ github.base_ref }}"

          # Look for indicators of breaking changes in the diff
          BREAKING_INDICATORS=0
          DETAILS=""

          # 1. Removed exports (JS/TS)
          REMOVED_EXPORTS=$(git diff "origin/${BASE}...HEAD" -- '*.ts' '*.js' '*.tsx' '*.jsx' | \
            grep -c '^-export ' 2>/dev/null || echo "0")
          if [ "$REMOVED_EXPORTS" -gt 0 ]; then
            BREAKING_INDICATORS=$((BREAKING_INDICATORS + 1))
            DETAILS="${DETAILS}\n- $REMOVED_EXPORTS export statement(s) removed"
            echo "::warning::$REMOVED_EXPORTS export statement(s) removed — potential breaking change"
          fi

          # 2. Changed function signatures (added required params, changed return types)
          CHANGED_SIGS=$(git diff "origin/${BASE}...HEAD" -- '*.ts' '*.js' '*.tsx' '*.jsx' | \
            grep -cE '^-\s*(export\s+)?(async\s+)?function\s+' 2>/dev/null || echo "0")
          if [ "$CHANGED_SIGS" -gt 0 ]; then
            BREAKING_INDICATORS=$((BREAKING_INDICATORS + 1))
            DETAILS="${DETAILS}\n- $CHANGED_SIGS public function signature(s) modified"
            echo "::warning::$CHANGED_SIGS public function signature(s) modified — verify backwards compatibility"
          fi

          # 3. Removed public methods (any language with class syntax)
          REMOVED_METHODS=$(git diff "origin/${BASE}...HEAD" | \
            grep -cE '^-\s*public\s+(static\s+)?(async\s+)?\w+' 2>/dev/null || echo "0")
          if [ "$REMOVED_METHODS" -gt 0 ]; then
            BREAKING_INDICATORS=$((BREAKING_INDICATORS + 1))
            DETAILS="${DETAILS}\n- $REMOVED_METHODS public method(s) removed"
            echo "::warning::$REMOVED_METHODS public method(s) removed — breaking change"
          fi

          # 4. Database migration files added (schema change)
          MIGRATIONS=$(git diff "origin/${BASE}...HEAD" --name-only | \
            grep -cE '(migrations?|migrate)/' 2>/dev/null || echo "0")
          if [ "$MIGRATIONS" -gt 0 ]; then
            DETAILS="${DETAILS}\n- $MIGRATIONS migration file(s) added"
            echo "::notice::$MIGRATIONS migration file(s) detected — verify rollback strategy"
          fi

          # 5. Check if CHANGELOG was updated when breaking changes detected
          if [ "$BREAKING_INDICATORS" -gt 0 ]; then
            CHANGELOG_UPDATED=$(git diff "origin/${BASE}...HEAD" --name-only | grep -ci 'CHANGELOG' || echo "0")
            if [ "$CHANGELOG_UPDATED" -eq 0 ]; then
              echo "::warning::Breaking changes detected but CHANGELOG.md was not updated"
              DETAILS="${DETAILS}\n- ⚠ CHANGELOG.md not updated"
            fi
          fi

          # Summary table
          echo "### Indicators" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BREAKING_INDICATORS" -gt 0 ]; then
            echo "**$BREAKING_INDICATORS potential breaking change indicator(s) found:**" >> $GITHUB_STEP_SUMMARY
            echo -e "$DETAILS" >> $GITHUB_STEP_SUMMARY
          else
            echo "No breaking change indicators detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check deprecation markers
        run: |
          BASE="${{ github.base_ref }}"

          # Find newly added deprecation markers
          NEW_DEPRECATIONS=$(git diff "origin/${BASE}...HEAD" | \
            grep -cE '^\+.*(@deprecated|@obsolete|DEPRECATED|TODO.*deprecat)' 2>/dev/null || echo "0")

          # Find removed deprecation markers (cleanup)
          REMOVED_DEPRECATIONS=$(git diff "origin/${BASE}...HEAD" | \
            grep -cE '^-.*(@deprecated|@obsolete|DEPRECATED)' 2>/dev/null || echo "0")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deprecations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| New deprecation markers | $NEW_DEPRECATIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| Removed deprecation markers | $REMOVED_DEPRECATIONS |" >> $GITHUB_STEP_SUMMARY

          if [ "$NEW_DEPRECATIONS" -gt 0 ]; then
            echo "::notice::$NEW_DEPRECATIONS new deprecation marker(s) added — verify migration path is documented"
          fi
          if [ "$REMOVED_DEPRECATIONS" -gt 0 ]; then
            echo "::notice::$REMOVED_DEPRECATIONS deprecation marker(s) removed — verify the deprecated API was actually removed"
          fi

      - name: Final summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_This check is non-blocking and does not gate merges._" >> $GITHUB_STEP_SUMMARY
