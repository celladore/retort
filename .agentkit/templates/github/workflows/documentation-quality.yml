# GENERATED by AgentKit Forge v{{version}} — DO NOT EDIT
# Source: .agentkit/spec + .agentkit/overlays/{{repoName}}
# Regenerate: pnpm -C .agentkit agentkit:sync
#
# Lints and validates documentation quality for history records.
# Required on main (hard error). Warning-only on dev (surfaces issues without blocking).

name: Documentation Quality

on:
  push:
    paths:
      - '{{docsHistoryPath}}/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .agentkit/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: {{nodeVersion}}
          cache: 'pnpm'
          cache-dependency-path: .agentkit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .agentkit

      - name: Lint history markdown
        id: mdlint
        continue-on-error: true
        run: >
          pnpm markdownlint-cli2
          --config ../.markdownlint.json
          "../{{docsHistoryPath}}/**/*.md"
          2>&1 | tee /tmp/mdlint-output.txt
        working-directory: .agentkit

      - name: Validate document structure
        id: doc-structure
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-documentation.sh
          ./scripts/validate-documentation.sh 2>&1 | tee /tmp/doc-structure.txt

      - name: Validate sequential numbering
        id: doc-numbering
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-numbering.sh
          ./scripts/validate-numbering.sh 2>&1 | tee /tmp/doc-numbering.txt

      - name: Report results
        if: steps.mdlint.outcome == 'failure' || steps.doc-structure.outcome == 'failure' || steps.doc-numbering.outcome == 'failure'
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "## Documentation Quality Issues"
            echo ""
            if [ "${{ steps.mdlint.outcome }}" = "failure" ]; then
              echo "### Markdown lint"
              echo '```'
              head -30 /tmp/mdlint-output.txt
              echo '```'
            fi
            if [ "${{ steps.doc-structure.outcome }}" = "failure" ]; then
              echo "### Structure validation"
              echo '```'
              head -30 /tmp/doc-structure.txt
              echo '```'
            fi
            if [ "${{ steps.doc-numbering.outcome }}" = "failure" ]; then
              echo "### Sequential numbering"
              echo '```'
              head -30 /tmp/doc-numbering.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CURRENT_BRANCH" = "main" ]; then
            echo "::error::Documentation quality checks failed on main."
            exit 1
          else
            echo "::warning::Documentation quality issues found. These must be fixed before merging to main."
          fi
