# GENERATED by Retort — DO NOT EDIT
# Source: .agentkit/spec + .agentkit/overlays/{{repoName}}
# Regenerate: {{packageManager}} -C .agentkit retort:sync
#
# Lints and validates documentation quality for history records.
# Hard error on every branch. This previously errored only when the PR targeted
# `main`, which under a dev-based release train meant the gate could fire only on
# the aggregate promote-to-main PR — the worst possible place to discover a docs
# defect. Enforcement now happens on the PR that introduces the defect.

name: Documentation Quality

on:
  push:
    paths:
      - '{{docsHistoryPath}}/**'
  pull_request:
    paths:
      - '{{docsHistoryPath}}/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

{{#if isPnpm}}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: .agentkit/package.json

{{/if}}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: {{nodeVersion}}
          cache: '{{pmCacheKey}}'
          cache-dependency-path: .agentkit/{{pmLockfile}}

      - name: Install dependencies
        run: {{pmInstall}}
        working-directory: .agentkit

      - name: Lint history markdown
        id: mdlint
        continue-on-error: true
        run: >
          {{pmRun}} markdownlint-cli2
          --config ../.markdownlint.json
          "../{{docsHistoryPath}}/**/*.md"
          2>&1 | tee /tmp/mdlint-output.txt
        working-directory: .agentkit

      - name: Validate document structure
        id: doc-structure
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-documentation.sh
          ./scripts/validate-documentation.sh 2>&1 | tee /tmp/doc-structure.txt

      - name: Validate sequential numbering
        id: doc-numbering
        continue-on-error: true
        run: |
          chmod +x ./scripts/validate-numbering.sh
          ./scripts/validate-numbering.sh 2>&1 | tee /tmp/doc-numbering.txt

      - name: Report results
        if: steps.mdlint.outcome == 'failure' || steps.doc-structure.outcome == 'failure' || steps.doc-numbering.outcome == 'failure'
        run: |
          {
            echo "## Documentation Quality Issues"
            echo ""
            if [ "${{ steps.mdlint.outcome }}" = "failure" ]; then
              echo "### Markdown lint"
              echo '```'
              head -30 /tmp/mdlint-output.txt
              echo '```'
            fi
            if [ "${{ steps.doc-structure.outcome }}" = "failure" ]; then
              echo "### Structure validation"
              echo '```'
              head -30 /tmp/doc-structure.txt
              echo '```'
            fi
            if [ "${{ steps.doc-numbering.outcome }}" = "failure" ]; then
              echo "### Sequential numbering"
              echo '```'
              head -30 /tmp/doc-numbering.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Documentation quality checks failed."
          exit 1
