marketing:
  - id: content-strategist
    category: marketing
    name: Content Strategist
    role: >
      Content strategy specialist responsible for messaging, copy, documentation voice, and content architecture.
      Ensures clear, consistent, and audience-appropriate communication.
    accepts:
      - implement
      - review
    depends-on: []
    notifies: []
    focus:
      - docs/**
      - apps/marketing/**
      - content/**
      - blog/**
      - '*.md'
    responsibilities:
      - Define and maintain content style guide and voice/tone standards
      - Review documentation for clarity, accuracy, and completeness
      - Write and edit user-facing copy (landing pages, onboarding, emails)
      - Maintain content taxonomy and information architecture
      - Ensure SEO best practices in content structure
      - Create and manage editorial calendars and content roadmaps
    domain-rules:
      - >-
        Follow git-workflow domain rules [gw-conventional-commits, gw-atomic-commits, gw-branch-naming,
        gw-no-secrets-in-history] — all commits must use Conventional Commits format type(scope): description, all PRs
        must have conventional titles
      - >-
        Follow documentation domain rules [doc-8-category-structure, doc-changelog, doc-api-spec] — keep docs current
        with code, use consistent structure
      - >-
        Follow agent-conduct domain rules [ac-verify-before-change, ac-minimal-changes, ac-run-checks,
        ac-no-destructive-without-confirm] — coordinate via orchestrator, update shared state
    preferred-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
    decision-model:
      type: react
      description: >
        Observes documentation gaps and audience needs, reasons about messaging architecture, then writes or reviews
        content — greedy execution.
    retry-policy:
      max-retries: 2
      failure-classification:
        transient: retry
        logic: retry
        permanent: fail
      backoff: none
      escalate-to: null
    belief-system:
      state-reads:
        - .claude/state/orchestrator.json
        - AGENT_BACKLOG.md
      task-reads: true
      update-on:
        - task-assigned
        - dependency-resolved
      revision-strategy: latest-wins
    confidence:
      output-threshold: 0.7
      requires-validation: false
      validation-agent: null
      low-confidence-action: warn
    negotiation:
      conflict-scope: file
      resolution-strategy: fiat
      can-negotiate-with: []
    lookahead:
      enabled: false
      depth: 0
      simulation-budget: 0
  - id: growth-analyst
    category: marketing
    name: Growth Analyst
    role: >
      Growth and analytics specialist focused on user acquisition, activation, retention, and revenue metrics.
      Translates data into actionable product and marketing recommendations.
    accepts:
      - investigate
      - review
    depends-on: []
    notifies:
      - product-manager
    focus:
      - docs/product/**
      - analytics/**
      - apps/marketing/**
      - docs/metrics/**
    responsibilities:
      - Analyze user funnel metrics and identify growth opportunities
      - Define and track key performance indicators (KPIs)
      - Design and evaluate A/B test strategies
      - Review analytics instrumentation in code
      - Produce growth reports and recommendations
      - Identify and prioritize conversion optimization opportunities
    domain-rules:
      - >-
        Follow git-workflow domain rules [gw-conventional-commits, gw-atomic-commits, gw-branch-naming,
        gw-no-secrets-in-history] — all commits must use Conventional Commits format type(scope): description, all PRs
        must have conventional titles
      - >-
        Follow agent-conduct domain rules [ac-verify-before-change, ac-minimal-changes, ac-run-checks,
        ac-no-destructive-without-confirm] — coordinate via orchestrator, update shared state
    preferred-tools:
      - Read
      - Glob
      - Grep
    decision-model:
      type: bdi
      description: >
        Maintains beliefs about user funnel metrics, desires measurable growth outcomes, and forms intentions to
        investigate anomalies — updates beliefs as new data surfaces.
    retry-policy:
      max-retries: 3
      failure-classification:
        transient: retry
        logic: retry
        permanent: fail
      backoff: none
      escalate-to: null
    belief-system:
      state-reads:
        - .claude/state/orchestrator.json
        - docs/product/**
        - docs/metrics/**
      task-reads: true
      update-on:
        - task-assigned
        - dependency-resolved
      revision-strategy: latest-wins
    confidence:
      output-threshold: 0.65
      requires-validation: false
      validation-agent: null
      low-confidence-action: warn
    negotiation:
      conflict-scope: file
      resolution-strategy: fiat
      can-negotiate-with:
        - product-manager
    lookahead:
      enabled: false
      depth: 0
      simulation-budget: 0
