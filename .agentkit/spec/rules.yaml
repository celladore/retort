# =============================================================================
# rules.yaml — Domain-specific coding rules and standards
# Canonical source of truth for agentkit-forge
# Version: 0.2.0
# =============================================================================
# Rules are organized by domain. Each rule set defines conventions, tooling
# requirements, and quality gates that agents must enforce.
#
# Convention fields:
#   id         (required)  Unique identifier for the convention
#   rule       (required)  Human-readable description of the convention
#   severity   (required)  critical | error | warning | info
#   type       (optional)  advisory | enforcement (default: advisory)
#                          - advisory:    guidance for agents; violations are
#                            flagged but do not block CI or tool execution
#                          - enforcement: hard constraint; violations must block
#                            CI, fail quality gates, or be prevented by hooks
#   phase      (optional)  Lifecycle phase(s) where the convention applies:
#                          discovery | planning | implementation | validation | ship
#                          Accepts a single value or list. When omitted the
#                          convention applies to all phases.
#   autofix    (optional)  true | false — whether the tool can auto-remediate
#   tool       (optional)  CLI command that checks or fixes the convention
#   applies-to (optional)  Narrows the parent domain's file globs
#   exceptions (optional)  File globs excluded from this convention
#   examples   (optional)  valid/invalid usage examples
# =============================================================================

rules:
  # ===========================================================================
  # TypeScript / JavaScript
  # ===========================================================================
  - domain: typescript
    description: >
      Standards for all TypeScript and JavaScript code across the repository.
      Covers linting, formatting, type safety, and accessibility.
    applies-to:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.mts'
    conventions:
      - id: ts-lint
        rule: 'All code must pass ESLint with the project configuration'
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'eslint --fix'

      - id: ts-format
        rule: 'All code must be formatted with Prettier'
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'prettier --write'

      - id: ts-explicit-types
        rule: >
          All exported functions, classes, and module boundaries must have
          explicit type annotations. Inferred types are acceptable only for
          local variables and private implementation details.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: ts-no-any
        rule: >
          Avoid 'any' type. Use 'unknown' with type guards when the type
          is truly dynamic. Exceptions require a comment explaining why.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: ts-wcag-aa
        rule: >
          All UI components must meet WCAG AA accessibility standards. This
          includes: semantic HTML, ARIA attributes where needed, keyboard
          navigation support, sufficient color contrast (4.5:1 for normal
          text, 3:1 for large text), and screen reader compatibility.
        severity: error
        type: advisory
        phase:
          - implementation
          - validation
        autofix: false
        applies-to:
          - '**/*.tsx'
          - '**/*.jsx'
          - 'components/**'

      - id: ts-no-console
        rule: >
          No console.log in production code. Use the project's structured
          logger instead. console.log is acceptable in scripts/ and test files.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: ts-strict-null
        rule: >
          Strict null checks must be enabled. Handle null/undefined explicitly
          rather than relying on truthiness checks for non-boolean values.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

  # ===========================================================================
  # .NET / C#
  # ===========================================================================
  - domain: dotnet
    description: >
      Standards for all .NET and C# code. Emphasizes dependency injection,
      clean architecture layering, and API backwards compatibility.
    applies-to:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
    conventions:
      - id: dn-dependency-injection
        rule: >
          All services must use constructor-based dependency injection.
          Service registration must be in dedicated extension methods
          (e.g., AddMyFeatureServices). Never use the service locator
          anti-pattern.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: dn-clean-layering
        rule: >
          Follow clean architecture layering: Domain has no external
          dependencies, Application depends only on Domain, Infrastructure
          implements interfaces defined in Application, and Presentation
          depends on Application. No layer may bypass the layer directly
          above it.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: dn-ports-adapters
        rule: >
          Use ports and adapters (hexagonal architecture) for all external
          integrations. Define port interfaces in the Application layer
          and implement adapters in the Infrastructure layer. This ensures
          external dependencies are always behind abstractions.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: dn-backwards-compat
        rule: >
          Public API surfaces must maintain backwards compatibility. Breaking
          changes require a version bump, deprecation notice in the prior
          version, and migration documentation. Use API versioning for
          HTTP endpoints.
        severity: error
        type: advisory
        phase:
          - implementation
          - validation
        autofix: false

      - id: dn-format
        rule: "All code must pass 'dotnet format' with the project editorconfig"
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'dotnet format'

      - id: dn-nullable
        rule: >
          Nullable reference types must be enabled. All reference type
          parameters and return values must be explicitly nullable or
          non-nullable.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

  # ===========================================================================
  # Python
  # ===========================================================================
  - domain: python
    description: >
      Standards for all Python code. Covers linting, formatting, testing,
      and architectural boundaries for IO.
    applies-to:
      - '**/*.py'
      - 'pyproject.toml'
    conventions:
      - id: py-lint
        rule: 'All code must pass ruff check with the project configuration'
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'ruff check --fix'

      - id: py-format
        rule: 'All code must be formatted with black'
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'black'

      - id: py-test-coverage
        rule: >
          All modules must have corresponding pytest test files. New code
          must include tests. Coverage must not decrease from the current
          baseline. Use pytest fixtures for test setup and parameterize
          for variant testing.
        severity: error
        type: enforcement
        phase: validation
        autofix: false
        tool: 'python -m pytest --cov'

      - id: py-io-boundaries
        rule: 'IO operations (file system, network, database) must be isolated at module boundaries using dependency injection or explicit IO boundary patterns. Core logic must be pure and testable without mocking IO. Use protocols (typing.Protocol) to define IO interfaces.'
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: py-type-hints
        rule: >
          All public functions and methods must have type hints. Use
          typing.Protocol for structural subtyping. Run mypy in strict
          mode for new modules.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false
        tool: 'mypy --strict'

      - id: py-docstrings
        rule: >
          All public modules, classes, and functions must have docstrings
          following Google style. Include Args, Returns, and Raises sections
          where applicable.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

  # ===========================================================================
  # Rust
  # ===========================================================================
  - domain: rust
    description: >
      Standards for all Rust code. Emphasizes explicit error handling,
      safety, and toolchain compliance.
    applies-to:
      - '**/*.rs'
      - 'Cargo.toml'
    conventions:
      - id: rs-error-handling
        rule: >
          Use explicit error handling with Result and Option types. Define
          custom error types using thiserror for libraries and anyhow for
          applications. Chain errors with context using .context() or
          .with_context().
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: rs-no-unwrap
        rule: >
          Never use .unwrap() or .expect() in non-test code. Use proper
          error propagation with the ? operator instead. In tests,
          .unwrap() is acceptable for assertions. Panicking in production
          code is a bug.
        severity: error
        type: advisory
        phase: implementation
        autofix: false
        exceptions:
          - '**/*.test.rs'
          - '**/tests/**'
          - '**/benches/**'

      - id: rs-clippy
        rule: >
          All code must pass 'cargo clippy' with no warnings. Use
          #[allow(clippy::...)] only with an explanatory comment when
          a lint is genuinely inapplicable.
        severity: error
        type: enforcement
        phase: validation
        autofix: false
        tool: 'cargo clippy -- -D warnings'

      - id: rs-fmt
        rule: "All code must be formatted with 'cargo fmt'"
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'cargo fmt'

      - id: rs-unsafe
        rule: >
          Minimize use of unsafe blocks. Every unsafe block must have a
          SAFETY comment explaining why the invariants are upheld. Prefer
          safe abstractions. New unsafe code requires review by a second
          contributor.
        severity: error
        type: advisory
        phase:
          - implementation
          - validation
        autofix: false

      - id: rs-documentation
        rule: >
          All public items must have documentation comments (///). Include
          examples in doc comments for complex APIs. Run 'cargo doc' with
          no warnings.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

  # ===========================================================================
  # Infrastructure as Code (Terraform / Terragrunt)
  # ===========================================================================
  - domain: iac
    description: >
      Standards for all Infrastructure as Code. Covers Terraform and Terragrunt
      conventions, resource naming, state management, and module design.
    applies-to:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/terragrunt.hcl'
      - '**/*.hcl'
      - 'infra/**'
      - 'terraform/**'
      - 'terragrunt/**'
      - 'modules/**'
    conventions:
      - id: iac-naming-convention
        rule: >
          All cloud resources must follow the naming convention
          {org}-{env}-{project}-{resourcetype}-{region}. Configure org and region
          in project.yaml (infrastructure.org, infrastructure.defaultRegion) or
          use Terraform variables — do not hardcode. Example placeholders:
          YOUR_ORG, YOUR_DEFAULT_REGION. Deviations require a comment explaining
          why. Use locals blocks to compose names from variables.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: iac-toolchain
        rule: >
          Use Terraform for resource definitions and Terragrunt for DRY
          configuration, remote state management, and environment orchestration.
          All environments must be managed through Terragrunt live configurations.
        severity: error
        type: advisory
        phase: planning
        autofix: false

      - id: iac-state-backend
        rule: >
          Terraform state must be stored remotely (Azure Storage / S3 / GCS)
          with locking enabled. Never commit .tfstate files. State backend
          configuration must be managed through Terragrunt to avoid duplication.
        severity: critical
        type: enforcement
        phase:
          - implementation
          - validation
        autofix: false

      - id: iac-modules
        rule: >
          Reusable infrastructure must be extracted into versioned Terraform
          modules. Modules must have README.md, variables.tf, outputs.tf,
          and examples/. Pin module versions in consumers — never use unversioned
          source references.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: iac-tagging
        rule: >
          All taggable resources must include the mandatory tags defined in
          project.yaml (infrastructure.tagging.mandatory). Use a shared
          locals block, Terragrunt inputs, or provider default_tags to
          enforce consistent tagging across all resources. Missing mandatory
          tags will block PR review. Optional tags from
          infrastructure.tagging.optional are recommended for cost analysis
          and lifecycle tracking. See .claude/rules/iac.md for examples.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

      - id: iac-plan-before-apply
        rule: >
          Always run 'terraform plan' (or 'terragrunt plan') and review the
          diff before applying. CI pipelines must include a plan stage with
          human approval gate before apply. Never use -auto-approve in
          production environments.
        severity: critical
        type: enforcement
        phase: ship
        autofix: false

      - id: iac-no-hardcoded-secrets
        rule: >
          Never hardcode secrets, connection strings, or credentials in .tf
          or .hcl files. Use Key Vault / Secrets Manager references, or pass
          secrets via environment variables in CI. Sensitive variables must
          be marked sensitive = true.
        severity: critical
        type: enforcement
        phase:
          - implementation
          - validation
        autofix: false

      - id: iac-fmt
        rule: "All Terraform code must pass 'terraform fmt -check'"
        severity: error
        type: enforcement
        phase: validation
        autofix: true
        tool: 'terraform fmt'

      - id: iac-validate
        rule: "All Terraform configurations must pass 'terraform validate'"
        severity: error
        type: enforcement
        phase: validation
        autofix: false
        tool: 'terraform validate'

      - id: iac-drift-detection
        rule: >
          Infrastructure drift must be detected and corrected. Do not manually
          modify resources managed by Terraform. If manual changes are necessary,
          import them into state immediately and update the configuration.
        severity: error
        type: advisory
        phase: ship
        autofix: false

  # ===========================================================================
  # Security
  # ===========================================================================
  - domain: security
    description: >
      Cross-cutting security rules that apply to all code in the repository.
      These rules take precedence over domain-specific rules when they conflict.
    applies-to:
      - '**/*'
    conventions:
      - id: sec-no-secrets
        rule: >
          Never read, print, log, or expose secrets, API keys, tokens,
          passwords, or connection strings in code, logs, or error messages.
          Use environment variables or secret managers. Never commit .env
          files, credentials, or private keys to version control.
        severity: critical
        type: enforcement
        autofix: false

      - id: sec-least-privilege
        rule: >
          Apply least privilege principle everywhere: IAM roles, database
          permissions, API scopes, file system access. Request only the
          minimum permissions required for the operation. Document why
          each permission is needed.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: sec-deny-by-default
        rule: >
          All access control must be deny-by-default. Authentication is
          required for all endpoints unless explicitly marked as public.
          Authorization checks must be performed at the handler level,
          not middleware alone. Default to most restrictive settings.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

      - id: sec-input-validation
        rule: >
          All external input must be validated and sanitized. Use schema
          validation libraries (zod, FluentValidation, pydantic, serde)
          at system boundaries. Never trust client-side validation alone.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: sec-dependency-audit
        rule: >
          Dependencies must be audited for known vulnerabilities before
          adoption and on a regular schedule. Pin dependency versions.
          Review transitive dependencies for supply chain risk.
        severity: warning
        type: advisory
        phase: validation
        autofix: false

      - id: sec-encryption
        rule: >
          Sensitive data must be encrypted at rest and in transit. Use
          TLS 1.2+ for all network communication. Use AES-256 or
          equivalent for data at rest. Never implement custom cryptography.
        severity: error
        type: advisory
        phase:
          - planning
          - implementation
        autofix: false

  # ===========================================================================
  # Blockchain
  # ===========================================================================
  - domain: blockchain
    description: >
      Standards for blockchain integrations including Solana, EtherLink, and
      x402 payment protocol patterns.
    applies-to:
      - '**/*.sol'
      - '**/blockchain/**'
      - '**/web3/**'
      - '**/contracts/**'
      - '**/programs/**'
    conventions:
      - id: bc-solana
        rule: >
          Solana programs must use Anchor framework conventions. Validate
          all account constraints using Anchor macros. Use PDAs (Program
          Derived Addresses) for deterministic account addressing. All
          instructions must have explicit error codes and documentation.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: bc-etherlink
        rule: >
          EtherLink integrations must follow the bridge contract pattern.
          Validate all cross-chain messages. Implement replay protection.
          Use the canonical EtherLink SDK for L1-L2 communication.
          Handle finality differences between L1 and L2 explicitly.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: bc-x402
        rule: >
          x402 payment protocol implementations must follow the HTTP 402
          payment-required flow. Implement proper payment verification
          before granting resource access. Support idempotent payment
          processing. Include receipt generation and verification.
          Handle payment timeout and retry scenarios.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: bc-gas-optimization
        rule: >
          Optimize for gas costs. Minimize storage operations, batch
          transactions where possible, and use calldata over memory
          for read-only function parameters. Document gas cost estimates
          for public functions.
        severity: warning
        type: advisory
        phase:
          - implementation
          - validation
        autofix: false

      - id: bc-audit-trail
        rule: >
          All state-changing operations must emit events for off-chain
          indexing. Include sufficient context in events for reconstruction
          of state transitions. Log transaction hashes for cross-reference.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

  # ===========================================================================
  # Testing & Quality Assurance
  # ===========================================================================
  - domain: testing
    description: >
      Standards for all tests and quality assurance processes.
      Covers test pyramid balance, coverage targets, naming conventions,
      and CI quality gates.
    applies-to:
      - '**/*.test.*'
      - '**/*.spec.*'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright/**'
      - 'vitest.config.*'
      - 'jest.config.*'
      - 'playwright.config.*'
    conventions:
      - id: qa-coverage-threshold
        rule: >
          Test coverage must meet or exceed the project target. No PR may
          decrease overall coverage. Enforce the threshold in CI so that
          the build fails when coverage drops below the configured minimum.
        severity: error
        type: enforcement
        phase: validation
        autofix: false
        tool: 'vitest run --coverage'

      - id: qa-test-naming
        rule: >
          Test files must mirror the source structure and use the pattern
          <module>.test.<ext> or <module>.spec.<ext>. Describe blocks must
          name the unit under test; it/test blocks must describe the
          expected behaviour in plain English using the format
          "should <verb> <expected outcome>".
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: qa-aaa-pattern
        rule: >
          Every test body must follow the Arrange-Act-Assert (AAA) pattern.
          Use blank lines or comments to separate the three sections.
          Keep each test focused on a single behaviour; split compound
          assertions into separate tests.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: qa-no-sleep
        rule: >
          Never use arbitrary sleep or delay calls (setTimeout, Thread.Sleep,
          time.sleep) in tests. Use deterministic waits, polling helpers,
          or test framework utilities (waitFor, waitUntil) instead.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: qa-mock-boundaries
        rule: >
          Mock external dependencies (HTTP clients, databases, queues)
          at system boundaries, not internal module details. Prefer
          dependency injection to make units testable without patching
          module internals. Document why each mock is necessary.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: qa-no-skipped-tests
        rule: >
          Do not leave permanently skipped tests (it.skip, @Ignore,
          [Fact(Skip=...)]) in the codebase. Either fix and re-enable
          the test or delete it. Temporary skips must have a linked
          issue and be resolved within one sprint.
        severity: warning
        type: advisory
        phase: validation
        autofix: false

      - id: qa-integration-isolation
        rule: >
          Integration tests must not share mutable state between runs.
          Use per-test database transactions with rollback, or fresh
          containers (Testcontainers / Docker Compose) per suite.
          Integration tests must be runnable in any order.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: qa-e2e-stability
        rule: >
          End-to-end tests must be stable and deterministic. Flaky tests
          must be quarantined (moved to a separate suite) and fixed
          within two sprints. Use explicit waits over arbitrary delays.
          Tag smoke tests so a critical path subset can run on every deploy.
        severity: error
        type: advisory
        phase: validation
        autofix: false

      - id: qa-mutation-testing
        rule: >
          Run mutation testing periodically to validate the effectiveness of
          the test suite. A mutation score below 60% indicates insufficient
          test assertions. Use Stryker (JavaScript/TypeScript), PIT (Java),
          or mutmut (Python) as appropriate for the language. Address
          surviving mutants in the next sprint.
        severity: warning
        type: advisory
        phase: validation
        autofix: false

      - id: qa-contract-testing
        rule: >
          Use consumer-driven contract testing for all service-to-service
          integrations. Consumers define the contract; providers verify it.
          Contract tests must run in CI for both consumers and providers.
          Use Pact or an equivalent framework. Never mock the wire protocol
          in integration tests — use contract stubs instead.
        severity: warning
        type: advisory
        phase:
          - planning
          - validation
        autofix: false

      - id: qa-performance-regression
        rule: >
          Performance-sensitive code paths must have benchmark tests that run
          in CI. A regression of more than 10% from the baseline must block
          the merge. Use language-appropriate tools: Vitest bench, Criterion
          (Rust), pytest-benchmark (Python), or BenchmarkDotNet (.NET).
          Store benchmark results as CI artefacts for historical comparison.
        severity: warning
        type: advisory
        phase: validation
        autofix: false

  # ===========================================================================
  # Template Protection
  # ===========================================================================
  - domain: template-protection
    description: >
      Rules preventing AI agents from directly modifying AgentKit Forge
      source-of-truth files. Changes to templates, specs, engines, and
      overlays must go through a PR to the agentkit-forge repository.
    applies-to:
      - '.agentkit/templates/**'
      - '.agentkit/spec/**'
      - '.agentkit/engines/**'
      - '.agentkit/overlays/**'
      - '.agentkit/bin/**'
    conventions:
      - id: tp-no-direct-edit
        rule: >
          AI agents must never directly modify files in .agentkit/templates/,
          .agentkit/engines/, .agentkit/overlays/, or .agentkit/bin/. These
          directories contain the upstream sync engine, templates, and CLI
          scripts. A PreToolUse hook enforces this at runtime. Note:
          .agentkit/spec/ is the intended edit point for project configuration
          — users (not AI agents) may modify spec YAML files and run
          agentkit sync to regenerate output.
        severity: critical
        type: enforcement
        autofix: false

      - id: tp-no-generated-edit
        rule: >
          AI agents must never directly edit files marked with the header
          "GENERATED by AgentKit Forge — DO NOT EDIT". Instead, suggest the
          relevant YAML spec change in .agentkit/spec/ to a human reviewer;
          only users (not AI agents) may modify spec YAML files and run
          agentkit sync to regenerate output.
        severity: critical
        type: enforcement
        autofix: false

      - id: tp-change-via-pr
        rule: >
          When a change to templates, specs, or engines is needed, the agent
          must describe the desired change and recommend the user submit a
          PR to the agentkit-forge repository. The PR will be auto-labelled
          and require maintainer review via CODEOWNERS.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

  # ===========================================================================
  # Git Workflow
  # ===========================================================================
  - domain: git-workflow
    description: >
      Conventions for branching, committing, pull requests, and merge
      strategy. Ensures a consistent, auditable change history.
    applies-to:
      - '**/*'
    conventions:
      - id: gw-branch-naming
        rule: >
          Feature branches must follow the pattern type/short-description
          (e.g. feat/add-user-auth, fix/token-refresh, chore/update-deps).
          Use kebab-case. Never commit directly to the default branch.
        severity: error
        type: enforcement
        phase: implementation
        autofix: false

      - id: gw-conventional-commits
        rule: >
          All commit messages AND pull request titles must follow the
          Conventional Commits specification: type(scope): description.
          Types are feat, fix, docs, style, refactor, test, chore, ci,
          perf, build, revert. Scope is optional but recommended.
          Description must be lowercase, imperative mood, and under 72
          characters. The CI branch-protection workflow rejects PRs with
          non-conforming titles. Common mistake: using natural-language
          titles like "Plan: Something" or "Update files" — these WILL
          fail CI. Always use: feat(scope): add something.
        severity: error
        type: enforcement
        phase: ship
        autofix: false
        examples:
          - valid: 'feat(auth): add OAuth2 login flow'
          - valid: 'fix(api): handle null response from payment gateway'
          - valid: 'docs(readme): update setup instructions'
          - valid: 'ci(workflows): add coverage enforcement'
          - invalid: 'Plan: Brand-Driven Editor Theme'
          - invalid: 'Update files'
          - invalid: 'WIP'
          - invalid: 'Added new feature'

      - id: gw-atomic-commits
        rule: >
          Each commit must be a single logical change. Do not combine
          unrelated changes in one commit. Do not commit generated files
          alongside source changes — commit spec changes first, then
          regenerated output in a separate commit.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: gw-no-force-push
        rule: >
          Never force-push to shared branches (main, develop, release/*).
          Force-push to feature branches only when necessary for rebase
          cleanup before review. The guard-destructive-commands hook
          enforces this at runtime.
        severity: critical
        type: enforcement
        autofix: false

      - id: gw-pr-title-format
        rule: >
          Pull request titles MUST follow the Conventional Commits format:
          type(scope): description. Valid types are feat, fix, docs, style,
          refactor, test, chore, ci, perf, build, revert. Scope is optional.
          Do NOT use free-form titles like "Plan: ..." or "Add feature X".
          CI enforces this via the branch-protection workflow and will reject
          non-conforming PR titles. Example: feat(brand): add dark-mode
          token palette.
        severity: error
        type: enforcement
        phase: ship
        autofix: false

      - id: gw-pr-required
        rule: >
          All changes to the default branch must go through a pull request.
          PRs must have a title following Conventional Commits (see
          gw-pr-title-format), a summary of changes, and a test plan. PRs
          modifying .agentkit/ require CODEOWNERS approval.
        severity: error
        type: enforcement
        phase: ship
        autofix: false

      - id: gw-sync-before-pr
        rule: >
          If any files in .agentkit/spec/ were modified, you MUST run
          'pnpm -C .agentkit agentkit:sync' and commit the regenerated
          outputs before creating a PR. Never edit files marked with the
          header "GENERATED by AgentKit Forge — DO NOT EDIT" directly.
          The CI drift check compares generated output against the spec
          and will fail the build if they are out of sync.
        severity: error
        type: enforcement
        phase: ship
        autofix: true
        tool: 'pnpm -C .agentkit agentkit:sync'

      - id: gw-breaking-changes-docs
        rule: >
          PRs with breaking changes (indicated by '!:' in the title or the
          word BREAKING) must include documentation in the PR body: a
          '## Breaking Changes' section, an ADR reference, or a migration
          guide. CI checks for this and will block the merge if missing.
        severity: error
        type: enforcement
        phase: ship
        autofix: false

      - id: gw-squash-merge
        rule: >
          Use squash-merge when merging PRs to keep the default branch
          history clean. The squash commit message must follow Conventional
          Commits and reference the PR number.
        severity: warning
        type: advisory
        phase: ship
        autofix: false

      - id: gw-no-secrets-in-history
        rule: >
          Never commit secrets, API keys, tokens, or credentials to git
          history. If a secret is accidentally committed, rotate the secret
          immediately and use git filter-repo to remove it from history.
          The branch-protection workflow scans diffs for common patterns.
        severity: critical
        type: enforcement
        autofix: false

  # ===========================================================================
  # Documentation
  # ===========================================================================
  - domain: documentation
    description: >
      Standards for project documentation including the 8-category docs
      structure, ADR conventions, and generated file handling.
    applies-to:
      - 'docs/**'
      - '**/*.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
    conventions:
      - id: doc-8-category-structure
        rule: >
          All project documentation must follow the domain-driven structure
          under docs/. The canonical categories are: product (vision, strategy,
          personas), architecture/ (specs, decisions, diagrams), orchestration
          (guides, protocols), api, operations, engineering, integrations,
          reference. Additional directories: agents (catalog), handoffs
          (session handoffs), history (retrospectives). New documentation
          files must be placed in the appropriate category.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: doc-adr-format
        rule: >
          Architecture Decision Records must follow the format: title,
          status (proposed/accepted/deprecated/superseded), context,
          decision, consequences. ADRs are numbered sequentially and
          stored in docs/architecture/decisions/ (or the repository's equivalent ADR directory). Every significant
          architectural decision must have an ADR.
        severity: error
        type: advisory
        phase: planning
        autofix: false

      - id: doc-generated-files
        rule: >
          Files with the header "GENERATED by AgentKit Forge — DO NOT EDIT"
          must not be edited directly. Modify the source spec in
          .agentkit/spec/ and run 'pnpm -C .agentkit agentkit:sync' to
          regenerate. CRITICAL: The CI drift check WILL FAIL if generated
          output is out of sync with spec. This is the #1 cause of CI
          failures. After ANY change to .agentkit/spec/, you MUST run sync
          and commit the regenerated files before pushing.
        severity: critical
        type: enforcement
        autofix: true
        tool: 'pnpm -C .agentkit agentkit:sync'

      - id: doc-changelog
        rule: >
          Maintain a CHANGELOG.md following Keep a Changelog format.
          Every user-facing change must be documented under the appropriate
          section (Added, Changed, Deprecated, Removed, Fixed, Security).
          The changelog is updated as part of the PR, not after merge.
        severity: warning
        type: advisory
        phase: ship
        autofix: false

      - id: doc-api-spec
        rule: >
          All public APIs must have corresponding documentation in
          docs/api/. API endpoints must include method, path,
          request/response schema, authentication requirements, and
          example requests. Keep API docs in sync with implementation.
        severity: error
        type: advisory
        phase:
          - implementation
          - ship
        autofix: false

  # ===========================================================================
  # CI/CD
  # ===========================================================================
  - domain: ci-cd
    description: >
      Conventions for continuous integration and deployment pipelines,
      quality gates, and release management.
    applies-to:
      - '.github/workflows/**'
      - '**/*.yml'
      - '**/*.yaml'
      - 'Dockerfile*'
      - 'docker-compose*'
    conventions:
      - id: ci-quality-gates
        rule: >
          All PRs must pass the following quality gates before merge:
          lint, typecheck, unit tests, integration tests, spec validation,
          and drift check. Use the /check command to run all gates locally.
          Never skip CI checks or add [skip ci] to bypass validation.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

      - id: ci-no-skip-hooks
        rule: >
          Never use --no-verify to skip git hooks or pre-commit checks.
          If a hook fails, fix the underlying issue. Hooks exist to catch
          problems early — bypassing them defeats the purpose.
        severity: error
        type: enforcement
        autofix: false

      - id: ci-pin-actions
        rule: >
          Pin all GitHub Actions to full commit SHAs, not tags or branch
          references. This prevents supply chain attacks via tag mutation.
          Renovate is configured to manage action version updates via PR.
        severity: error
        type: advisory
        phase: implementation
        autofix: false

      - id: ci-no-secrets-in-workflows
        rule: >
          Never hardcode secrets in workflow files. Use GitHub Secrets
          or environment-scoped secrets. Reference secrets via the
          secrets context (secrets.MY_SECRET), never as plain text.
        severity: critical
        type: enforcement
        autofix: false

      - id: ci-reproducible-builds
        rule: >
          CI builds must be reproducible. Use frozen lockfiles
          (--frozen-lockfile for pnpm, --ci for npm). Pin Node.js and
          other runtime versions. Do not rely on latest tags for
          base images — pin specific versions.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

      - id: ci-fail-fast
        rule: >
          Configure CI to fail fast on the first error in lint, typecheck,
          and test stages. Do not continue running expensive test suites
          after a compilation or lint failure.
        severity: warning
        type: advisory
        phase: validation
        autofix: false

  # ===========================================================================
  # Dependency Management
  # ===========================================================================
  - domain: dependency-management
    description: >
      Rules for managing project dependencies, supply chain security,
      automated updates, and lockfile hygiene.
    applies-to:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'requirements*.txt'
      - 'renovate.json'
      - '.renovaterc*'
    conventions:
      - id: dep-pin-versions
        rule: >
          Pin all dependency versions in package manifests. Use exact
          versions or narrow ranges. Rely on Renovate for automated
          version bumps via PR. Never use latest, *, or wide ranges
          like >=.
        severity: error
        type: enforcement
        phase: implementation
        autofix: false

      - id: dep-lockfile-committed
        rule: >
          Lockfiles (pnpm-lock.yaml, Cargo.lock, poetry.lock) must be
          committed to version control. Install with --frozen-lockfile
          in CI. Never delete or regenerate lockfiles without reviewing
          the diff.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

      - id: dep-audit-before-adopt
        rule: >
          Before adding a new dependency, check: maintenance status
          (last release date, open issues), security advisories, license
          compatibility, bundle size impact, and transitive dependency
          count. Prefer well-maintained packages with small dependency
          trees.
        severity: warning
        type: advisory
        phase: planning
        autofix: false

      - id: dep-regular-audit
        rule: >
          Run dependency vulnerability audits regularly (npm audit,
          cargo audit, pip-audit). Critical and high vulnerabilities
          must be addressed within one sprint. Renovate vulnerability
          alerts are configured to auto-create PRs for known CVEs.
        severity: error
        type: enforcement
        phase: validation
        autofix: false
        tool: 'npm audit'

      - id: dep-no-duplicate
        rule: >
          Avoid duplicate dependencies that serve the same purpose.
          Before adding a new package, check if an existing dependency
          already provides the needed functionality. Document the
          rationale for choosing between competing packages.
        severity: warning
        type: advisory
        phase: planning
        autofix: false

      - id: dep-engine-protected
        rule: >
          Dependencies in .agentkit/package.json are part of the forge
          engine and require maintainer review. Renovate is configured
          to label these PRs with forge-source-change. Do not modify
          engine dependencies without understanding the sync pipeline.
        severity: error
        type: enforcement
        autofix: false

  # ===========================================================================
  # Agent Conduct
  # ===========================================================================
  - domain: agent-conduct
    description: >
      Meta-rules governing how AI agents should behave when operating
      in this repository. Applies across all AI coding tools (Claude,
      Cursor, Copilot, Windsurf, Cline, etc.).
    applies-to:
      - '**/*'
    conventions:
      - id: ac-verify-before-change
        rule: >
          Always read and understand existing code before modifying it.
          Never propose changes to files you have not read. When fixing
          a bug, verify the root cause before applying a fix. When
          adding a feature, understand the surrounding architecture.
        severity: error
        type: advisory
        phase: discovery
        autofix: false

      - id: ac-minimal-changes
        rule: >
          Make the minimum change necessary to accomplish the task.
          Do not refactor surrounding code, add comments to unchanged
          code, or "improve" unrelated logic. A bug fix should fix
          the bug, not reorganize the module.
        severity: warning
        type: advisory
        phase: implementation
        autofix: false

      - id: ac-run-checks
        rule: >
          Always run /check (or the project's quality gate command)
          before creating a PR or marking a task as complete. Never
          assume code works without verification. If tests fail, fix
          them before proceeding.
        severity: error
        type: enforcement
        phase: validation
        autofix: false

      - id: ac-no-destructive-without-confirm
        rule: >
          Never run destructive commands (rm -rf, git push --force,
          DROP TABLE, terraform destroy) without explicit user
          confirmation. The guard-destructive-commands hook enforces
          this at runtime, but agents must also self-govern.
        severity: critical
        type: enforcement
        autofix: false

      - id: ac-explain-trade-offs
        rule: >
          When recommending an approach, explain trade-offs. When
          multiple solutions exist, present the options with pros
          and cons rather than silently choosing one. Let the user
          make informed decisions on architecture and design.
        severity: warning
        type: advisory
        phase: planning
        autofix: false

      - id: ac-session-handoff
        rule: >
          At the end of each session, use /handoff to document what
          was accomplished, what is pending, and any blockers. This
          ensures continuity when a different agent or human picks
          up the work.
        severity: warning
        type: advisory
        phase: ship
        autofix: false

      - id: ac-respect-generated-headers
        rule: >
          Files with "GENERATED by AgentKit Forge — DO NOT EDIT"
          headers are output artifacts from the sync pipeline. Never
          edit them directly. Instead, modify the upstream spec in
          .agentkit/spec/ and run agentkit sync to regenerate.
        severity: critical
        type: enforcement
        autofix: false

      - id: ac-cost-awareness
        rule: >
          Be mindful of token usage and API costs. Avoid redundant
          file reads, unnecessary searches, and verbose output. Use
          targeted searches (Glob, Grep) before broad exploration.
          Prefer editing existing files over creating new ones.
        severity: warning
        type: advisory
        autofix: false

  # ===========================================================================
  # FinOps / Cloud Cost Operations
  # ===========================================================================
  - domain: finops
    description: >
      Rules for cloud cost visibility, tagging, budget governance, and
      cost-centre management. Applies to FinOps-enabled repos that
      implement cost analytics, budget alerting, or resource tagging.
      Note: session/token cost tracking (the /cost command) is separate
      from cloud FinOps — see the agent-conduct ac-cost-awareness rule.
    applies-to:
      - 'adx/**'
      - '**/*.kql'
      - 'grafana/**'
      - 'scripts/*cost*'
      - 'scripts/*tag*'
      - 'infra/**/budget*'
      - 'infra/**/policy*'
    conventions:
      - id: finops-phased-delivery
        rule: >
          Use phased delivery for cost visibility features. Get explicit
          confirmation before advancing to the next phase. Phase 1 focuses
          on reference tables, basic cost attribution, and tagging visibility.
          Phase 2 adds anomaly detection, forecasting, and automated remediation.
        severity: error
        autofix: false

      - id: finops-reference-tables
        rule: >
          Cost attribution must use reference tables (e.g. products,
          resource_group_project) rather than hardcoded mappings. Cost is
          attributed via resource group; unmapped resources appear as
          <unassigned>. Reference tables must be versioned and auditable.
        severity: error
        autofix: false

      - id: finops-tag-safety
        rule: >
          Tag modification scripts must be output-only by default. Never
          execute tag apply commands without an IaC check (Terraform/Pulumi
          state verification). Export scripts should print az tag add
          commands but not run them. Document IaC check steps before use.
        severity: critical
        autofix: false

      - id: finops-audit-reversibility
        rule: >
          Any action that modifies resource state (tags, budgets, policies)
          must support audit logging and reversibility from the start.
          Log before/after state, timestamp, and actor. Provide an undo
          mechanism or documented rollback procedure.
        severity: error
        autofix: false

      - id: finops-cost-centre-governance
        rule: >
          Every resource group should be mapped to a cost centre. Cost
          centres define budget ownership (1:N mapping — one centre can
          own multiple resource groups). Budget alert thresholds must be
          set at 80% (actual), 100% (actual), and 120% (forecasted).
          Unbudgeted resource groups must be flagged in reporting.
        severity: error
        autofix: false

      - id: finops-adx-alternatives
        rule: >
          When ADX (Azure Data Explorer) is too expensive for the project
          scale, implement cost analytics using alternative backends:
          Log Analytics workspace with KQL, Azure Monitor workbooks, or
          direct Cost Management API queries. The same logical functions
          (cost_by_product, untagged_resources, budget_utilization) must
          be implemented regardless of backend. Document the chosen
          backend and migration path in the project's cost guide.
        severity: warning
        autofix: false

      - id: finops-budget-approval
        rule: >
          Budget increases and new cost centre creation require approval
          via GitHub Issue with the finops-approval label. The issue must
          include justification, current vs proposed budget, and expected
          duration. Emergency budget increases for production incidents
          may bypass approval with a post-incident review within 5 days.
        severity: warning
        autofix: false
