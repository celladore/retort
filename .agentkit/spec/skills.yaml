# =============================================================================
# skills.yaml — Skill definitions for retort
# Canonical source of truth for retort
# Version: 0.1.0
# =============================================================================
# Skills are reusable knowledge modules that agents activate based on context.
# Unlike commands (user-invoked) and agents (role-based), skills are invoked
# automatically when their trigger conditions match the task at hand.
#
# Scope values:
#   global   — distributed to ~/.claude/skills/ (available in all projects)
#   project  — distributed to {repo}/.agents/skills/ (project-scoped only)
#   internal — used by the retort framework itself (not distributed externally)
#
# Source values:
#   org-meta — canonical source is ~/repos/org-meta/skills/<name>/
#   retort   — generated by retort sync engine from this spec
#   upstream — sourced from an external plugin or vendor
#
# Sync behaviour:
#   - sync NEVER overwrites a skill file whose content differs from the canonical source
#   - when an unknown local skill is found, it is appended to _unknown/report.md
#   - use `pnpm ak:propose-skill <name>` to open a PR promoting a local skill to org-meta
#
# Optional fields:
#   requiredFeature — only distributed when the feature is enabled in project.yaml
#   tags            — semantic grouping for filtering and search
#   alias           — alternate trigger names (future use)
# =============================================================================

skills:
  # ===========================================================================
  # WORKFLOW ORCHESTRATION
  # Skills for managing complex multi-step workflows and session lifecycle
  # ===========================================================================

  - name: session-startup
    scope: global
    source: org-meta
    description: >
      Run at the start of every session. Orients the agent and user — returns
      recent context, roadmap status, and session tips for returning users;
      runs full onboarding for new users.
    tags: [workflow, session, onboarding]

  - name: end-session
    scope: global
    source: org-meta
    description: >
      Mandatory session exit protocol for all agents before concluding work
      or notifying the user. Mirrors traces, persists history, verifies
      changes, and outputs a structured summary.
    tags: [workflow, session, exit]

  - name: writing-plans
    scope: global
    source: org-meta
    description: >
      Use when you have a spec or requirements for a multi-step task, before
      touching code.
    tags: [workflow, planning]

  - name: executing-plans
    scope: global
    source: org-meta
    description: >
      Use when you have a written implementation plan to execute in a separate
      session with review checkpoints.
    tags: [workflow, planning, execution]

  - name: task-breakdown
    scope: global
    source: org-meta
    description: >
      Use when you have specs or requirements for a multi-step task to break
      it down into detailed tasks, before executing it.
    tags: [workflow, planning, tasks]

  - name: subagent-driven-development
    scope: global
    source: org-meta
    description: >
      Use when executing implementation plans with independent tasks in the
      current session.
    tags: [workflow, agents, parallelism]

  - name: subagent-task-execution
    scope: global
    source: org-meta
    description: >
      Use when executing tasks from a task breakdown document in the current
      session.
    tags: [workflow, agents, tasks]

  - name: dispatching-parallel-agents
    scope: global
    source: org-meta
    description: >
      Use when facing 2+ independent tasks that can be worked on without
      shared state or sequential dependencies.
    tags: [workflow, agents, parallelism]

  - name: using-git-worktrees
    scope: global
    source: org-meta
    description: >
      Use when starting feature work that needs isolation from current
      workspace or before executing implementation plans — creates isolated
      git worktrees with smart directory selection and safety verification.
    tags: [workflow, git, isolation]

  - name: finishing-a-development-branch
    scope: global
    source: org-meta
    description: >
      Use when implementation is complete, all tests pass, and you need to
      decide how to integrate the work — guides completion of development
      work by presenting structured options for merge, PR, or cleanup.
    tags: [workflow, git, delivery]

  # ===========================================================================
  # DEVELOPMENT PRACTICES
  # Skills for engineering quality and correctness
  # ===========================================================================

  - name: brainstorming
    scope: global
    source: org-meta
    description: >
      Use before any creative or complex work — creating features, building
      components, adding functionality, or modifying behavior. Explores user
      intent, requirements and design before implementation.
    tags: [development, design, ideation]

  - name: coding
    scope: global
    source: org-meta
    description: >
      General coding best practices and software engineering principles to
      build robust, maintainable, and scalable software.
    tags: [development, quality]

  - name: test-driven-development
    scope: global
    source: org-meta
    description: >
      Use when implementing any feature or bugfix, before writing
      implementation code.
    tags: [development, testing, tdd]

  - name: systematic-debugging
    scope: global
    source: org-meta
    description: >
      Use when encountering any bug, test failure, or unexpected behavior,
      before proposing fixes.
    tags: [development, debugging, quality]

  - name: verification-before-completion
    scope: global
    source: org-meta
    description: >
      Use when about to claim work is complete, fixed, or passing, before
      committing or creating PRs — requires running verification commands
      and confirming output before making any success claims; evidence before
      assertions always.
    tags: [development, quality, verification]

  # ===========================================================================
  # CODE REVIEW
  # Skills for reviewing and receiving reviews
  # ===========================================================================

  - name: requesting-code-review
    scope: global
    source: org-meta
    description: >
      Use when completing tasks, implementing major features, or before
      merging to verify work meets requirements.
    tags: [review, quality]

  - name: receiving-code-review
    scope: global
    source: org-meta
    description: >
      Use when receiving code review feedback, before implementing
      suggestions, especially if feedback seems unclear or technically
      questionable — requires technical rigor and verification, not
      performative agreement or blind implementation.
    tags: [review, quality]

  - name: reflection
    scope: global
    source: org-meta
    description: >
      Analyzes the conversation and tool usage to propose improvements to
      skills or store user preferences.
    tags: [review, meta, improvement]

  # ===========================================================================
  # SKILL & AGENT AUTHORING
  # Skills for creating and managing skills and agents
  # ===========================================================================

  - name: skill-editor
    scope: global
    source: org-meta
    description: >
      Creates, updates, and manages Agent Skills following the Claude Code
      style. Use when the user wants to add a new capability, create a new
      skill, or modify an existing skill.
    tags: [authoring, skills, meta]

  - name: writing-skills
    scope: global
    source: org-meta
    description: >
      Use when creating new skills, editing existing skills, or verifying
      skills work before deployment.
    tags: [authoring, skills, meta]

  # ===========================================================================
  # PLUGIN & TOOL ROUTING
  # Skills for navigating the Claude plugin ecosystem
  # ===========================================================================

  - name: plugin-review-router
    scope: global
    source: org-meta
    description: >
      Unified Claude plugin review router — selects the right review tool
      based on context (PR, local changes, feature, Sanity, security). Use
      instead of calling pr-review-toolkit, coderabbit, or feature-dev
      review agents directly.
    tags: [plugins, routing, review]

  - name: using-superpowers
    scope: global
    source: org-meta
    description: >
      Use when starting any conversation — establishes how to find and use
      skills, requiring Skill tool invocation before ANY response including
      clarifying questions.
    tags: [plugins, meta, session]

  # ===========================================================================
  # FRONTEND & UI
  # Skills for frontend development and design systems
  # ===========================================================================

  - name: shadcn-ui
    scope: global
    source: org-meta
    description: >
      Expert guidance for integrating and building applications with
      shadcn/ui components, including component discovery, installation,
      customization, and best practices.
    tags: [frontend, ui, shadcn, react]

  - name: vercel-cli-with-tokens
    scope: global
    source: org-meta
    description: >
      Deploy and manage projects on Vercel using token-based authentication.
      Use when working with Vercel CLI using access tokens rather than
      interactive login.
    tags: [frontend, deployment, vercel]

  - name: vercel-composition-patterns
    scope: global
    source: org-meta
    description: >
      React composition patterns that scale. Use when refactoring components
      with boolean prop proliferation, building reusable design system
      components, or reviewing component APIs.
    tags: [frontend, react, patterns, vercel]

  - name: vercel-react-best-practices
    scope: global
    source: org-meta
    description: >
      React and Next.js performance optimization guidelines from Vercel
      Engineering. Use when writing, reviewing, or refactoring React/Next.js
      code to ensure optimal performance patterns.
    tags: [frontend, react, nextjs, performance, vercel]

  - name: vercel-react-native-skills
    scope: global
    source: org-meta
    description: >
      React Native and Expo best practices for building performant mobile
      apps.
    tags: [frontend, react-native, mobile, vercel]

  - name: deploy-to-vercel
    scope: global
    source: org-meta
    description: >
      Deploy applications and websites to Vercel. Use when the user requests
      deployment actions like "deploy my app", "deploy and give me the link",
      "push this live", or "create a preview deployment".
    tags: [deployment, vercel]

  - name: react-components
    scope: global
    source: org-meta
    description: >
      Converts designs into modular Vite and React components using
      system-level networking and AST-based validation.
    tags: [frontend, react, components]

  - name: web-design-guidelines
    scope: global
    source: org-meta
    description: >
      Review UI code for Web Interface Guidelines compliance. Use when asked
      to "review my UI", "check accessibility", "audit design", "review UX",
      or "check my site against best practices".
    tags: [frontend, ui, accessibility, review]

  # ===========================================================================
  # DESIGN & UX INTELLIGENCE
  # Skills for UI/UX design, prompt enhancement, and visual design work
  # ===========================================================================

  - name: enhance-prompt
    scope: global
    source: org-meta
    description: >
      Transforms vague UI ideas into polished, specific prompts. Enhances
      specificity, adds UI/UX keywords, injects design system context, and
      structures output for better generation results.
    tags: [design, prompts, ux]

  - name: ui-ux-pro-max
    scope: global
    source: org-meta
    description: >
      UI/UX design intelligence for web and mobile. Includes 50+ styles,
      161 color palettes, 57 font pairings, and 99 UX guidelines across 10
      stacks (React, Next.js, Vue, Svelte, SwiftUI, React Native, Flutter,
      Tailwind, shadcn/ui, HTML/CSS). Use for any UI design, review, or
      implementation task.
    tags: [design, ux, ui, mobile, web]

  # ===========================================================================
  # RETORT FRAMEWORK — Internal skills (generated by retort, not distributed)
  # These skills are generated by the retort sync engine and live only in
  # onboarded repos' .agents/skills/. They are NOT sourced from org-meta.
  # ===========================================================================

  - name: orchestrate
    scope: project
    source: retort
    description: >
      Top-level orchestration command. Assesses the current repository state,
      identifies work to be done, delegates to appropriate team agents, and
      synthesizes results. The primary entry point for multi-step workflows.
    tags: [retort, orchestration, workflow]

  - name: plan
    scope: project
    source: retort
    description: >
      Creates a detailed implementation plan for a feature, bug fix, or
      refactoring task. Analyzes the codebase, identifies affected files and
      teams, estimates complexity, and produces a step-by-step plan with
      acceptance criteria.
    tags: [retort, planning]

  - name: review
    scope: project
    source: retort
    description: >
      Performs a structured code review of staged changes, a specific PR, or
      a range of commits. Evaluates code quality, adherence to domain rules,
      security concerns, test coverage, and architectural alignment.
    tags: [retort, review, quality]

  - name: start
    scope: project
    source: retort
    description: >
      New user entry point. Detects repository state, shows contextual
      status, and guides users to the right command or team for their goal.
      Read-only — suggests commands but does not execute them.
    tags: [retort, session, onboarding]

  - name: discover
    scope: project
    source: retort
    description: >
      Scans the repository to build a comprehensive understanding of the
      project structure, tech stacks in use, team boundaries, and
      architectural patterns. Outputs a structured discovery report.
    tags: [retort, discovery, analysis]

  - name: healthcheck
    scope: project
    source: retort
    description: >
      Performs a comprehensive health check of the repository: validates
      builds, runs tests, checks linting, verifies configuration files, and
      reports on the overall state across all detected tech stacks.
    tags: [retort, quality, validation]

  - name: preflight
    scope: project
    source: retort
    description: >
      Runs enhanced delivery checks before ship: quality gates, changelog,
      coverage delta, commit convention conformance, TODO/FIXME hygiene,
      and documentation updates for externally visible changes.
    tags: [retort, delivery, quality]

  - name: build
    scope: project
    source: retort
    description: >
      Builds the project using the detected tech stack's build command.
      Supports targeting specific packages in a monorepo or building the
      entire workspace.
    tags: [retort, build]

  - name: test
    scope: project
    source: retort
    description: >
      Runs the test suite using the detected tech stack's test command.
      Supports filtering by test file, pattern, or package. Reports
      pass/fail counts and coverage when available.
    tags: [retort, testing]

  - name: check
    scope: project
    source: retort
    description: >
      Runs all quality checks: type checking, linting, formatting validation,
      and test suites. Returns a unified pass/fail status with detailed
      breakdowns per check category.
    tags: [retort, quality, linting]

  - name: format
    scope: project
    source: retort
    description: >
      Formats code using the detected tech stack's formatter. Can target
      specific files, directories, or the entire workspace.
    tags: [retort, formatting]

  - name: security
    scope: project
    source: retort
    description: >
      Runs security-focused analysis: dependency vulnerability scanning,
      secret detection, OWASP compliance checks, and permission auditing.
      Generates a security report with severity ratings.
    tags: [retort, security]

  - name: deploy
    scope: project
    source: retort
    description: >
      Triggers a deployment pipeline or generates deployment artifacts.
      Validates pre-deployment checks (build, test, lint) before proceeding.
      Supports dry-run mode for safety.
    tags: [retort, deployment]

  - name: scaffold
    scope: project
    source: retort
    description: >
      Generates implementation skeletons aligned with project conventions.
      Supports endpoints, UI components, IaC modules, migrations, tests,
      and services.
    tags: [retort, scaffolding, code-gen]

  - name: handoff
    scope: project
    source: retort
    description: >
      Generates a structured handoff document for the current session.
      Captures what was accomplished, what remains, open questions, and
      context needed by the next session or developer.
    tags: [retort, session, documentation]

  - name: sync
    scope: project
    source: retort
    description: >
      Regenerates all AI tool configurations from the Retort spec. Renders
      templates for every active render target and updates generated files
      in the repository.
    tags: [retort, framework, sync]

  - name: validate
    scope: project
    source: retort
    description: >
      Validates generated outputs for correctness. Checks that all required
      directories, JSON files, command files, and hook scripts exist and
      are well-formed.
    tags: [retort, framework, validation]

  - name: doctor
    scope: project
    source: retort
    description: >
      Runs AgentKit Forge diagnostics: spec validation, overlay sanity
      checks, template availability, project.yaml completeness hints, and
      suggested next actions for fixing setup issues.
    tags: [retort, framework, diagnostics]

  - name: backlog
    scope: project
    source: retort
    description: >
      Displays a consolidated backlog view from all sources. Supports
      filtering and multiple output formats for CLI and future UI
      consumption.
    tags: [retort, project-management, backlog]

  - name: sync-backlog
    scope: project
    source: retort
    description: >
      Synchronizes the local backlog with the configured issue tracker,
      maps findings to ownership teams, updates local tracking documents,
      and identifies stale or unassigned work items.
    tags: [retort, project-management, backlog]

  - name: import-issues
    scope: project
    source: retort
    description: >
      Imports issues from the configured external tracker (GitHub or
      Linear), normalizes fields, deduplicates against existing items,
      assigns teams, and merges into AGENT_BACKLOG.md.
    tags: [retort, project-management, backlog]

  - name: project-status
    scope: project
    source: retort
    description: >
      Unified PM dashboard that aggregates orchestrator state, backlog,
      task progress, risks, and delivery metrics into a markdown or JSON
      report.
    tags: [retort, project-management, reporting]

  - name: project-review
    scope: project
    source: retort
    description: >
      Comprehensive production-grade project review and assessment.
      Systematically analyzes code quality, architecture, security, UX,
      performance, documentation, and feature completeness.
    tags: [retort, review, analysis]

  - name: expand
    scope: project
    source: retort
    description: >
      Runs the expansion analyzer to identify gaps, missing capabilities,
      undocumented decisions, and improvement opportunities in the codebase.
      Produces a ranked list of suggestions — requires explicit human
      approval before acting.
    tags: [retort, analysis, improvement]

  - name: analyze-agents
    scope: project
    source: retort
    description: >
      Generates a comprehensive agent/team relationship matrix. Analyzes
      dependencies, notifications, handoffs, coverage gaps, bottlenecks,
      and consolidation opportunities across all teams and agents.
    tags: [retort, agents, analysis]

  - name: infra-eval
    scope: project
    source: retort
    description: >
      Risk-aware infrastructure and codebase evaluation against reliability,
      cost, and scale fitness. Scores eight weighted dimensions and enforces
      hard gates for critical safety properties.
    tags: [retort, infrastructure, evaluation]
    requiredFeature: evaluation.infraEval

  - name: cost
    scope: project
    source: retort
    description: >
      Session cost and usage tracking. Shows session summaries, lists recent
      sessions, and generates aggregate usage reports.
    tags: [retort, cost, observability]

  - name: cost-centres
    scope: project
    source: retort
    description: >
      Cost centre management for cloud infrastructure. Manages budget
      allocations, resource group mappings, tag compliance, and spend
      tracking.
    tags: [retort, cost, infrastructure]
    requiredFeature: finops

  - name: brand
    scope: project
    source: retort
    description: >
      Manage the project brand spec (brand.yaml) and editor theme. Supports
      validation, palette preview, theme mapping, contrast auditing,
      scaffolding, and regeneration of editor theme files.
    tags: [retort, brand, design]

  - name: document-history
    scope: project
    source: retort
    description: >
      Creates a structured history document from templates for significant
      work completed in the current session. Auto-detects type and title
      from git history when invoked without arguments.
    tags: [retort, documentation, history]

  - name: feature-configure
    scope: project
    source: retort
    description: >
      Interactive feature configuration workflow. Walks through each feature
      category, explains what each feature provides, shows current status,
      and applies changes via the overlay settings.yaml.
    tags: [retort, framework, features]

  - name: feature-flow
    scope: project
    source: retort
    description: >
      Traces a specific feature end-to-end through the kit: shows which spec
      files define it, which template vars it injects, which templates consume
      those vars, and what overlay settings control it.
    tags: [retort, framework, features, debugging]

  - name: feature-review
    scope: project
    source: retort
    description: >
      Reviews the current feature configuration for the repo. Analyzes which
      features are enabled/disabled, checks for misconfigured dependencies,
      identifies unused features, and recommends features to enable based on
      codebase analysis.
    tags: [retort, framework, features, review]

  # ===========================================================================
  # PROJECT UTILITIES
  # Hand-authored skills for project lifecycle tasks (source: retort, not generated from commands)
  # These live in .agents/skills/<name>/SKILL.md — sync will not overwrite them.
  # ===========================================================================

  - name: repo-naming
    scope: global
    source: retort
    description: >
      Use when the user asks to name a new repo, check if a name is taken,
      score repo name options, or pick a project name. Runs a structured
      naming pipeline: collision checks across npm/PyPI/GitHub/major products,
      weighted scoring across five dimensions, TLD guidance, and tier
      classification (standalone noun vs org-prefixed) to produce a ranked
      shortlist.
    tags: [project, naming, planning]

  # ===========================================================================
  # RETORT BRANCH — Unmerged skills (feat/kit-domain-selection-onboarding)
  # These exist on an unmerged branch. Do NOT distribute until merged to main.
  # ===========================================================================

  - name: cicd-optimize
    scope: project
    source: retort
    description: >
      CI/CD pipeline and local hook optimizer. Audits GitHub Actions
      workflows, pre-commit/stop hooks, and test configurations for speed
      bottlenecks. Identifies caching gaps, sequential jobs that could
      parallelize, missing path filters, redundant installs, and slow hook
      steps.
    tags: [retort, cicd, optimization]
    status: unmerged
    branch: feat/kit-domain-selection-onboarding

  - name: init
    scope: project
    source: retort
    description: >
      Initialise the current repository as a Retort project. Runs the
      interactive setup wizard to detect the tech stack, select language
      kits, choose AI tools, and generate the initial project.yaml and
      overlay configuration. Supports --dry-run to preview without writing.
    tags: [retort, framework, onboarding]
    status: unmerged
    branch: feat/kit-domain-selection-onboarding
