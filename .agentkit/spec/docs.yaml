# =============================================================================
# docs.yaml — Documentation structure and organization
# Canonical source of truth for agentkit-forge
# Version: 0.1.0
# =============================================================================
# Defines the documentation hierarchy, category conventions, ADR numbering
# ranges, and special-purpose documentation directories.
# =============================================================================

# =============================================================================
# Documentation Categories
# Each category has a numeric prefix for sort ordering and a defined purpose.
# =============================================================================

categories:

  - id: "01_product"
    name: Product
    path: "docs/01_product/"
    description: >
      Product vision, strategy, market analysis, and competitive landscape.
      Contains high-level product direction and business context that
      informs engineering decisions.
    contents:
      - "01_prd.md — Product requirements and scope"
      - "02_user_stories.md — User stories and acceptance criteria"
      - "03_roadmap.md — Roadmap and milestone planning"
      - "04_personas.md — User personas and audience profiles"
      - "README.md — Product docs index"

  - id: "02_specs"
    name: Specifications
    path: "docs/02_specs/"
    description: >
      Functional, technical, API, and data model specifications.
      Defines implementation contracts and system behavior expectations.
    contents:
      - "01_functional_spec.md — Functional specification"
      - "02_technical_spec.md — Technical architecture specification"
      - "03_api_spec.md — API specification contract"
      - "04_data_models.md — Data model definitions"
      - "README.md — Specs docs index"

  - id: "03_architecture"
    name: Architecture
    path: "docs/03_architecture/"
    description: >
      System architecture, design decisions, and technical foundations.
      Includes architecture diagrams and Architecture Decision Records (ADRs).
    contents:
      - "01_overview.md — High-level architecture overview"
      - "01_diagrams/README.md — Architecture diagrams index"
      - "02_decisions/README.md — ADR index"
      - "README.md — Architecture docs index"

  - id: "04_api"
    name: API
    path: "docs/04_api/"
    description: >
      API documentation including endpoint references, authentication,
      examples, errors, and versioning strategy.
    contents:
      - "01_overview.md — API overview and conventions"
      - "02_endpoints.md — Endpoint reference"
      - "03_authentication.md — Authentication and authorization"
      - "04_examples.md — Request and response examples"
      - "05_errors.md — Error model and codes"
      - "06_versioning.md — API versioning strategy"
      - "README.md — API docs index"

  - id: "05_operations"
    name: Operations
    path: "docs/05_operations/"
    description: >
      Operational runbooks including deployment, monitoring, incident
      response, troubleshooting, and SLO/SLI definitions.
    contents:
      - "01_deployment.md — Deployment procedures"
      - "02_monitoring.md — Monitoring and alerting"
      - "03_incident_response.md — Incident response workflow"
      - "04_troubleshooting.md — Troubleshooting guide"
      - "05_slos_slis.md — SLO/SLI definitions"
      - "README.md — Operations docs index"

  - id: "06_engineering"
    name: Engineering
    path: "docs/06_engineering/"
    description: >
      Developer setup guides, coding standards, testing strategy,
      git workflow, and engineering security practices.
    contents:
      - "01_setup.md — Development setup"
      - "02_coding_standards.md — Coding standards"
      - "03_testing.md — Testing strategy"
      - "04_git_workflow.md — Git workflow"
      - "05_security.md — Engineering security practices"
      - "README.md — Engineering docs index"

  - id: "07_integrations"
    name: Integrations
    path: "docs/07_integrations/"
    description: >
      External API, webhook, and SDK integration references.
    contents:
      - "01_external_apis.md — External API integration inventory"
      - "02_webhooks.md — Webhook contracts and delivery"
      - "03_sdk.md — SDK integration guidance"
      - "README.md — Integrations docs index"

  - id: "08_reference"
    name: Reference
    path: "docs/08_reference/"
    description: >
      Reference materials including glossary, acronym definitions,
      external resource links, and tool configuration references.
    contents:
      - "01_glossary.md — Project terminology and definitions"
      - "02_faq.md — Frequently asked questions"
      - "03_changelog.md — Changelog reference"
      - "04_contributing.md — Contributing reference"
      - "05_project_yaml_reference.md — project.yaml reference"
      - "README.md — Reference docs index"

# =============================================================================
# Special-Purpose Directories
# =============================================================================

specialDirectories:

  - id: prd
    name: Product Requirements Documents
    path: "docs/prd/"
    description: >
      Individual Product Requirements Documents (PRDs) for features,
      enhancements, and initiatives. Each PRD follows a standardized
      template with problem statement, goals, requirements, acceptance
      criteria, and technical considerations.
    naming: "PRD-{NNN}-{slug}.md"
    template: |
      # PRD-{NNN}: {Title}

      ## Status
      Draft | In Review | Approved | In Progress | Completed

      ## Problem Statement
      {Describe the problem being solved}

      ## Goals
      - {Goal 1}
      - {Goal 2}

      ## Non-Goals
      - {Explicit non-goal 1}

      ## Requirements
      ### Functional Requirements
      - [ ] {FR-1}

      ### Non-Functional Requirements
      - [ ] {NFR-1}

      ## Acceptance Criteria
      - [ ] {AC-1}

      ## Technical Considerations
      {Architecture notes, dependencies, risks}

      ## Timeline
      | Milestone | Date | Status |
      |-----------|------|--------|

  - id: ai_handoffs
    name: AI Handoff Documents
    path: "docs/ai_handoffs/"
    description: >
      Session handoff documents generated by AI agents. Each document
      captures what was accomplished, what remains, open questions, and
      context needed for continuity between sessions.
    naming: "{YYYY-MM-DD}-{HHmm}-{tag}.md"
    template: |
      # AI Handoff — {Date} {Tag}

      ## Session Summary
      {What was this session about}

      ## Completed
      - {What was accomplished}

      ## In Progress
      - {What was started but not finished}

      ## Remaining
      - {What still needs to be done}

      ## Open Questions
      - {Unresolved decisions or questions}

      ## Context for Next Session
      {Important context, gotchas, and notes}

      ## Files Changed
      - {path/to/file — description of change}

# =============================================================================
# ADR Numbering Ranges
# Architecture Decision Records use a two-digit sequence for consistency.
# =============================================================================

adrRanges:
  - range: "01-99"
    domain: Architecture
    path: "docs/03_architecture/02_decisions/"
    description: >
      Core architecture decisions: system design, service boundaries,
      technology choices, data architecture, API design patterns,
      and foundational infrastructure decisions.
    examples:
      - "ADR-01 — Monorepo structure with pnpm workspaces"
      - "ADR-02 — API versioning strategy"
      - "ADR-03 — Tooling strategy and quality gates"

# =============================================================================
# ADR Template
# =============================================================================

adrTemplate: |
  # ADR-{NN}: {Title}

  ## Status
  Proposed | Accepted | Deprecated | Superseded by ADR-{NN}

  ## Date
  {YYYY-MM-DD}

  ## Context
  {What is the issue we are deciding on? What forces are at play?}

  ## Decision
  {What is the change we are proposing and/or doing?}

  ## Consequences

  ### Positive
  - {Benefit 1}

  ### Negative
  - {Tradeoff 1}

  ### Neutral
  - {Observation 1}

  ## Alternatives Considered
  ### {Alternative 1}
  - Pros: {pros}
  - Cons: {cons}
  - Why rejected: {reason}

  ## References
  - {Link or reference 1}
