# =============================================================================
# settings.yaml — Permissions, hooks, and runtime configuration
# Canonical source of truth for retort
# Version: 0.1.0
# =============================================================================
# Permissions follow an allow/deny model. Deny rules take precedence.
# Hooks define lifecycle callbacks for session and tool events.
# =============================================================================

permissions:
  allow:
    # -------------------------------------------------------------------------
    # Git — read-only and branch operations
    # -------------------------------------------------------------------------
    - 'Bash(git status*)'
    - 'Bash(git diff*)'
    - 'Bash(git log*)'
    - 'Bash(git show*)'
    - 'Bash(git branch*)'
    - 'Bash(git rev-parse*)'
    - 'Bash(git ls-files*)'

    # -------------------------------------------------------------------------
    # Git — write, mutation, and worktree operations
    # -------------------------------------------------------------------------
    - 'Bash(git add*)'
    - 'Bash(git rm*)'
    - 'Bash(git commit*)'
    - 'Bash(git push*)'
    - 'Bash(git checkout*)'
    - 'Bash(git switch*)'
    - 'Bash(git stash*)'
    - 'Bash(git worktree*)'
    - 'Bash(git merge*)'
    - 'Bash(git rebase*)'
    - 'Bash(git fetch*)'
    - 'Bash(git pull*)'
    - 'Bash(git tag*)'

    # -------------------------------------------------------------------------
    # Shell utilities
    # -------------------------------------------------------------------------
    - 'Bash(ls*)'
    - 'Bash(echo*)'
    - 'Bash(cat*)'
    - 'Bash(mv*)'
    - 'Bash(cp*)'
    - 'Bash(mkdir*)'
    - 'Bash(prettier*)'
    - 'Bash(bash -c*)'
    - 'Bash(node*)'

    # -------------------------------------------------------------------------
    # npm / pnpm — package management and script execution
    # -------------------------------------------------------------------------
    - 'Bash(npm ci*)'
    - 'Bash(npm install*)'
    - 'Bash(npm run *)'
    - 'Bash(pnpm install*)'
    - 'Bash(pnpm i*)'
    - 'Bash(pnpm run *)'
    - 'Bash(pnpm build*)'
    - 'Bash(pnpm test*)'
    - 'Bash(pnpm lint*)'
    - 'Bash(pnpm -w *)'

    # -------------------------------------------------------------------------
    # .NET — build, test, and format
    # -------------------------------------------------------------------------
    - 'Bash(dotnet restore*)'
    - 'Bash(dotnet build*)'
    - 'Bash(dotnet test*)'

    # -------------------------------------------------------------------------
    # Cargo / Rust — build, test, lint, and format
    # -------------------------------------------------------------------------
    - 'Bash(cargo build*)'
    - 'Bash(cargo test*)'
    - 'Bash(cargo clippy*)'
    - 'Bash(cargo fmt*)'

    # -------------------------------------------------------------------------
    # Python — test, install, lint, format, and typecheck
    # -------------------------------------------------------------------------
    - 'Bash(python -m pytest*)'
    - 'Bash(python -m pip install*)'
    - 'Bash(pip install*)'
    - 'Bash(ruff *)'
    - 'Bash(black *)'
    - 'Bash(mypy *)'

    # -------------------------------------------------------------------------
    # Monorepo tooling — Nx, Turbo, npx
    # -------------------------------------------------------------------------
    - 'Bash(nx *)'
    - 'Bash(turbo *)'
    - 'Bash(npx *)'

    # -------------------------------------------------------------------------
    # Docker — build and compose
    # -------------------------------------------------------------------------
    - 'Bash(docker build*)'
    - 'Bash(docker compose*)'

    # -------------------------------------------------------------------------
    # GitHub CLI — PR, issue, and run management
    # -------------------------------------------------------------------------
    - 'Bash(gh pr *)'
    - 'Bash(gh issue *)'
    - 'Bash(gh run *)'

    # -------------------------------------------------------------------------
    # Cloud / IaC — Azure, Terraform, Terragrunt
    # -------------------------------------------------------------------------
    - 'Bash(az account*)'
    - 'Bash(az group*)'
    - 'Bash(terraform *)'
    - 'Bash(terragrunt *)'

  deny:
    # -------------------------------------------------------------------------
    # Destructive operations — always blocked
    # -------------------------------------------------------------------------
    - 'Bash(rm -rf /)'
    - 'Bash(rm -rf ~*)'
    - 'Bash(git push --force*)'
    - 'Bash(git push -f*)'
    - 'Bash(git reset --hard*)'
    - 'Bash(terraform destroy*)'
    - 'Bash(az group delete*)'
    - 'Bash(gh repo delete*)'

# =============================================================================
# Cost Tracking — Session-level usage tracking
# =============================================================================

costTracking:
  enabled: true
  logDir: logs # Relative to agentkit root
  retentionDays: 90 # Auto-purge logs older than this
  # Note: Token-level tracking requires AI tool API access (not available).
  # Session-level metrics (duration, commands, files) are tracked via hooks.

# =============================================================================
# Budget Policy — Circuit breaker for runaway sessions
# =============================================================================
# Enforcement modes:
#   warn    — log warnings when thresholds are approached/exceeded (default)
#   enforce — block tool execution when limits are exceeded
#   off     — disable budget checking entirely

budgetPolicy:
  enforcement: warn
  session:
    maxDurationMinutes: 120
    maxCommands: 200
    maxFilesModified: 100
    warnAtPercent: 80
  daily:
    maxSessions: 50
    maxTotalDurationMinutes: 480
    maxTotalCommands: 1000
    warnAtPercent: 80

# =============================================================================
# Dependency Management — Automated dependency update configuration
# =============================================================================

dependencyManagement:
  tool: renovate # renovate | dependabot | none
  schedule: weekly # weekly | daily | monthly
  automerge: patch # major | minor | patch | none

# =============================================================================
# Hooks — Lifecycle callbacks for session and tool events
# =============================================================================

hooks:
  # ---------------------------------------------------------------------------
  # Session lifecycle
  # ---------------------------------------------------------------------------
  sessionStart: session-start

  # ---------------------------------------------------------------------------
  # Pre-tool-use hooks — run before a tool is invoked
  # Matcher is a regex against the tool name.
  # ---------------------------------------------------------------------------
  preToolUse:
    - matcher: 'Bash|Write|Edit'
      hook: budget-guard-check
    - matcher: 'Write|Edit'
      hook: protect-sensitive
    - matcher: 'Write|Edit'
      hook: protect-templates
    - matcher: 'Bash'
      hook: guard-destructive-commands
    - matcher: 'Bash'
      hook: pre-push-validate

  # ---------------------------------------------------------------------------
  # Post-tool-use hooks — run after a tool completes
  # ---------------------------------------------------------------------------
  postToolUse:
    - matcher: 'Write|Edit'
      hook: warn-uncommitted

  # ---------------------------------------------------------------------------
  # Stop hook — runs when the agent session is about to end
  # ---------------------------------------------------------------------------
  stop: stop-build-check

# =============================================================================
# Delegation backend (ADR-15 §6)
# =============================================================================
dispatch:
  # How the orchestrator hands a task to a team.
  #
  # 'native'    — write the task file first, then dispatch the team's agent via
  #               the Agent tool, passing the taskId. The subagent does the work
  #               in its own context window and returns a summary; the task file
  #               is what survives the session. Requires registrable subagents.
  # 'task-file' — write the task file and nothing else. The orchestrator plays
  #               every role itself in one context. This is the only mode that
  #               works on tools without native subagents, and the escape hatch
  #               when fan-out is not wanted.
  #
  # Override per-repo in .agentkit/overlays/<repoName>/settings.yaml:
  #   dispatchMode: task-file
  mode: native

# =============================================================================
# Sync configuration
# =============================================================================
sync:
  # Controls the value written to {{syncDate}} in generated file headers.
  # 'run'     — today's ISO date (default); causes churn on every sync (issue #417)
  # 'version' — the spec VERSION string; stable until spec VERSION changes
  # 'none'    — empty string; removes the date field from headers entirely
  #
  # Override per-repo in .agentkit/overlays/<repoName>/settings.yaml:
  #   syncDateMode: none
  dateMode: run
  # Whether to run agentkit sync automatically before every git push.
  # Defaults to false so new adopters are not surprised by the sync overhead.
  # Set autoSyncOnPush: true in the repo's overlay settings to restore the
  # previous always-on behaviour.
  autoSyncOnPush: false
