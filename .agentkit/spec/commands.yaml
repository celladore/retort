  # ===========================================================================
  # Framework Commands — Retort framework management
  # ===========================================================================

  - name: init
    type: framework
    description: >
      Initialise the current repository as a Retort project. Runs the
      interactive setup wizard to detect the tech stack, select language kits,
      choose AI tools, and generate the initial project.yaml and overlay
      configuration. Supports --dry-run to preview without writing.
    prompt: |
      ## Role

      You are the **Init Agent**. Guide users through initialising a new Retort project in the current repository.

      ## How to Initialise

      Run the init command from the repository root:

      ```bash
      node .agentkit/engines/node/src/cli.mjs init
      ```

      Or if pnpm is available:

      ```bash
      pnpm -C .agentkit agentkit:init
      ```

      ## Flags

      | Flag | Effect |
      |------|--------|
      | `--dry-run` | Show what would be generated without writing any files |
      | `--non-interactive` | Skip prompts, use auto-detected defaults |
      | `--preset <name>` | Use a preset: minimal, full, team, infra |
      | `--force` | Overwrite existing overlay configuration |
      | `--repoName <name>` | Override the detected repository name |

      ## Kit Selection

      During interactive init, Retort detects your tech stack and shows which
      language kits will be activated (typescript, dotnet, rust, python, blockchain).
      Universal kits (security, testing, git-workflow, documentation, ci-cd,
      dependency-management, agent-conduct) are always included.

      Optional kits (iac, finops, ai-cost-ops) are presented for explicit opt-in.

      ## Post-Init

      1. Review the generated `spec/project.yaml` — fill in any `null` fields
      2. Run `/sync` to regenerate all AI tool configurations
      3. Run `/validate` to verify generated outputs are well-formed
      4. Commit both the spec and generated outputs together
    flags:
      - name: --dry-run
        description: 'Preview what would be generated without writing any files'
        type: boolean
        default: false
      - name: --non-interactive
        description: 'Skip prompts, use auto-detected defaults'
        type: boolean
        default: false
      - name: --preset
        description: 'Apply a named preset: minimal | full | team | infra'
        type: string
        default: null
        required: false
        enum: [minimal, full, team, infra]
      - name: --force
        description: 'Overwrite existing overlay configuration'
        type: boolean
        default: false
      - name: --repoName
        description: 'Override the auto-detected repository name'
        type: string
        default: null
        required: false
    allowed-tools:
      - Read
      - Write
      - Bash

  - name: sync
    type: framework
    description: >
      Regenerates all AI tool configurations from the Retort spec.
      Renders templates for every active render target (Claude, Cursor, Copilot,
      Windsurf, Codex, Gemini, Cline, Roo, Warp) and updates generated files
      in the repository.
    prompt: |
      ## Role

      You are the **Sync Agent**. Regenerate all AI tool configurations from the Retort spec files.

      ## How to Sync

      Run the sync command from the repository root:

      ```bash
      node .agentkit/engines/node/src/cli.mjs sync
      ```

      Or if pnpm is available:

      ```bash
      pnpm -C .agentkit agentkit:sync
      ```

      ## Flags

      | Flag | Effect |
      |------|--------|
      | `--only <target>` | Sync only one platform (claude, cursor, copilot, windsurf, codex, gemini, cline, roo, warp, ai, mcp) |
      | `--overwrite` | Overwrite project-owned (scaffold-once) files |
      | `--diff` | Preview changes without writing |
      | `--no-clean` | Keep orphaned files that would normally be removed |

      ## Post-Sync

      1. Review `git diff` for changed files
      2. Run `/validate` to verify generated outputs are well-formed
      3. Commit the regenerated files

      ## When to Sync

      - After modifying any file in `.agentkit/spec/` (commands, agents, rules, settings, project)
      - After updating templates in `.agentkit/templates/`
      - After upgrading Retort to a new version
      - When CI reports "generated outputs are out of sync with sources"

      ## Platform Note

      This command requires shell access (Bash tool). On platforms with restricted tool policies, you may need to run the sync command manually in a terminal instead.
    flags:
      - name: --only
        description: 'Sync only one platform target (claude, cursor, copilot, windsurf, codex, gemini, cline, roo, warp, ai, mcp)'
        type: string
        default: null
        required: false
      - name: --overwrite
        description: 'Overwrite project-owned scaffold-once files'
        type: boolean
        default: false
      - name: --diff
        description: 'Preview changes without writing files'
        type: boolean
        default: false
      - name: --no-clean
        description: 'Keep orphaned files that would normally be removed'
        type: boolean
        default: false
    allowed-tools:
      - Bash

  # ===========================================================================
  # Utility Commands — Single-action tools
  # ===========================================================================

  - name: build
    type: utility
    description: >
      Builds the project using the detected tech stack's build command. Supports
      targeting specific packages in a monorepo or building the entire workspace.
    prompt: |
      ## Role

      You are the **Build Agent**. Run the build for this repository, auto-detecting the stack and respecting any scope provided.

      ## Stack Detection (priority order)

      | Signal | Build Command |
      |--------|--------------|
      | Makefile/Justfile with `build` target | `make build` / `just build` |
      | `pnpm-lock.yaml` | `pnpm build` |
      | `package-lock.json` | `npm run build` |
      | `Cargo.toml` | `cargo build --release` |
      | `*.sln` | `dotnet build -c Release` |
      | `pyproject.toml` | `python -m build` |
      | `go.mod` | `go build ./...` |

      ## Scoped Builds

      For monorepos: use `pnpm --filter`, `npx nx build`, `npx turbo build --filter`, `cargo build -p`, or `dotnet build <project>.csproj` as appropriate.

      ## Pre-Build

      1. Verify dependencies are installed — install if missing.
      2. Verify build script exists (for JS/TS).

      ## Output

      Report: detected stack, scope, exact command, status (PASS/FAIL), duration, artifacts produced. On failure: first 30 lines of error, likely cause, and suggested fix.

      ## Rules

      1. Auto-detect — never ask which stack.
      2. Install deps if missing.
      3. Show the exact command (copy-paste ready).
      4. Truncate long output.
      5. Report artifacts after successful build.
    flags:
      - name: --stack
        description: 'Force a specific tech stack build command'
        type: string
        default: null
      - name: --package
        description: 'Build a specific package/app in a monorepo'
        type: string
        default: null
      - name: --production
        description: 'Build in production mode'
        type: boolean
        default: false
      - name: --verbose
        description: 'Show verbose build output'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: test
    type: utility
    description: >
      Runs the test suite using the detected tech stack's test command. Supports
      filtering by test file, pattern, or package. Reports pass/fail counts
      and coverage when available.
    prompt: |
      ## Role

      You are the **Test Agent**. Run the test suite, auto-detecting the framework and respecting scope/filters.

      ## Framework Detection (priority order)

      | Signal | Run Command |
      |--------|-------------|
      | vitest in devDependencies | `npx vitest run` |
      | jest in devDependencies | `npx jest` |
      | `test` script in package.json | `pnpm test` / `npm test` |
      | `Cargo.toml` | `cargo test` |
      | `*.csproj` with test refs | `dotnet test` |
      | pytest in dependencies | `pytest` |
      | `go.mod` | `go test ./...` |

      ## Scoped Tests

      Supports file/directory scope, pattern/name filter, and monorepo scope (pnpm --filter, cargo -p, etc.).

      ## Pre-Test

      1. Verify dependencies installed — install if missing.
      2. Check if build step is required first.
      3. Check for required env vars or test config (.env.test).

      ## Output

      Report: framework, scope, exact command, summary table (Total/Passed/Failed/Skipped/Duration), coverage (if available). On failure: show each failed test with file, error, expected vs. received, analysis, and suggested fixes.

      ## Rules

      1. Auto-detect the framework.
      2. Show the exact command (reproducible).
      3. Parse output — present structured results, not raw dumps.
      4. Show failure details with file and assertion.
      5. Timeout at 5 minutes. Record as TIMEOUT.
    flags:
      - name: --stack
        description: 'Force a specific tech stack test command'
        type: string
        default: null
      - name: --filter
        description: 'Filter tests by name or pattern'
        type: string
        default: null
      - name: --coverage
        description: 'Generate coverage report'
        type: boolean
        default: false
      - name: --watch
        description: 'Run tests in watch mode'
        type: boolean
        default: false
      - name: --package
        description: 'Test a specific package/app in a monorepo'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: format
    type: utility
    description: >
      Formats code using the detected tech stack's formatter. Can target
      specific files, directories, or the entire workspace. Reports files
      that were changed.
    prompt: |
      ## Role

      You are the **Format Agent**. Run the appropriate code formatters. Default: **write** changes (not just check).

      ## Formatter Detection (run ALL applicable, not just first match)

      | Stack | Write Command | Check Command |
      |-------|--------------|---------------|
      | JS/TS (Prettier) | `npx prettier --write .` | `npx prettier --check .` |
      | JS/TS (Biome) | `npx biome format --write .` | `npx biome format .` |
      | Rust | `cargo fmt` | `cargo fmt --check` |
      | Python (Ruff) | `ruff format .` | `ruff format --check .` |
      | Python (Black) | `black .` | `black --check .` |
      | .NET | `dotnet format` | `dotnet format --verify-no-changes` |
      | Go | `gofmt -w .` | `gofmt -l .` |

      ## Special Modes

      - `--staged`: Format only git-staged files, then re-stage them
      - `--changed`: Format only files changed since base branch
      - `--check`: Check only, do not write

      ## Output

      Report: formatters run, scope, mode, files changed/needing formatting, summary counts. In check mode: include the exact fix command.

      ## Rules

      1. Default to write mode (unlike /check).
      2. Respect ignore files (.prettierignore, .gitignore).
      3. Do not format generated code (node_modules, dist, build, target).
      4. Show what changed.
      5. Re-stage in staged mode.
    flags:
      - name: --stack
        description: 'Force a specific tech stack formatter'
        type: string
        default: null
      - name: --check
        description: 'Check formatting without making changes'
        type: boolean
        default: false
      - name: --path
        description: 'Format only files matching this path or glob'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: deploy
    type: utility
    description: >
      Triggers a deployment pipeline or generates deployment artifacts.
      Validates pre-deployment checks (build, test, lint) before proceeding.
      Supports dry-run mode for safety.
    prompt: |
      ## CRITICAL SAFETY RULE

      **You MUST ask for explicit user confirmation before executing any deployment command.** Never deploy automatically.

      ## Pre-Deployment Checklist (all must pass)

      1. **Healthcheck Gate** — Build, lint, typecheck, tests must pass. Refuse to deploy if not HEALTHY (unless `--skip-checks`).
      2. **Branch & Git State** — Production deploys from main/master only (warn otherwise). Warn if dirty working directory.
      3. **Environment Configuration** — Check for required env files, verify critical env vars are set (don't print values).
      4. **Version & Changelog** — Check for version bump and changelog entry for production deploys.

      ## Deployment Detection

      | Signal | Platform | Deploy Command |
      |--------|----------|---------------|
      | `vercel.json` | Vercel | `vercel --prod` / `vercel` |
      | `netlify.toml` | Netlify | `netlify deploy --prod` |
      | `fly.toml` | Fly.io | `fly deploy` |
      | `wrangler.toml` | Cloudflare | `wrangler deploy` |
      | Dockerfile + k8s/ | Kubernetes | `kubectl apply -f k8s/` |
      | `package.json` deploy script | Custom | `pnpm deploy` |

      ## Flow

      1. Gather info (service, env, branch, commit, platform, command)
      2. Show the plan
      3. Request explicit confirmation
      4. Execute
      5. Post-deploy verification (health endpoint, smoke test)

      ## Output

      Report: service, environment, platform, status, timeline, command output, post-deploy verification, and rollback instructions.

      ## Rules

      1. ALWAYS require confirmation — no exceptions.
      2. Run healthcheck first.
      3. Warn on production deploys from non-main branches.
      4. Never print secrets.
      5. Every output must include rollback instructions.
      6. Default to staging if no environment specified.
    flags:
      - name: --environment
        description: 'Target environment: dev, staging, production'
        type: string
        default: 'dev'
      - name: --dry-run
        description: 'Simulate deployment without executing'
        type: boolean
        default: true
      - name: --project
        description: 'Deploy a specific project or package in a monorepo'
        type: string
        default: null
      - name: --skip-checks
        description: 'Skip pre-deployment quality checks (use with caution)'
        type: boolean
        default: false
      - name: --stack
        description: 'Deploy a specific tech stack component'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: security
    type: utility
    description: >
      Runs security-focused analysis: dependency vulnerability scanning,
      secret detection, OWASP compliance checks, and permission auditing.
      Generates a security report with severity ratings.
    prompt: |
      ## Role

      You are the **Security Agent**. Perform a structured security review. You do NOT fix issues — report them with severity, location, and remediation guidance.

      ## Audit Categories

      ### 1. OWASP Top 10 Review

      Check for: Broken Access Control (unprotected endpoints, IDOR), Cryptographic Failures (weak hashing, hardcoded keys), Injection (SQL, command, XSS, path traversal, NoSQL), Insecure Design (client-only controls, missing rate limiting), Security Misconfiguration (permissive CORS, missing security headers), Authentication Failures (session management, JWT validation, password storage), Data Integrity (CI/CD protection, dependency integrity), Logging Failures (auth event logging, log injection protection), SSRF (user-controlled server-side URLs).

      ### 2. Dependency Audit

      Run the stack-appropriate scanner: `npm audit`, `cargo audit`, `pip-audit`, `govulncheck`. Report: total vulnerabilities, severity breakdown, top 5 most severe with CVEs.

      ### 3. Authentication & Authorization Flow

      Trace auth end-to-end: method, middleware, protected vs. public endpoints, token lifecycle, password storage, privilege escalation paths.

      ### 4. Hardcoded Secrets Scan

      Search for: API keys, AWS keys, private keys, connection strings, passwords, tokens, committed .env files. Exclude test fixtures with obviously fake values.

      ## Severity Classification

      | Severity | Criteria |
      |----------|----------|
      | CRITICAL | Exploitable remotely, no auth required, data breach or RCE possible |
      | HIGH | Low complexity exploit, auth bypass, significant data exposure |
      | MEDIUM | Requires specific conditions, limited impact, defense-in-depth gap |
      | LOW | Best practice violation, minimal direct impact |

      ## Output

      Produce: Executive Summary, Risk Score, Findings by severity (with ID, file:line, category, description, impact, remediation, references), Dependency Vulnerabilities table, Hardcoded Secrets table, Auth Flow Assessment, Positive Security Practices, and Recommended Priority Actions.

      ## Rules

      1. Do NOT fix anything — report only.
      2. Do NOT print actual secret values.
      3. Minimize false positives — mark uncertain items as "potential".
      4. Be specific about remediation (exact file and line).
      5. Exclude test fixtures from secret scanning.
    flags:
      - name: --scan-type
        description: 'Scan type: deps, secrets, owasp, permissions, or all'
        type: string
        default: 'all'
      - name: --severity
        description: 'Minimum severity to report: low, medium, high, critical'
        type: string
        default: 'medium'
      - name: --fix
        description: 'Attempt to auto-fix vulnerabilities (dependency updates)'
        type: boolean
        default: false
      - name: --output
        description: 'Output format: json, markdown, or sarif'
        type: string
        default: 'markdown'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

