# =============================================================================
# commands.yaml — Command definitions for agentkit-forge
# Canonical source of truth for agentkit-forge
# Version: 0.1.0
# =============================================================================
# Each command defines: name, description, type, flags, and allowed-tools.
# Types: workflow (multi-step orchestration), team (team-scoped), utility (single action)
# =============================================================================

commands:
  # ===========================================================================
  # Workflow Commands — Multi-step orchestration and analysis
  # ===========================================================================

  - name: orchestrate
    type: workflow
    description: >
      Top-level orchestration command. Assesses the current repository state,
      identifies work to be done, delegates to appropriate team agents, and
      synthesizes results. The primary entry point for multi-step workflows.
    flags:
      - name: --assess-only
        description: 'Run assessment phase only; do not execute changes'
        type: boolean
        default: false
      - name: --scope
        description: 'Limit orchestration to specific file paths or glob patterns'
        type: string
        default: null
        required: false
      - name: --dry-run
        description: 'Show planned actions without executing them'
        type: boolean
        default: false
      - name: --team
        description: 'Delegate to a specific team instead of auto-routing'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
      - name: --phase
        description: 'Jump to a specific phase (1-5)'
        type: integer
        default: null
        required: false
        enum: [1, 2, 3, 4, 5]
      - name: --status
        description: 'Show current orchestrator state without executing'
        type: boolean
        default: false
      - name: --force-unlock
        description: 'Clear a stale session lock'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit

  - name: discover
    type: workflow
    description: >
      Scans the repository to build a comprehensive understanding of the project
      structure, tech stacks in use, team boundaries, and architectural patterns.
      Outputs a structured discovery report used by other commands.
    flags:
      - name: --output
        description: 'Output format: json, yaml, or markdown'
        type: string
        default: 'yaml'
        required: false
        enum: [json, yaml, markdown]
      - name: --depth
        description: 'Directory traversal depth limit'
        type: integer
        default: 5
      - name: --include-deps
        description: 'Include dependency analysis in discovery output'
        type: boolean
        default: true
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: healthcheck
    type: workflow
    description: >
      Performs a comprehensive health check of the repository: validates builds,
      runs tests, checks linting, verifies configuration files, and reports on
      the overall state of the codebase across all detected tech stacks.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack (node, dotnet, rust, python)'
        type: string
        default: null
        required: false
        enum: [node, dotnet, rust, python]
      - name: --project
        description: 'Scope health check to a specific project or package in a monorepo'
        type: string
        default: null
        required: false
      - name: --fix
        description: 'Attempt to auto-fix discovered issues'
        type: boolean
        default: false
      - name: --verbose
        description: 'Include detailed output for each check'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: review
    type: workflow
    description: >
      Performs a structured review of staged changes, a specific PR, or a
      range of commits across 10 quality criteria: correctness, security,
      performance, tests, documentation, compatibility, completeness, doc
      gaps, bug detection, and enhancement opportunities. Delegates to
      specialist agents for each criterion. When --focus=retrospective,
      reviews the current session to extract issues and lessons learned.
    flags:
      - name: --pr
        description: 'GitHub PR number to review'
        type: integer
        default: null
        required: false
      - name: --branch
        description: 'Branch to review (defaults to current branch). Compares against base branch to determine diff.'
        type: string
        default: null
        required: false
      - name: --range
        description: 'Git commit range to review (e.g., main..HEAD)'
        type: string
        default: null
        required: false
      - name: --file
        description: 'Review a specific file'
        type: string
        default: null
        required: false
      - name: --project
        description: 'Scope review to a specific project or package in a monorepo (e.g., --project=api)'
        type: string
        default: null
        required: false
      - name: --focus
        description: 'Focus area for the review. Code-level: security, performance, correctness, style, tests, compatibility. Higher-level: completeness, docs, bugs, enhancements. Special: retrospective. Default: all (runs criteria 1-10).'
        type: string
        default: 'all'
        required: false
        enum: [security, performance, correctness, style, tests, compatibility, completeness, docs, bugs, enhancements, retrospective, all]
      - name: --severity
        description: 'Minimum severity to report: info, warning, error, critical'
        type: string
        default: 'warning'
        required: false
        enum: [info, warning, error, critical]
      - name: --open-issues
        description: 'Create external issues for findings above --severity threshold (uses project.yaml issueTracker setting). Applies to retrospective, bugs, completeness, and enhancements focus modes.'
        type: boolean
        default: false
      - name: --dry-run
        description: 'Show findings without writing files or creating issues'
        type: boolean
        default: false
    # Runtime allowed-tools are defined in the command template frontmatter
    # with restricted Bash globs (e.g., Bash(git *), Bash(gh issue create*)).
    # This list is metadata for documentation and validation only.
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - 'Bash(git *)'
      - 'Bash(gh issue create*)'
      - 'Bash(gh issue list*)'
      - 'Bash(gh issue view*)'
      - 'Bash(linear *)'
      - 'Bash(mkdir *)'

  - name: sync-backlog
    type: workflow
    description: >
      Synchronizes the local backlog with the configured issue tracker
      (GitHub or Linear), maps findings to ownership teams, updates local
      tracking documents,
      and identifies stale or unassigned work items.
    flags:
      - name: --tracker
        description: 'Override tracker for this run (github, linear)'
        type: string
        default: null
        required: false
        enum: [github, linear]
      - name: --direction
        description: 'Sync direction: pull (from tracker), push (to tracker), or both'
        type: string
        default: 'pull'
      - name: --labels
        description: 'Filter by labels/tags (comma-separated)'
        type: string
        default: null
      - name: --owner-team
        description: 'Override intake owner team for this run'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
      - name: --team
        description: 'Filter issues relevant to a specific team'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: check
    type: workflow
    description: >
      Runs all quality checks for the repository: type checking, linting,
      formatting validation, and test suites. Returns a unified pass/fail
      status with detailed breakdowns per check category.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack'
        type: string
        default: null
      - name: --project
        description: 'Scope to a specific project or package in a monorepo (e.g., --project=api)'
        type: string
        default: null
        required: false
      - name: --fix
        description: 'Auto-fix issues where possible (lint, format)'
        type: boolean
        default: false
      - name: --bail
        description: 'Stop on first failure'
        type: boolean
        default: false
      - name: --fast
        description: 'Skip the build step; only run format + lint + typecheck + test'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: plan
    type: workflow
    description: >
      Creates a detailed implementation plan for a feature, bug fix, or
      refactoring task. Analyzes the codebase, identifies affected files and
      teams, estimates complexity, and produces a step-by-step plan with
      acceptance criteria.
    flags:
      - name: --issue
        description: 'GitHub issue number to plan for'
        type: integer
        default: null
      - name: --output
        description: 'Output format: markdown, yaml, or json'
        type: string
        default: 'markdown'
      - name: --depth
        description: 'Planning detail level: high, medium, low'
        type: string
        default: 'medium'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: handoff
    type: workflow
    description: >
      Generates a structured handoff document for the current session. Captures
      what was accomplished, what remains, open questions, and context needed
      by the next session or developer. Writes to docs/ai_handoffs/.
    flags:
      - name: --format
        description: 'Output format: markdown or yaml'
        type: string
        default: 'markdown'
      - name: --include-diff
        description: 'Include a summary of all file changes in the handoff'
        type: boolean
        default: true
      - name: --tag
        description: 'Tag for categorizing the handoff (e.g., feature, bugfix, spike)'
        type: string
        default: null
      - name: --save
        description: 'Save the handoff document to docs/ai_handoffs/'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Glob
      - Grep
      - Bash

  - name: project-review
    type: workflow
    description: >
      Comprehensive production-grade project review and assessment. Systematically
      analyzes code quality, architecture, security, UX, performance, documentation,
      and feature completeness. Produces structured findings with a prioritized
      roadmap organized into implementation waves.
    flags:
      - name: --scope
        description: 'Limit review to specific paths or modules'
        type: string
        default: null
      - name: --focus
        description: 'Focus area: all, security, performance, ux, docs, architecture'
        type: string
        default: 'all'
      - name: --phase
        description: 'Run only a specific review phase (0-4)'
        type: integer
        default: null
        required: false
        enum: [0, 1, 2, 3, 4]
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - WebSearch
      - WebFetch

  - name: infra-eval
    type: workflow
    description: >
      Risk-aware infrastructure and codebase evaluation against reliability,
      cost, and scale fitness. Scores eight weighted dimensions (0–5 each),
      enforces hard gates for critical safety properties, and produces a
      scored summary with narrative risk analysis. Designed for quarterly
      reassessment, pre-funding due diligence, and architectural decision
      support. Gated behind the evaluation.infraEval project.yaml flag.
    flags:
      - name: --scope
        description: 'Limit evaluation to specific paths or modules'
        type: string
        default: null
        required: false
      - name: --focus
        description: 'Focus area: all, reliability, cost, security, infra, scalability, architecture, code, ops'
        type: string
        default: 'all'
        required: false
        enum: [all, reliability, cost, security, infra, scalability, architecture, code, ops]
      - name: --output
        description: 'Output format: markdown, json, or yaml'
        type: string
        default: 'markdown'
        required: false
        enum: [markdown, json, yaml]
      - name: --save
        description: 'Save evaluation report to docs/evaluations/'
        type: boolean
        default: true
      - name: --gates-only
        description: 'Run hard gate checks only without full dimensional scoring'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - WebSearch
      - WebFetch

  - name: scaffold
    type: workflow
    description: >
      Generates implementation skeletons aligned with project conventions.
      Supports endpoints, UI components, IaC modules, migrations, tests,
      and services. Uses project.yaml context and domain rules to prefill
      structure and guardrails.
    flags:
      - name: --type
        description: 'Scaffold type: endpoint, component, module, migration, test, service'
        type: string
        default: null
      - name: --name
        description: 'Name of the scaffold artifact'
        type: string
        default: null
      - name: --stack
        description: 'Target tech stack override'
        type: string
        default: null
      - name: --path
        description: 'Target output path (must be inside workspace root)'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep

  - name: preflight
    type: workflow
    description: >
      Runs enhanced delivery checks before ship: quality gates, changelog,
      coverage delta, commit convention conformance, TODO/FIXME hygiene,
      and documentation updates for externally visible changes.
    flags:
      - name: --stack
        description: 'Limit checks to a specific stack'
        type: string
        default: null
      - name: --branch
        description: 'Branch to check (defaults to current branch)'
        type: string
        default: null
      - name: --base
        description: 'Remote base branch used for merge-base when --range is omitted (e.g., origin/main)'
        type: string
        default: null
      - name: --range
        description: 'Git range used for changelog/commit checks (auto-detect via merge-base; fallback emits warning and uses HEAD~50..HEAD)'
        type: string
        default: null
      - name: --strict
        description: 'Fail on warnings'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: cost
    type: utility
    description: >
      Session cost and usage tracking. Shows session summaries, lists recent
      sessions, and generates aggregate usage reports. Tracks session duration,
      commands run, and files modified via lifecycle hooks.
    flags:
      - name: --summary
        description: 'Show recent session summary'
        type: boolean
        default: false
      - name: --sessions
        description: 'List recent sessions'
        type: boolean
        default: false
      - name: --report
        description: 'Generate aggregate usage report'
        type: boolean
        default: false
      - name: --month
        description: 'Month for report (YYYY-MM format)'
        type: string
        default: null
      - name: --format
        description: 'Export format: table, json, csv'
        type: string
        default: 'table'
      - name: --last
        description: 'Time period for queries (e.g. 7d, 30d)'
        type: string
        default: '7d'
    allowed-tools:
      - Read
      - Glob

  - name: doctor
    type: utility
    description: >
      Runs AgentKit Forge diagnostics: spec validation, overlay sanity checks,
      template availability, project.yaml completeness hints, and suggested
      next actions for fixing setup issues.
    flags:
      - name: --verbose
        description: 'Include detailed diagnostics'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: document-history
    type: utility
    description: >
      Creates a structured history document from templates for significant work
      completed in the current session. Supports bug fixes, features,
      implementations, and migrations. Auto-detects type and title from git
      history when invoked without arguments. Fills in all template sections
      with concrete details from session context.
    flags:
      - name: --type
        description: 'Document type. The four primary types are used directly; issue and lesson are typically created via /review --focus=retrospective but can also be created manually.'
        type: string
        default: null
        required: false
        enum: [implementation, bugfix, feature, migration, issue, lesson]
      - name: --title
        description: 'Human-readable title for the document'
        type: string
        default: null
        required: false
      - name: --pr
        description: 'PR number to reference in the document'
        type: integer
        default: null
        required: false
      - name: --auto
        description: 'Auto-detect type and title from recent git history'
        type: boolean
        default: false
      - name: --dry-run
        description: 'Show what would be created without writing files'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - 'Bash(git *)'
      - 'Bash(./scripts/create-doc*)'
      - 'Bash(mkdir *)'

  - name: brand
    type: utility
    description: >
      Manage the project brand spec (brand.yaml) and editor theme. Supports
      validation, palette preview, theme mapping, contrast auditing,
      scaffolding, and regeneration of editor theme files.
    flags:
      - name: --validate
        description: 'Validate brand.yaml and report errors/warnings (runs implicitly when no other flags are given)'
        type: boolean
        default: false
      - name: --palette
        description: 'Show the resolved color palette with hex values'
        type: boolean
        default: false
      - name: --theme
        description: 'Show the resolved editor theme mapping (VS Code color slots → hex values)'
        type: boolean
        default: false
      - name: --contrast
        description: 'Check foreground/background contrast ratios against WCAG thresholds'
        type: boolean
        default: false
      - name: --init
        description: 'Scaffold a brand.yaml with sensible defaults (interactive prompts for name, colors)'
        type: boolean
        default: false
      - name: --generate
        description: 'Regenerate editor theme settings from brand.yaml + editor-theme.yaml (re-runs syncEditorTheme)'
        type: boolean
        default: false
      - name: --all
        description: 'Run all audit steps: validate + palette + theme + contrast'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Write
      - Edit
      - Bash

  - name: expand
    type: utility
    description: >
      Runs the expansion analyzer to identify gaps, missing capabilities,
      undocumented decisions, and improvement opportunities in the codebase.
      Produces a ranked list of suggestions with rationale, impact scores,
      and effort estimates. Never creates tasks in analysis mode — all
      suggestions require explicit human approval. Use --save to persist
      suggestions to disk for later review.
    flags:
      - name: --category
        description: 'Comma-separated categories to analyze: documentation, testing, security, architecture, operations, feature'
        type: string
        default: null
        required: false
      - name: --max-suggestions
        description: 'Maximum number of suggestions to return'
        type: integer
        default: 10
      - name: --min-impact
        description: 'Minimum impact level to include: critical, high, medium, low'
        type: string
        default: 'low'
        required: false
        enum: [critical, high, medium, low]
      - name: --output
        description: 'Output format: markdown, yaml, or json'
        type: string
        default: 'markdown'
        required: false
        enum: [markdown, yaml, json]
      - name: --save
        description: 'Save suggestions to .claude/state/suggestions/ for later review'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Glob
      - Grep

  # ===========================================================================
  # Framework Commands — AgentKit Forge internal tooling
  # ===========================================================================

  - name: validate
    type: utility
    description: >
      Validates generated outputs for correctness. Checks that all required
      directories, JSON files, command files, and hook scripts exist and are
      well-formed. Scans for forbidden patterns (hardcoded secrets) and
      verifies the settings.json hooks configuration.
    flags: []
    allowed-tools:
      - Read
      - Glob

  # ===========================================================================
  # Utility Commands — Single-action tools
  # ===========================================================================

  - name: build
    type: utility
    description: >
      Builds the project using the detected tech stack's build command. Supports
      targeting specific packages in a monorepo or building the entire workspace.
    flags:
      - name: --stack
        description: 'Force a specific tech stack build command'
        type: string
        default: null
      - name: --package
        description: 'Build a specific package/app in a monorepo'
        type: string
        default: null
      - name: --production
        description: 'Build in production mode'
        type: boolean
        default: false
      - name: --verbose
        description: 'Show verbose build output'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: test
    type: utility
    description: >
      Runs the test suite using the detected tech stack's test command. Supports
      filtering by test file, pattern, or package. Reports pass/fail counts
      and coverage when available.
    flags:
      - name: --stack
        description: 'Force a specific tech stack test command'
        type: string
        default: null
      - name: --filter
        description: 'Filter tests by name or pattern'
        type: string
        default: null
      - name: --coverage
        description: 'Generate coverage report'
        type: boolean
        default: false
      - name: --watch
        description: 'Run tests in watch mode'
        type: boolean
        default: false
      - name: --package
        description: 'Test a specific package/app in a monorepo'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: format
    type: utility
    description: >
      Formats code using the detected tech stack's formatter. Can target
      specific files, directories, or the entire workspace. Reports files
      that were changed.
    flags:
      - name: --stack
        description: 'Force a specific tech stack formatter'
        type: string
        default: null
      - name: --check
        description: 'Check formatting without making changes'
        type: boolean
        default: false
      - name: --path
        description: 'Format only files matching this path or glob'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: deploy
    type: utility
    description: >
      Triggers a deployment pipeline or generates deployment artifacts.
      Validates pre-deployment checks (build, test, lint) before proceeding.
      Supports dry-run mode for safety.
    flags:
      - name: --environment
        description: 'Target environment: dev, staging, production'
        type: string
        default: 'dev'
      - name: --dry-run
        description: 'Simulate deployment without executing'
        type: boolean
        default: true
      - name: --project
        description: 'Deploy a specific project or package in a monorepo'
        type: string
        default: null
      - name: --skip-checks
        description: 'Skip pre-deployment quality checks (use with caution)'
        type: boolean
        default: false
      - name: --stack
        description: 'Deploy a specific tech stack component'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: security
    type: utility
    description: >
      Runs security-focused analysis: dependency vulnerability scanning,
      secret detection, OWASP compliance checks, and permission auditing.
      Generates a security report with severity ratings.
    flags:
      - name: --scan-type
        description: 'Scan type: deps, secrets, owasp, permissions, or all'
        type: string
        default: 'all'
      - name: --severity
        description: 'Minimum severity to report: low, medium, high, critical'
        type: string
        default: 'medium'
      - name: --fix
        description: 'Attempt to auto-fix vulnerabilities (dependency updates)'
        type: boolean
        default: false
      - name: --output
        description: 'Output format: json, markdown, or sarif'
        type: string
        default: 'markdown'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  # ===========================================================================
  # Team Commands — Scoped to team domains defined in teams.yaml
  # ===========================================================================

  - name: team-backend
    type: team
    team: backend
    description: >
      Activates the BACKEND team context. Scopes all operations to API,
      services, and core logic files. Applies backend-specific rules and
      delegates to backend-specialized agents.
    flags:
      - name: --task
        description: 'Specific task to perform within the backend scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-frontend
    type: team
    team: frontend
    description: >
      Activates the FRONTEND team context. Scopes all operations to UI,
      components, and PWA files. Applies frontend-specific rules including
      WCAG AA accessibility and component patterns.
    flags:
      - name: --task
        description: 'Specific task to perform within the frontend scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-data
    type: team
    team: data
    description: >
      Activates the DATA team context. Scopes all operations to database,
      models, and migration files. Applies data-specific rules including
      migration safety and schema validation.
    flags:
      - name: --task
        description: 'Specific task to perform within the data scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-infra
    type: team
    team: infra
    description: >
      Activates the INFRA team context. Scopes all operations to IaC, cloud,
      and Terraform/Bicep files. Applies infrastructure-specific rules
      including state safety and drift detection.
    flags:
      - name: --task
        description: 'Specific task to perform within the infra scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-devops
    type: team
    team: devops
    description: >
      Activates the DEVOPS team context. Scopes all operations to CI/CD
      pipelines, scripts, and Docker configurations. Applies DevOps-specific
      rules including pipeline validation and container best practices.
    flags:
      - name: --task
        description: 'Specific task to perform within the devops scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-testing
    type: team
    team: testing
    description: >
      Activates the TESTING team context. Scopes all operations to test files,
      E2E suites, and integration tests. Applies testing-specific rules
      including coverage thresholds and test organization patterns.
    flags:
      - name: --task
