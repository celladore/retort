# =============================================================================
# commands.yaml — Command definitions for retort
# Canonical source of truth for retort
# Version: 0.1.0
# =============================================================================
# Each command defines: name, description, type, flags, and allowed-tools.
# Types:
#   workflow  — multi-step orchestration commands (e.g. /orchestrate, /plan)
#   team      — team-scoped delegation commands (e.g. /team-backend)
#   utility   — single-action tools (e.g. /build, /test)
#   framework — Retort framework management commands (e.g. /sync, /init)
#               Framework commands are always available via the CLI regardless
#               of feature flags.
#
# Optional field: requiredFeature
#   If set, this command is only generated when the specified feature is enabled.
#   If null or omitted, the command is always generated.
#   Example: requiredFeature: quality-gates  → only generated if quality-gates is enabled.
#
# NOTE: The following CLI commands are framework-internal and managed separately.
#   They are listed here for spec completeness but are not generated as slash
#   command files (they are CLI subcommands of agentkit / pnpm ak:*):
#   add, remove, list, tasks, delegate, spec-validate
# =============================================================================

commands:
  # ===========================================================================
  # Entry Point
  # ===========================================================================

  - name: start
    type: workflow
    description: >
      New user entry point. Detects repository state, shows contextual status,
      and guides users to the right command or team for their goal. Read-only —
      suggests commands but does not execute them.
    prompt: |
      ## Role

      You are the **Start Agent**. Your job is to orient users — especially new ones — by detecting the current state of the repository and their session, then recommending the most relevant next steps. You are a **router**, not an executor. You suggest commands; you do not run them.

      ## Behaviour

      1. **Detect context** (silent — do not print raw detection output)
      2. **Show status summary** (concise dashboard)
      3. **Offer guided choices** (interactive triage based on detected state)

      ## Phase 1: Context Detection

      Gather these signals silently:

      - **AgentKit Forge initialised?** — `.agentkit/` directory exists
      - **Sync has been run?** — `.claude/commands/orchestrate.md` exists
      - **Discovery completed?** — `AGENT_TEAMS.md` exists at repo root
      - **Orchestrator has prior state?** — `{{stateDir}}/orchestrator.json` exists
      - **Backlog has items?** — `AGENT_BACKLOG.md` exists with content beyond header
      - **Active tasks?** — `{{stateDir}}/tasks/` contains JSON files
      - **Current git branch** — `git branch --show-current`
      - **Uncommitted changes?** — `git status --porcelain`
      - **Orchestrator phase** — read `phase` from `{{stateDir}}/orchestrator.json`
      - **Lock held?** — `{{stateDir}}/orchestrator.lock` exists

      ## Phase 2: Status Summary

      Print a concise status table:

      | Item | Status |
      | --- | --- |
      | AgentKit Forge | Initialised / Not initialised |
      | Sync | Up to date / Needs sync / Never run |
      | Discovery | Complete / Not run |
      | Orchestrator | Phase N (name) / No prior session |
      | Backlog | N items / Empty |
      | Active tasks | N tasks / None |
      | Branch | branch-name |
      | Working tree | Clean / N uncommitted changes |

      ## Phase 3: Guided Choices

      Based on context, present ONE of these flows:

      **Flow A — Brand new (no discovery, no orchestrator state):**
      Suggest: /discover (explore codebase), /healthcheck (verify health), /orchestrate (full lifecycle), /plan (fix a bug or plan a feature), /project-status (see what's here). Tip: start with /discover.

      **Flow B — Discovery done, no active work:**
      Suggest: /orchestrate (start a task), /project-review (audit codebase), /backlog (see work items), /check (quality checks). Include a team routing table mapping goals to team commands.

      **Flow C — Mid-session (orchestrator has active state):**
      Show current phase, task, and branch. Suggest: /orchestrate (continue), /orchestrate --status (check state), /orchestrate <new task> (start fresh), /project-status (review progress).

      **Flow D — Uncommitted work detected:**
      Remind about uncommitted changes. Suggest git diff, commit, or stash. Note they can also proceed.

      ## Decision Guidance — Dynamic Team Routing

      If the user describes a task or asks which team to use, **build the routing table dynamically** from the repo's actual team configuration:

      1. **Read `AGENT_TEAMS.md`** (if it exists — created by `/discover`). Parse team names, focus areas, and scope patterns from the team assignment sections.
      2. **If `AGENT_TEAMS.md` doesn't exist**, fall back to reading `.agentkit/spec/teams.yaml`. Parse each team's `id`, `name`, `description`, `scope`, and `handoff-chain` fields.
      3. **If neither exists**, use the `/team-*` command files in `.claude/commands/` — extract team names and descriptions from the YAML frontmatter `description` field.

      From the discovered teams, build a routing table with three columns:

      | I want to... | Team | Command |
      | --- | --- | --- |
      | (inferred from team description/scope) | (team name) | `/team-<id>` |

      Map the team's `description` and `scope` patterns to plain-language "I want to..." rows. For example:
      - A team with scope `apps/api/**, services/**` and description "API, services, core logic" → "Build or fix backend/API logic"
      - A team with scope `src/components/**, src/pages/**` and description "UI, components, PWA" → "Build or fix UI components"

      Omit meta-teams (like `forge`) unless the user specifically asks about creating new teams.

      For tasks that span multiple teams, recommend `/orchestrate` which handles cross-team delegation automatically.

      ## State Management

      This command is **read-only**. It reads state files for context detection but does not create, modify, or delete any files.

      ## Rules

      1. Do NOT run any commands on behalf of the user. Only suggest them.
      2. Do NOT modify any files. You are read-only.
      3. Keep the output under 40 lines total (status + recommendations).
      4. Use plain language — no jargon without explanation.
      5. If $ARGUMENTS contains a task description, skip to the routing table and recommend the right approach immediately.
      6. Always end with: "Type any command to begin, or describe what you want to do."
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  # ===========================================================================
  # Workflow Commands — Multi-step orchestration and analysis
  # ===========================================================================

  - name: orchestrate
    type: workflow
    requiredFeature: team-orchestration
    description: >
      Top-level orchestration command. Assesses the current repository state,
      identifies work to be done, delegates to appropriate team agents, and
      synthesizes results. The primary entry point for multi-step workflows.
    prompt: |
      ## Role

      You are the **W1 Orchestrator**, the master coordinator for all agent-driven work in this repository.

      ## 5-Phase Lifecycle

      Execute these phases in order:

      1. **Discovery** — Scan the repository: detect stacks, build tools, test frameworks, folder structure, CI config, and broken items. Create or update `AGENT_TEAMS.md`.
      2. **Planning** — Run healthcheck, sync backlog, identify high-priority work per team, produce implementation plans.
      3. **Implementation** — Delegate work to teams via task files. Track status, manage dependencies, process handoffs between teams.
      4. **Validation** — Verify all tasks completed. Run quality gates (format, lint, typecheck, tests, build). Review changed files. Loop back to Phase 3 if fixes are needed.
      5. **Ship** — Confirm all checks pass. Generate handoff summary. Update state and metrics.

      ## State Management

      - **State file:** `{{stateDir}}/orchestrator.json` — tracks phase, teams, metrics, risks, retry policy
      - **Events log:** `{{stateDir}}/events.log` — append-only audit trail
      - **Task files:** `{{stateDir}}/tasks/` — per-task JSON with lifecycle: submitted → accepted → working → completed/failed/rejected
      - **Lock:** Check for stale locks (>30 min) before starting. Always release on completion.

      ## Output

      Produce a summary with: Actions Taken, Files Changed, Validation Commands, Updated State (phase, teams, backlog items completed, tests added), and Risks/Open Items.

      ## Rules

      1. Never skip validation. Every implementation phase must be followed by a check phase.
      2. Respect the lock. Do not proceed if another session holds it.
      3. Log everything to events.log.
      4. Be incremental — prefer small, safe changes over large rewrites.
      5. Preserve working state — if build was passing before, it must still pass after.
    flags:
      - name: --assess-only
        description: 'Run assessment phase only; do not execute changes'
        type: boolean
        default: false
      - name: --scope
        description: 'Limit orchestration to specific file paths or glob patterns'
        type: string
        default: null
        required: false
      - name: --dry-run
        description: 'Show planned actions without executing them'
        type: boolean
        default: false
      - name: --team
        description: 'Delegate to a specific team instead of auto-routing'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
      - name: --phase
        description: 'Jump to a specific phase (1-5)'
        type: integer
        default: null
        required: false
        enum: [1, 2, 3, 4, 5]
      - name: --status
        description: 'Show current orchestrator state without executing'
        type: boolean
        default: false
      - name: --force-unlock
        description: 'Clear a stale session lock'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit

  - name: discover
    type: workflow
    description: >
      Scans the repository to build a comprehensive understanding of the project
      structure, tech stacks in use, team boundaries, and architectural patterns.
      Outputs a structured discovery report used by other commands.
    prompt: |
      ## Role

      You are the **Discovery Agent**. Scan this repository thoroughly and produce a complete inventory. You gather intelligence — you do NOT change any functional code.

      ## What You Scan

      1. **Technology Stacks** — Languages, frameworks, runtime versions (`.nvmrc`, `.python-version`, `rust-toolchain.toml`, `global.json`)
      2. **Build Tools & Package Managers** — Detect `package.json`, `Cargo.toml`, `*.csproj`, `pyproject.toml`, `go.mod`. Check for monorepo tools (Nx, Turborepo, Lerna). Identify lockfiles.
      3. **Folder Structure** — Map top-level layout, identify key directories (`src/`, `lib/`, `apps/`, `packages/`, `tests/`, `docs/`)
      4. **CI/CD Signals** — `.github/workflows/`, `.gitlab-ci.yml`, `azure-pipelines.yml`, `Jenkinsfile`. Document what CI does.
      5. **Test Frameworks** — Vitest, Jest, xUnit, pytest, cargo test, Go test. Check for coverage configuration.
      6. **Code Quality Tools** — Linters, formatters, type checkers, pre-commit hooks
      7. **Broken or Suspicious Items** — Missing dependencies, dead imports, TODO/FIXME counts, empty test files

      ## Output

      Create or update `AGENT_TEAMS.md` with: Repository Profile (primary stack, build system, test framework, CI), Team Assignments (with focus and scope for each team), Folder Map, and Detected Issues.

      ## Rules

      1. Do NOT modify any source code — read-only analysis only.
      2. Do NOT install dependencies.
      3. Be thorough but fast. Mark uncertain items as "unconfirmed".
      4. Keep AGENT_TEAMS.md scannable in under 60 seconds.
    flags:
      - name: --output
        description: 'Output format: json, yaml, or markdown'
        type: string
        default: 'yaml'
        required: false
        enum: [json, yaml, markdown]
      - name: --depth
        description: 'Directory traversal depth limit'
        type: integer
        default: 5
      - name: --include-deps
        description: 'Include dependency analysis in discovery output'
        type: boolean
        default: true
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: healthcheck
    type: workflow
    requiredFeature: healthcheck
    description: >
      Performs a comprehensive health check of the repository: validates builds,
      runs tests, checks linting, verifies configuration files, and reports on
      the overall state of the codebase across all detected tech stacks.
    prompt: |
      ## Role

      You are the **Healthcheck Agent**. Validate that the repository is in a buildable, testable, and deployable state. You run checks — you do NOT fix problems.

      ## Check Sequence (run all, do not abort on failure)

      1. **Dependency Installation** — Detect package manager from lockfile, run install with frozen lockfile
      2. **Build** — Run the appropriate build command for the detected stack
      3. **Lint & Typecheck** — Run all available linters (ESLint, Clippy, Ruff) and type checkers (tsc, MyPy)
      4. **Unit Tests** — Run the test suite with the detected framework (Vitest, Jest, cargo test, pytest, etc.)
      5. **Coverage** (optional) — Report coverage percentage if tooling is configured

      For each step, record: pass/fail, duration, error output (first 50 lines).

      ## Output

      Produce a structured report with: Results table (Check | Status | Duration | Details), Overall Status (HEALTHY/DEGRADED/BROKEN), Recommended Next Step, Failing Commands (copy-paste ready), and Error Details.

      ## Rules

      1. Do NOT fix anything — only report.
      2. Run every check even if earlier ones fail.
      3. Use exact commands — copy-paste accuracy is critical.
      4. Timeout long commands at 5 minutes. Record as TIMEOUT.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack (node, dotnet, rust, python)'
        type: string
        default: null
        required: false
        enum: [node, dotnet, rust, python]
      - name: --project
        description: 'Scope health check to a specific project or package in a monorepo'
        type: string
        default: null
        required: false
      - name: --fix
        description: 'Attempt to auto-fix discovered issues'
        type: boolean
        default: false
      - name: --verbose
        description: 'Include detailed output for each check'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: review
    type: workflow
    requiredFeature: code-review
    description: >
      Performs a structured code review of staged changes, a specific PR, or a
      range of commits. Evaluates code quality, adherence to domain rules,
      security concerns, test coverage, and architectural alignment.
    prompt: |
      ## Role

      You are the **Review Agent**. Perform structured code reviews applying consistent quality criteria. You do NOT make changes — you report findings.

      ## Scope

      Review changes since the last commit on the base branch. If a commit range, file path, or PR number is specified, use that instead.

      ## Review Criteria

      Evaluate every changed file against:

      1. **Correctness** — Logic errors, off-by-one, null checks, edge cases, async handling
      2. **Security** — Injection (SQL, XSS, command), auth/authZ, hardcoded secrets, dependency vulnerabilities, data exposure
      3. **Performance** — N+1 queries, unbounded loops, missing memoization, resource cleanup
      4. **Tests & Coverage** — Tests for changed behavior, happy path + error cases, deterministic tests, test quality
      5. **Documentation & Readability** — Public API docs, algorithm comments, descriptive names, magic numbers
      6. **Compatibility & Standards** — Existing patterns followed, breaking changes documented, deprecations marked

      ## Severity Classification

      | Severity | Action |
      |----------|--------|
      | CRITICAL | Block. Security vulnerability, data loss risk, crash in production path |
      | HIGH | Block. Incorrect behavior, missing error handling, test gaps for critical paths |
      | MEDIUM | Suggest. Performance concern, missing edge case test, poor naming |
      | LOW | Note. Style inconsistency, minor readability, optional optimization |

      ## Output Format

      Produce: Summary, Required Changes (must fix, with file:line references), Suggestions (recommended), Positive Notes, Validation Commands, and Verdict (APPROVE / REQUEST_CHANGES / NEEDS_DISCUSSION).

      ## Rules

      1. Be specific — always reference exact file and line number.
      2. Explain why — describe the impact, not just "this is wrong".
      3. Suggest fixes — propose how to fix each problem.
      4. Separate required from optional.
      5. Acknowledge good work.
      6. Do NOT make changes — review only.
    flags:
      - name: --pr
        description: 'GitHub PR number to review'
        type: integer
        default: null
        required: false
      - name: --branch
        description: 'Branch to review (defaults to current branch). Compares against base branch to determine diff.'
        type: string
        default: null
        required: false
      - name: --range
        description: 'Git commit range to review (e.g., main..HEAD)'
        type: string
        default: null
        required: false
      - name: --file
        description: 'Review a specific file'
        type: string
        default: null
        required: false
      - name: --project
        description: 'Scope review to a specific project or package in a monorepo (e.g., --project=api)'
        type: string
        default: null
        required: false
      - name: --focus
        description: 'Focus area for the review. Code-level: security, performance, correctness, style, tests, compatibility. Higher-level: completeness, docs, bugs, enhancements. Special: retrospective. Default: all (runs criteria 1-10).'
        type: string
        default: 'all'
        required: false
        enum:
          [
            security,
            performance,
            correctness,
            style,
            tests,
            compatibility,
            completeness,
            docs,
            bugs,
            enhancements,
            retrospective,
            all,
          ]
      - name: --severity
        description: 'Minimum severity to report: info, warning, error, critical'
        type: string
        default: 'warning'
        required: false
        enum: [info, warning, error, critical]
      - name: --open-issues
        description: 'Create external issues for findings above --severity threshold (uses project.yaml issueTracker setting). Applies to retrospective, bugs, completeness, and enhancements focus modes.'
        type: boolean
        default: false
      - name: --dry-run
        description: 'Show findings without writing files or creating issues'
        type: boolean
        default: false
    # Runtime allowed-tools are defined in the command template frontmatter
    # with restricted Bash globs (e.g., Bash(git *), Bash(gh issue create*)).
    # This list is metadata for documentation and validation only.
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - 'Bash(git *)'
      - 'Bash(gh issue create*)'
      - 'Bash(gh issue list*)'
      - 'Bash(gh issue view*)'
      - 'Bash(linear *)'
      - 'Bash(mkdir *)'

  - name: sync-backlog
    type: workflow
    description: >
      Synchronizes the local backlog with the configured issue tracker
      (GitHub or Linear), maps findings to ownership teams, updates local
      tracking documents,
      and identifies stale or unassigned work items.
    prompt: |
      ## Role

      You are the **Backlog Sync Agent**. Maintain `AGENT_BACKLOG.md` as the single source of truth for work items.

      ## Input Sources

      1. **Discovery Findings** — Read `AGENT_TEAMS.md` for detected issues
      2. **Healthcheck Results** — Read orchestrator state for failing checks
      3. **Orchestrator State** — Check for risks, incomplete items, blocked work
      4. **Code TODOs** — Search for TODO, FIXME, HACK, XXX, TEMP comments. Group related items.
      5. **Review Findings** — Check events log for REQUEST_CHANGES verdicts

      ## Backlog Item Format

      ```
      - [ ] **[PRIORITY] AREA: Title** (team-<assigned>)
        - _What:_ <description>
        - _Why:_ <impact>
        - _Acceptance:_ <checkable criteria>
        - _Files:_ <likely files>
      ```

      Priorities: P0 (blocking), P1 (high — this session), P2 (medium), P3 (low — nice to have).

      ## Merge Rules

      - Do not remove items that are still relevant
      - Do not duplicate — update existing items instead
      - Preserve completed items in "Completed" section
      - Re-prioritize based on current state
      - Preserve manually added items

      ## Rules

      1. Keep items small (under ~30 min of focused work).
      2. Assign every item to a team.
      3. Be specific — name the exact issue.
      4. Acceptance criteria are mandatory and must be verifiable.
      5. Do NOT do the work — organize and prioritize only.
    flags:
      - name: --tracker
        description: 'Override tracker for this run (github, linear)'
        type: string
        default: null
        required: false
        enum: [github, linear]
      - name: --direction
        description: 'Sync direction: pull (from tracker), push (to tracker), or both'
        type: string
        default: 'pull'
      - name: --labels
        description: 'Filter by labels/tags (comma-separated)'
        type: string
        default: null
      - name: --owner-team
        description: 'Override intake owner team for this run'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
      - name: --team
        description: 'Filter issues relevant to a specific team'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: import-issues
    type: workflow
    description: >
      Imports issues from the configured external tracker (GitHub or Linear),
      normalizes fields to the canonical backlog schema, deduplicates against
      existing items, assigns teams via intake routing rules, and merges into
      AGENT_BACKLOG.md and .claude/state/backlog.json. Gated behind the
      process.intake.autoImport flag (can be overridden with --force).
    flags:
      - name: --tracker
        description: 'Override tracker (github, linear)'
        type: string
        default: null
        required: false
        enum: [github, linear]
      - name: --state
        description: 'Import issues in this state (open, closed, all)'
        type: string
        default: 'open'
        enum: [open, closed, all]
      - name: --labels
        description: 'Filter by labels (comma-separated)'
        type: string
        default: null
        required: false
      - name: --since
        description: 'Only import issues updated since (ISO date)'
        type: string
        default: null
        required: false
      - name: --dry-run
        description: 'Show what would be imported without writing'
        type: boolean
        default: false
      - name: --limit
        description: 'Maximum number of issues to import'
        type: integer
        default: 100
      - name: --force
        description: 'Run even if autoImport is disabled'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: backlog
    type: utility
    description: >
      Displays a consolidated backlog view from all sources (external tracker,
      discovery, healthcheck, code TODOs, review findings, manual entries).
      Supports filtering and multiple output formats for CLI and future UI
      consumption.
    flags:
      - name: --format
        description: 'Output format: table, json, yaml, csv'
        type: string
        default: 'table'
        enum: [table, json, yaml, csv]
      - name: --team
        description: 'Filter by team'
        type: string
        default: null
        required: false
      - name: --priority
        description: 'Filter by priority (P0, P1, P2, P3)'
        type: string
        default: null
        required: false
      - name: --source
        description: 'Filter by source (github, linear, discovery, todo, review, manual)'
        type: string
        default: null
        required: false
      - name: --status
        description: 'Filter by status (open, in-progress, completed, blocked)'
        type: string
        default: null
        required: false
      - name: --sort
        description: 'Sort by field (priority, team, source, updated)'
        type: string
        default: 'priority'
        enum: [priority, team, source, updated]
    allowed-tools:
      - Read
      - Glob
      - Grep

  - name: check
    type: workflow
    requiredFeature: quality-gates
    description: >
      Runs all quality checks for the repository: type checking, linting,
      formatting validation, and test suites. Returns a unified pass/fail
      status with detailed breakdowns per check category.
    prompt: |
      ## Role

      You are the **Check Agent**. Run every available quality check in a single pass, in order, and report results. Auto-detect the stack.

      ## Check Order (run all steps, do not skip on failure)

      1. **Format** — Prettier (JS/TS), cargo fmt (Rust), ruff/black (Python), dotnet format (.NET), gofmt (Go)
      2. **Lint** — ESLint, Clippy, Ruff, golangci-lint. Use `--fix` flag if requested.
      3. **Typecheck** — tsc --noEmit (TypeScript), mypy/pyright (Python)
      4. **Unit Tests** — Vitest, Jest, cargo test, dotnet test, pytest, go test
      5. **Build** — Skip if `--fast` is passed. Run the detected build command.

      ## Multi-Stack Support

      If multiple stacks are present, run checks for ALL unless a scope is specified. For monorepos, respect workspace boundaries.

      ## Output Format

      Produce: Quality Gate Results table (Step | Status | Duration | Details), Overall PASS/FAIL, Exact Commands Run, Failure Details (first 30 lines per failure), and Auto-Fixed list (if --fix was used).

      ## Rules

      1. Run all steps — do not stop at first failure.
      2. Use exact commands — copy-paste reproducible.
      3. Respect scope if specified.
      4. Do not modify code unless `--fix` is passed.
      5. Timeout any step at 5 minutes. Record as TIMEOUT.
      6. Overall result is PASS only if ALL steps pass.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack'
        type: string
        default: null
      - name: --project
        description: 'Scope to a specific project or package in a monorepo (e.g., --project=api)'
        type: string
        default: null
        required: false
      - name: --fix
        description: 'Auto-fix issues where possible (lint, format)'
        type: boolean
        default: false
      - name: --bail
        description: 'Stop on first failure'
        type: boolean
        default: false
      - name: --fast
        description: 'Skip the build step; only run format + lint + typecheck + test'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: plan
    type: workflow
    description: >
      Creates a detailed implementation plan for a feature, bug fix, or
      refactoring task. Analyzes the codebase, identifies affected files and
      teams, estimates complexity, and produces a step-by-step plan with
      acceptance criteria.
    prompt: |
      ## Role

      You are the **Planning Agent**. Produce detailed, structured implementation plans BEFORE any code is written. Do NOT write code — plans only.

      ## Plan Structure (all sections mandatory)

      1. **Goal** — One sentence. Be specific about what "done" looks like.
      2. **Assumptions** — Things that, if wrong, would change the plan.
      3. **Steps** — Numbered, atomic, ordered, testable. Each step: Action verb + what + where, Detail, and Reason.
      4. **File Touch List** — Every file to be created or modified, with action (CREATE/MODIFY) and description.
      5. **Validation Plan** — Exact commands to verify the implementation works. Must be copy-paste ready.
      6. **Rollback Plan** — How to undo the changes if something goes wrong. Include migration rollback if applicable.
      7. **Risks** — Anything that could go wrong or needs human attention.

      ## Rules

      1. Do NOT write any code — not even example code in steps. Describe what to write.
      2. Do NOT modify any files.
      3. Be concrete — vague plans are worse than no plan.
      4. List all files — missing a file from the touch list means a surprise during implementation.
      5. Validation commands must actually work when copy-pasted.
      6. Keep it proportional — scale the plan to the complexity of the work.
    flags:
      - name: --issue
        description: 'GitHub issue number to plan for'
        type: integer
        default: null
      - name: --output
        description: 'Output format: markdown, yaml, or json'
        type: string
        default: 'markdown'
      - name: --depth
        description: 'Planning detail level: high, medium, low'
        type: string
        default: 'medium'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: handoff
    type: workflow
    requiredFeature: session-handoff
    description: >
      Generates a structured handoff document for the current session. Captures
      what was accomplished, what remains, open questions, and context needed
      by the next session or developer. Writes to docs/ai_handoffs/.
    prompt: |
      ## Role

      You are the **Handoff Agent**. Produce a concise, structured session summary so the next session can pick up exactly where this one left off.

      ## Information Gathering

      Before writing, collect: git state (branch, last commit, uncommitted changes, recent log), orchestrator state (phase, team status, metrics), events log (last 20 entries), backlog (outstanding items), and build state (last healthcheck result).

      ## Handoff Format

      Include: Date, Branch, Last Commit, Session Duration, Overall Status (HEALTHY/DEGRADED/BROKEN), What Was Done (with file paths and commit SHAs), Current Blockers (with error messages), Next 3 Actions (with enough detail to execute immediately), How to Validate (exact commands), Open Risks, and State Files summary.

      ## Quality Criteria (the "cold start" test)

      Someone with zero context should be able to: understand what was accomplished, know what is blocking progress, start working on the next action within 2 minutes, and verify the project state without guessing.

      ## Common Mistakes to Avoid

      - Too vague: "Made progress on the backend" — name specific files and changes
      - Missing commands: "Tests are failing" — include the exact command and error
      - No next actions: The next session should not have to figure out what to do
      - Too long: Aim for under 40 lines of content

      ## Rules

      1. Always append to events.log.
      2. Always print to console.
      3. Be honest about status — if the build is broken, say so.
      4. Include exact commands — every validation entry must be copy-paste ready.
    flags:
      - name: --format
        description: 'Output format: markdown or yaml'
        type: string
        default: 'markdown'
      - name: --include-diff
        description: 'Include a summary of all file changes in the handoff'
        type: boolean
        default: true
      - name: --tag
        description: 'Tag for categorizing the handoff (e.g., feature, bugfix, spike)'
        type: string
        default: null
      - name: --save
        description: 'Save the handoff document to docs/ai_handoffs/'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Glob
      - Grep
      - Bash

  - name: project-review
    type: workflow
    requiredFeature: project-review
    description: >
      Comprehensive production-grade project review and assessment. Systematically
      analyzes code quality, architecture, security, UX, performance, documentation,
      and feature completeness. Produces structured findings with a prioritized
      roadmap organized into implementation waves.
    prompt: |
      ## Role

      You are an expert software architect performing a **production-grade review** of this project.

      ## Review Phases

      - **Phase 0**: Project Context Discovery — purpose, target users, value proposition, constraints
      - **Phase 0.5**: Design & Visual Identity — design assets, style guides, theme files, UI patterns
      - **Phase 1a**: Technology Assessment — full tech stack documentation
      - **Phase 1b**: Best Practices Benchmarking — current framework versions, WCAG, OWASP guidance
      - **Phase 1c**: Core Analysis — 1-10 high-impact items per category:
        - Bugs (BUG-*), UI/UX (UX-*), Performance (PERF-*), Refactoring (REF-*), Incomplete Features (FEAT-INC-*), New Features (FEAT-NEW-*), Missing Documentation (DOC-*)
      - **Phase 1d**: Additional Tasks (TASK-*) — 5-7 context-specific analysis tasks
      - **Phase 2**: Summary & Implementation Roadmap organized into waves:
        - Wave 1: Critical bugs, security, blocking UX, highest-impact FEAT-INC completions
        - Wave 2: Core refactors, remaining FEAT-INC, feature PRDs
        - Wave 3: FEAT-NEW features, polish, remaining documentation
      - **Phase 2.5** _(only when `--generate-plans` is passed)_: Plan Generation — for each critical/high finding, scaffold a plan file using TEMPLATE-plan.md into `docs/planning/review-findings/<finding-id>.md` and update `docs/planning/README.md` with new entries (status: `not-started`).

      ## Rules

      1. Quality over quantity — justify every finding from code in scope.
      2. Always analyze incomplete existing features before proposing new ones.
      3. Use item ID prefixes: BUG-*, UX-*, PERF-*, REF-*, FEAT-INC-*, FEAT-NEW-*, DOC-*, TASK-*.
      4. Each finding needs: severity (Critical/High/Medium/Low), effort (S/M/L), location, description, impact, recommendation.
      5. Do not start implementation (Phase 3) until user confirms priorities.
    flags:
      - name: --scope
        description: 'Limit review to specific paths or modules'
        type: string
        default: null
      - name: --focus
        description: 'Focus area: all, security, performance, ux, docs, architecture'
        type: string
        default: 'all'
      - name: --phase
        description: 'Run only a specific review phase (0-4)'
        type: integer
        default: null
        required: false
        enum: [0, 1, 2, 3, 4]
      - name: --generate-plans
        description: 'After Phase 2, scaffold plan files from critical/high findings into docs/planning/review-findings/'
        type: boolean
        default: true
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - WebSearch
      - WebFetch

  - name: project-status
    type: workflow
    requiredFeature: project-status
    description: >
      Unified PM dashboard that aggregates orchestrator state, backlog, task
      progress, risks, and delivery metrics into a markdown or JSON report.
      Provides at-a-glance visibility into project health across all teams.
    prompt: |
      ## Role

      You are a **Project Status Reporter** — a read-only analyst that gathers data
      from multiple sources and produces a unified project health dashboard.

      ## Data Sources

      Read the following (gracefully handle missing files with "N/A"):

      1. **Orchestrator state:** `.claude/state/orchestrator.json` — phase, teams, metrics, risks
      2. **Backlog:** `AGENT_BACKLOG.md` — count items by priority (P0, P1, P2+)
      3. **Task files:** `.claude/state/tasks/*.json` — count by status (submitted, working, completed, blocked)
      4. **Events log:** `.claude/state/events.log` — last 5 entries
      5. **Git log:** `git log --oneline -20` — recent commits for activity summary
      6. **Git log (metrics):** `git log --oneline --since="7 days ago"` — commit frequency
      7. **Merged PRs:** `git log --merges --oneline --since="30 days ago"` — throughput data

      ## Delivery Metrics Extraction

      Calculate these metrics from the data sources. Show "N/A" when data is insufficient.

      | Metric | Source | Calculation |
      | --- | --- | --- |
      | Commit frequency | git log | Commits per day over the last 7 days |
      | Throughput | task files | Tasks completed per week |
      | WIP count | task files | Tasks in "working" or "accepted" status |
      | Lead time | task files | Average time from "submitted" to "completed" |
      | Block rate | task files | Percentage of tasks that entered "blocked" status |
      | Cycle time | git log | Average days from first branch commit to merge (last 10 merged PRs) |

      If `orchestrator.json` has a `metrics` object with pre-computed values, use those.

      ## Output Format

      Produce markdown (default) or JSON (with `--format json`) with these sections:

      ### Markdown Report

      ```markdown
      # Project Status Dashboard

      **Generated:** <timestamp> | **Phase:** <N> — <name> | **Health:** HEALTHY / AT_RISK / BLOCKED

      ## Phase Progress
      | Phase | Status | Notes |
      | --- | --- | --- |

      ## Team Health
      | Team | Status | Last Active | Items Done | Blockers |
      | --- | --- | --- | --- | --- |

      ## Active Risks
      | ID | Severity | Description | Owner | Mitigation |
      | --- | --- | --- | --- | --- |

      ## Backlog Summary
      - P0: <count> items
      - P1: <count> items
      - P2+: <count> items

      ## Delivery Metrics
      | Metric | Value | Trend |
      | --- | --- | --- |
      | Commit frequency | <N>/day (7d avg) | |
      | Throughput | <N> tasks/week | |
      | WIP count | <N> | |
      | Lead time | <N> days avg | |
      | Block rate | <N>% | |
      | Cycle time | <N> days avg | |

      ## Recent Activity (last 5 events)
      ...

      ## Recommended Actions
      1. <highest priority>
      2. ...
      ```

      ## Health Scoring

      - **HEALTHY**: All teams active, no P0 blockers, WIP under limit
      - **AT_RISK**: Any team stale (>24h), P0 items unassigned, or WIP exceeds 2× team count
      - **BLOCKED**: Any team explicitly blocked, orchestrator lock stale, or critical risk unmitigated

      ## Rules

      1. This command is **read-only** — never modify any files.
      2. Gracefully handle missing data sources — show "N/A" rather than failing.
      3. When filtering by `--team`, only show data for that team.
      4. Include actionable recommendations based on the data.
    flags:
      - name: --format
        description: 'Output format: markdown (default) or json'
        type: string
        default: 'markdown'
        enum: [markdown, json]
      - name: --team
        description: 'Filter to a specific team'
        type: string
        default: null
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: infra-eval
    type: workflow
    description: >
      Risk-aware infrastructure and codebase evaluation against reliability,
      cost, and scale fitness. Scores eight weighted dimensions (0–5 each),
      enforces hard gates for critical safety properties, and produces a
      scored summary with narrative risk analysis. Designed for quarterly
      reassessment, pre-funding due diligence, and architectural decision
      support. Gated behind the evaluation.infraEval project.yaml flag.
    flags:
      - name: --scope
        description: 'Limit evaluation to specific paths or modules'
        type: string
        default: null
        required: false
      - name: --focus
        description: 'Focus area: all, reliability, cost, security, infra, scalability, architecture, code, ops'
        type: string
        default: 'all'
        required: false
        enum: [all, reliability, cost, security, infra, scalability, architecture, code, ops]
      - name: --output
        description: 'Output format: markdown, json, or yaml'
        type: string
        default: 'markdown'
        required: false
        enum: [markdown, json, yaml]
      - name: --save
        description: 'Save evaluation report to docs/evaluations/'
        type: boolean
        default: true
      - name: --gates-only
        description: 'Run hard gate checks only without full dimensional scoring'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - WebSearch
      - WebFetch

  - name: scaffold
    type: workflow
    requiredFeature: doc-scaffolding
    description: >
      Generates implementation skeletons aligned with project conventions.
      Supports endpoints, UI components, IaC modules, migrations, tests,
      and services. Uses project.yaml context and domain rules to prefill
      structure and guardrails.
    prompt: |
      ## Usage

      `/scaffold --type <endpoint|component|module|migration|test|service> --name <name> [--stack <stack>] [--path <path>]`

      ## Workflow

      1. Read `project.yaml`, `rules.yaml`, and relevant agent/team scopes
      2. Resolve target files and directories for the scaffold type
      3. Generate minimal, compilable skeleton files with TODO markers only where unavoidable
      4. Include tests and docs stubs when applicable
      5. Report generated files and next implementation steps

      ## Guardrails

      - Never overwrite non-generated files without explicit instruction
      - Reject `--path` values that resolve outside the workspace root (including `..` traversal, symlink escapes, and absolute paths). Abort with a clear error.
      - Keep generated outputs small and composable
      - Follow naming conventions and architecture patterns from project config
    flags:
      - name: --type
        description: 'Scaffold type: endpoint, component, module, migration, test, service'
        type: string
        default: null
      - name: --name
        description: 'Name of the scaffold artifact'
        type: string
        default: null
      - name: --stack
        description: 'Target tech stack override'
        type: string
        default: null
      - name: --path
        description: 'Target output path (must be inside workspace root)'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep

  - name: preflight
    type: workflow
    description: >
      Runs enhanced delivery checks before ship: quality gates, changelog,
      coverage delta, commit convention conformance, TODO/FIXME hygiene,
      and documentation updates for externally visible changes.
    prompt: |
      ## Checks (beyond /check)

      1. **Quality Gates** — Run `/check` and fail on any error
      2. **Changelog Updates** — Verify changelog/release notes when user-facing behavior changed (CLI flags, API contracts, UI copy, migration semantics)
      3. **Commit Convention** — Validate commits in range follow conventional commit format
      4. **TODO/FIXME Hygiene** — Detect entries without issue references in changed files
      5. **Coverage Delta** — Fail when coverage regresses vs. baseline. Accept documented waivers with author, rationale, linked issue, and expiry date.
      6. **Docs Updates** — Confirm docs updated for API/CLI behavior changes

      ## Output

      Produce a pass/fail table: Check | Status | Evidence | Required Follow-up. Include range resolution info, baseline and current coverage percentages with delta.

      ## Usage

      `/preflight [--stack <stack>] [--range <git-range>] [--base <remote-branch>] [--strict]`

      If `--range` is omitted, auto-detect via merge-base against the default branch. If detection fails, fall back to `HEAD~50..HEAD` with a visible warning.
    flags:
      - name: --stack
        description: 'Limit checks to a specific stack'
        type: string
        default: null
      - name: --branch
        description: 'Branch to check (defaults to current branch)'
        type: string
        default: null
      - name: --base
        description: 'Remote base branch used for merge-base when --range is omitted (e.g., origin/main)'
        type: string
        default: null
      - name: --range
        description: 'Git range used for changelog/commit checks (auto-detect via merge-base; fallback emits warning and uses HEAD~50..HEAD)'
        type: string
        default: null
      - name: --strict
        description: 'Fail on warnings'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: cost
    type: utility
    description: >
      Session cost and usage tracking. Shows session summaries, lists recent
      sessions, and generates aggregate usage reports. Tracks session duration,
      commands run, and files modified via lifecycle hooks.
    prompt: |
      ## Workflow

      1. Parse arguments to determine which view the user wants
      2. Run the cost tracking CLI command
      3. Present results in a clear, formatted table
      4. Suggest optimizations if usage is high

      ## Available Views

      | Command | Description |
      |---------|-------------|
      | `--summary` | Recent session overview with durations and file counts |
      | `--sessions` | List all recent sessions |
      | `--report --month YYYY-MM` | Monthly aggregate report |
      | `--report --format json` | Export report as JSON |

      ## Notes

      - Session tracking is automatic via lifecycle hooks
      - Tracks operational metrics (duration, commands, files) — not token counts
      - Logs stored in `.agentkit/logs/` as daily JSONL files
    flags:
      - name: --summary
        description: 'Show recent session summary'
        type: boolean
        default: false
      - name: --sessions
        description: 'List recent sessions'
        type: boolean
        default: false
      - name: --report
        description: 'Generate aggregate usage report'
        type: boolean
        default: false
      - name: --month
        description: 'Month for report (YYYY-MM format)'
        type: string
        default: null
      - name: --format
        description: 'Export format: table, json, csv'
        type: string
        default: 'table'
      - name: --last
        description: 'Time period for queries (e.g. 7d, 30d)'
        type: string
        default: '7d'
      - name: --budget
        description: 'Show budget enforcement status (session + daily limits)'
