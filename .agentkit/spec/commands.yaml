# =============================================================================
# commands.yaml — Command definitions for agentkit-forge
# Canonical source of truth for agentkit-forge
# Version: 0.1.0
# =============================================================================
# Each command defines: name, description, type, flags, and allowed-tools.
# Types: workflow (multi-step orchestration), team (team-scoped), utility (single action)
#
# Optional field: requiredFeature
#   If set, this command is only generated when the specified feature is enabled.
#   If null or omitted, the command is always generated.
#   Example: requiredFeature: quality-gates  → only generated if quality-gates is enabled.
# =============================================================================

commands:
  # ===========================================================================
  # Workflow Commands — Multi-step orchestration and analysis
  # ===========================================================================

  - name: orchestrate
    type: workflow
    requiredFeature: team-orchestration
    description: >
      Top-level orchestration command. Assesses the current repository state,
      identifies work to be done, delegates to appropriate team agents, and
      synthesizes results. The primary entry point for multi-step workflows.
    flags:
      - name: --assess-only
        description: 'Run assessment phase only; do not execute changes'
        type: boolean
        default: false
      - name: --scope
        description: 'Limit orchestration to specific file paths or glob patterns'
        type: string
        default: null
        required: false
      - name: --dry-run
        description: 'Show planned actions without executing them'
        type: boolean
        default: false
      - name: --team
        description: 'Delegate to a specific team instead of auto-routing'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
      - name: --phase
        description: 'Jump to a specific phase (1-5)'
        type: integer
        default: null
        required: false
        enum: [1, 2, 3, 4, 5]
      - name: --status
        description: 'Show current orchestrator state without executing'
        type: boolean
        default: false
      - name: --force-unlock
        description: 'Clear a stale session lock'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit

  - name: discover
    type: workflow
    description: >
      Scans the repository to build a comprehensive understanding of the project
      structure, tech stacks in use, team boundaries, and architectural patterns.
      Outputs a structured discovery report used by other commands.
    flags:
      - name: --output
        description: 'Output format: json, yaml, or markdown'
        type: string
        default: 'yaml'
        required: false
        enum: [json, yaml, markdown]
      - name: --depth
        description: 'Directory traversal depth limit'
        type: integer
        default: 5
      - name: --include-deps
        description: 'Include dependency analysis in discovery output'
        type: boolean
        default: true
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: healthcheck
    type: workflow
    requiredFeature: healthcheck
    description: >
      Performs a comprehensive health check of the repository: validates builds,
      runs tests, checks linting, verifies configuration files, and reports on
      the overall state of the codebase across all detected tech stacks.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack (node, dotnet, rust, python)'
        type: string
        default: null
        required: false
        enum: [node, dotnet, rust, python]
      - name: --fix
        description: 'Attempt to auto-fix discovered issues'
        type: boolean
        default: false
      - name: --verbose
        description: 'Include detailed output for each check'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: review
    type: workflow
    requiredFeature: code-review
    description: >
      Performs a structured code review of staged changes, a specific PR, or a
      range of commits. Evaluates code quality, adherence to domain rules,
      security concerns, test coverage, and architectural alignment.
    flags:
      - name: --pr
        description: 'GitHub PR number to review'
        type: integer
        default: null
        required: false
      - name: --range
        description: 'Git commit range to review (e.g., main..HEAD)'
        type: string
        default: null
        required: false
      - name: --file
        description: 'Review a specific file'
        type: string
        default: null
        required: false
      - name: --focus
        description: 'Focus area: security, performance, correctness, style, or all'
        type: string
        default: 'all'
        required: false
        enum: [security, performance, correctness, style, all]
      - name: --severity
        description: 'Minimum severity to report: info, warning, error, critical'
        type: string
        default: 'warning'
        required: false
        enum: [info, warning, error, critical]
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: sync-backlog
    type: workflow
    description: >
      Synchronizes the local backlog with GitHub Issues and project boards.
      Pulls open issues, maps them to teams, updates local tracking documents,
      and identifies stale or unassigned work items.
    flags:
      - name: --direction
        description: 'Sync direction: pull (from GitHub), push (to GitHub), or both'
        type: string
        default: 'pull'
      - name: --labels
        description: 'Filter by GitHub labels (comma-separated)'
        type: string
        default: null
      - name: --team
        description: 'Filter issues relevant to a specific team'
        type: string
        default: null
        required: false
        enum: [backend, frontend, data, infra, devops, testing, security, docs, product, quality]
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: check
    type: workflow
    requiredFeature: quality-gates
    description: >
      Runs all quality checks for the repository: type checking, linting,
      formatting validation, and test suites. Returns a unified pass/fail
      status with detailed breakdowns per check category.
    flags:
      - name: --stack
        description: 'Check only a specific tech stack'
        type: string
        default: null
      - name: --fix
        description: 'Auto-fix issues where possible (lint, format)'
        type: boolean
        default: false
      - name: --bail
        description: 'Stop on first failure'
        type: boolean
        default: false
      - name: --fast
        description: 'Skip the build step; only run format + lint + typecheck + test'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: plan
    type: workflow
    description: >
      Creates a detailed implementation plan for a feature, bug fix, or
      refactoring task. Analyzes the codebase, identifies affected files and
      teams, estimates complexity, and produces a step-by-step plan with
      acceptance criteria.
    flags:
      - name: --issue
        description: 'GitHub issue number to plan for'
        type: integer
        default: null
      - name: --output
        description: 'Output format: markdown, yaml, or json'
        type: string
        default: 'markdown'
      - name: --depth
        description: 'Planning detail level: high, medium, low'
        type: string
        default: 'medium'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: handoff
    type: workflow
    requiredFeature: session-handoff
    description: >
      Generates a structured handoff document for the current session. Captures
      what was accomplished, what remains, open questions, and context needed
      by the next session or developer. Writes to docs/ai_handoffs/.
    flags:
      - name: --format
        description: 'Output format: markdown or yaml'
        type: string
        default: 'markdown'
      - name: --include-diff
        description: 'Include a summary of all file changes in the handoff'
        type: boolean
        default: true
      - name: --tag
        description: 'Tag for categorizing the handoff (e.g., feature, bugfix, spike)'
        type: string
        default: null
      - name: --save
        description: 'Save the handoff document to docs/ai_handoffs/'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Glob
      - Grep
      - Bash

  - name: project-review
    type: workflow
    requiredFeature: project-review
    description: >
      Comprehensive production-grade project review and assessment. Systematically
      analyzes code quality, architecture, security, UX, performance, documentation,
      and feature completeness. Produces structured findings with a prioritized
      roadmap organized into implementation waves.
    flags:
      - name: --scope
        description: 'Limit review to specific paths or modules'
        type: string
        default: null
      - name: --focus
        description: 'Focus area: all, security, performance, ux, docs, architecture'
        type: string
        default: 'all'
      - name: --phase
        description: 'Run only a specific review phase (0-4)'
        type: integer
        default: null
        required: false
        enum: [0, 1, 2, 3, 4]
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash
      - WebSearch
      - WebFetch

  - name: scaffold
    type: workflow
    requiredFeature: doc-scaffolding
    description: >
      Generates implementation skeletons aligned with project conventions.
      Supports endpoints, UI components, IaC modules, migrations, tests,
      and services. Uses project.yaml context and domain rules to prefill
      structure and guardrails.
    flags:
      - name: --type
        description: 'Scaffold type: endpoint, component, module, migration, test, service'
        type: string
        default: null
      - name: --name
        description: 'Name of the scaffold artifact'
        type: string
        default: null
      - name: --stack
        description: 'Target tech stack override'
        type: string
        default: null
      - name: --path
        description: 'Target output path (must be inside workspace root)'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep

  - name: preflight
    type: workflow
    description: >
      Runs enhanced delivery checks before ship: quality gates, changelog,
      coverage delta, commit convention conformance, TODO/FIXME hygiene,
      and documentation updates for externally visible changes.
    flags:
      - name: --stack
        description: 'Limit checks to a specific stack'
        type: string
        default: null
      - name: --base
        description: 'Remote base branch used for merge-base when --range is omitted (e.g., origin/main)'
        type: string
        default: null
      - name: --range
        description: 'Git range used for changelog/commit checks (auto-detect via merge-base; fallback emits warning and uses HEAD~50..HEAD)'
        type: string
        default: null
      - name: --strict
        description: 'Fail on warnings'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: cost
    type: utility
    description: >
      Session cost and usage tracking. Shows session summaries, lists recent
      sessions, and generates aggregate usage reports. Tracks session duration,
      commands run, and files modified via lifecycle hooks.
    flags:
      - name: --summary
        description: 'Show recent session summary'
        type: boolean
        default: false
      - name: --sessions
        description: 'List recent sessions'
        type: boolean
        default: false
      - name: --report
        description: 'Generate aggregate usage report'
        type: boolean
        default: false
      - name: --month
        description: 'Month for report (YYYY-MM format)'
        type: string
        default: null
      - name: --format
        description: 'Export format: table, json, csv'
        type: string
        default: 'table'
      - name: --last
        description: 'Time period for queries (e.g. 7d, 30d)'
        type: string
        default: '7d'
    allowed-tools:
      - Read
      - Glob

  - name: doctor
    type: utility
    description: >
      Runs AgentKit Forge diagnostics: spec validation, overlay sanity checks,
      template availability, project.yaml completeness hints, and suggested
      next actions for fixing setup issues.
    flags:
      - name: --verbose
        description: 'Include detailed diagnostics'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  # ===========================================================================
  # Feature Management Commands — Inspect and operate on kit features
  # ===========================================================================

  - name: feature-review
    type: workflow
    description: >
      Reviews the current feature configuration for the repo. Analyzes which
      features are enabled/disabled, checks for misconfigured dependencies,
      identifies unused features (enabled but no matching code patterns),
      and recommends features to enable based on codebase analysis.
    flags:
      - name: --recommend
        description: 'Analyze codebase and recommend features to enable or disable'
        type: boolean
        default: false
      - name: --audit
        description: 'Audit feature usage — find enabled features with no matching code patterns'
        type: boolean
        default: false
      - name: --verbose
        description: 'Show detailed feature metadata including template vars and affected templates'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
    requiredFeature: null

  - name: feature-configure
    type: workflow
    description: >
      Interactive feature configuration workflow. Walks through each feature
      category, explains what each feature provides, shows current status,
      and applies changes via the overlay settings.yaml. Triggers a sync
      after changes are applied.
    flags:
      - name: --category
        description: 'Configure only features in a specific category'
        type: string
        default: null
        required: false
        enum: [workflow, quality, docs, security, infra, advanced]
      - name: --preset
        description: 'Apply a named feature preset instead of interactive selection'
        type: string
        default: null
        required: false
        enum: [minimal, lean, standard, full]
      - name: --dry-run
        description: 'Show what would change without applying'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Write
      - Glob
      - Bash
    requiredFeature: null

  - name: feature-flow
    type: workflow
    description: >
      Traces a specific feature end-to-end through the kit: shows which spec
      files define it, which template vars it injects, which templates consume
      those vars, what generated output it produces, and what overlay settings
      control it. Use this to understand or debug a feature's behavior.
    flags:
      - name: --feature
        description: 'Feature ID to trace (e.g., team-orchestration, quality-gates)'
        type: string
        default: null
        required: true
      - name: --show-templates
        description: 'Show the raw template content that uses this feature'
        type: boolean
        default: false
      - name: --show-output
        description: 'Show the rendered output for this feature'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Grep
    requiredFeature: null

  # ===========================================================================
  # Framework Commands — AgentKit Forge internal tooling
  # ===========================================================================

  - name: validate
    type: utility
    description: >
      Validates generated outputs for correctness. Checks that all required
      directories, JSON files, command files, and hook scripts exist and are
      well-formed. Scans for forbidden patterns (hardcoded secrets) and
      verifies the settings.json hooks configuration.
    flags: []
    allowed-tools:
      - Read
      - Glob

  # ===========================================================================
  # Utility Commands — Single-action tools
  # ===========================================================================

  - name: build
    type: utility
    description: >
      Builds the project using the detected tech stack's build command. Supports
      targeting specific packages in a monorepo or building the entire workspace.
    flags:
      - name: --stack
        description: 'Force a specific tech stack build command'
        type: string
        default: null
      - name: --package
        description: 'Build a specific package/app in a monorepo'
        type: string
        default: null
      - name: --production
        description: 'Build in production mode'
        type: boolean
        default: false
      - name: --verbose
        description: 'Show verbose build output'
        type: boolean
        default: false
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: test
    type: utility
    description: >
      Runs the test suite using the detected tech stack's test command. Supports
      filtering by test file, pattern, or package. Reports pass/fail counts
      and coverage when available.
    flags:
      - name: --stack
        description: 'Force a specific tech stack test command'
        type: string
        default: null
      - name: --filter
        description: 'Filter tests by name or pattern'
        type: string
        default: null
      - name: --coverage
        description: 'Generate coverage report'
        type: boolean
        default: false
      - name: --watch
        description: 'Run tests in watch mode'
        type: boolean
        default: false
      - name: --package
        description: 'Test a specific package/app in a monorepo'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: format
    type: utility
    description: >
      Formats code using the detected tech stack's formatter. Can target
      specific files, directories, or the entire workspace. Reports files
      that were changed.
    flags:
      - name: --stack
        description: 'Force a specific tech stack formatter'
        type: string
        default: null
      - name: --check
        description: 'Check formatting without making changes'
        type: boolean
        default: false
      - name: --path
        description: 'Format only files matching this path or glob'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Bash

  - name: deploy
    type: utility
    description: >
      Triggers a deployment pipeline or generates deployment artifacts.
      Validates pre-deployment checks (build, test, lint) before proceeding.
      Supports dry-run mode for safety.
    flags:
      - name: --environment
        description: 'Target environment: dev, staging, production'
        type: string
        default: 'dev'
      - name: --dry-run
        description: 'Simulate deployment without executing'
        type: boolean
        default: true
      - name: --skip-checks
        description: 'Skip pre-deployment quality checks (use with caution)'
        type: boolean
        default: false
      - name: --stack
        description: 'Deploy a specific tech stack component'
        type: string
        default: null
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  - name: security
    type: utility
    description: >
      Runs security-focused analysis: dependency vulnerability scanning,
      secret detection, OWASP compliance checks, and permission auditing.
      Generates a security report with severity ratings.
    flags:
      - name: --scan-type
        description: 'Scan type: deps, secrets, owasp, permissions, or all'
        type: string
        default: 'all'
      - name: --severity
        description: 'Minimum severity to report: low, medium, high, critical'
        type: string
        default: 'medium'
      - name: --fix
        description: 'Attempt to auto-fix vulnerabilities (dependency updates)'
        type: boolean
        default: false
      - name: --output
        description: 'Output format: json, markdown, or sarif'
        type: string
        default: 'markdown'
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Bash

  # ===========================================================================
  # Team Commands — Scoped to team domains defined in teams.yaml
  # ===========================================================================

  - name: team-backend
    type: team
    team: backend
    description: >
      Activates the BACKEND team context. Scopes all operations to API,
      services, and core logic files. Applies backend-specific rules and
      delegates to backend-specialized agents.
    flags:
      - name: --task
        description: 'Specific task to perform within the backend scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-frontend
    type: team
    team: frontend
    description: >
      Activates the FRONTEND team context. Scopes all operations to UI,
      components, and PWA files. Applies frontend-specific rules including
      WCAG AA accessibility and component patterns.
    flags:
      - name: --task
        description: 'Specific task to perform within the frontend scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-data
    type: team
    team: data
    description: >
      Activates the DATA team context. Scopes all operations to database,
      models, and migration files. Applies data-specific rules including
      migration safety and schema validation.
    flags:
      - name: --task
        description: 'Specific task to perform within the data scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-infra
    type: team
    team: infra
    description: >
      Activates the INFRA team context. Scopes all operations to IaC, cloud,
      and Terraform/Bicep files. Applies infrastructure-specific rules
      including state safety and drift detection.
    flags:
      - name: --task
        description: 'Specific task to perform within the infra scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-devops
    type: team
    team: devops
    description: >
      Activates the DEVOPS team context. Scopes all operations to CI/CD
      pipelines, scripts, and Docker configurations. Applies DevOps-specific
      rules including pipeline validation and container best practices.
    flags:
      - name: --task
        description: 'Specific task to perform within the devops scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-testing
    type: team
    team: testing
    description: >
      Activates the TESTING team context. Scopes all operations to test files,
      E2E suites, and integration tests. Applies testing-specific rules
      including coverage thresholds and test organization patterns.
    flags:
      - name: --task
        description: 'Specific task to perform within the testing scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-security
    type: team
    team: security
    description: >
      Activates the SECURITY team context. Scopes all operations to auth,
      compliance, and security middleware files. Applies security-specific
      rules including secret protection and least-privilege enforcement.
    flags:
      - name: --task
        description: 'Specific task to perform within the security scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-docs
    type: team
    team: docs
    description: >
      Activates the DOCUMENTATION team context. Scopes all operations to docs,
      ADRs, and guide files. Applies documentation-specific rules including
      ADR formatting, link validation, and content structure.
    flags:
      - name: --task
        description: 'Specific task to perform within the docs scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-product
    type: team
    team: product
    description: >
      Activates the PRODUCT team context. Scopes all operations to PRDs,
      feature specs, and roadmap files. Applies product-specific rules
      including PRD templates and acceptance criteria validation.
    flags:
      - name: --task
        description: 'Specific task to perform within the product scope'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash

  - name: team-quality
    type: team
    team: quality
    description: >
      Activates the QUALITY team context. Has access to the entire codebase
      for cross-cutting concerns: code review, refactoring, bug triage, and
      reliability improvements.
    flags:
      - name: --task
        description: 'Specific task to perform within the quality scope'
        type: string
        default: null
      - name: --focus
        description: 'Focus area: review, refactor, bugs, reliability'
        type: string
        default: null
    allowed-tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash
