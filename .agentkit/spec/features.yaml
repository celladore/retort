# =============================================================================
# features.yaml — Kit Feature Definitions for AgentKit Forge
# Canonical registry of opt-in/opt-out features available to adopting repos.
# Schema version: 1  (bump when adding/removing fields to feature entries)
# =============================================================================
#
# PURPOSE
# -------
# Each feature represents a discrete, independently toggleable capability that
# agentkit-forge provides to adopting repositories. This file is the single
# source of truth — the feature-manager engine reads it at `sync` and `init`
# time, generates template variables, and enforces dependency constraints.
#
# FEATURE CATEGORIES
# ------------------
#   core       — Foundational (always-on, cannot be disabled)
#   workflow   — Team orchestration and workflow automation
#   quality    — Code quality, testing, and review gates
#   docs       — Documentation generation and management
#   security   — Security scanning, permissions, and guardrails
#   infra      — Infrastructure, deployment, and observability
#   advanced   — Power-user features for complex workflows
#
# FEATURE ENTRY SCHEMA
# --------------------
#   id:               string   — Unique kebab-case identifier
#   name:             string   — Human-readable display name
#   category:         string   — One of the categories above
#   description:      string   — What this feature does and why you'd enable it
#   alwaysOn:         boolean  — true = core feature, cannot be disabled
#   default:          boolean  — true = enabled when no preset/explicit list set
#   dependencies:     string[] — Feature IDs that must also be enabled
#   templateVars:     string[] — Variables injected into the template engine
#   affectsTemplates: string[] — Template paths this feature gates (documentation only)
#
# DEPENDENCY RULES
# ----------------
# 1. Dependencies are transitive: if A → B → C, enabling A also enables B and C.
# 2. Circular dependencies are rejected at validation time (`agentkit spec-validate`).
# 3. Disabling a feature that other enabled features depend on is blocked:
#      $ agentkit features disable team-orchestration
#      Error: Cannot disable — agent-personas depends on team-orchestration
#    To proceed, disable the dependent first, or disable both together:
#      $ agentkit features disable agent-personas team-orchestration
# 4. Core features (alwaysOn: true) cannot appear in disabledFeatures.
# 5. Dependencies on core features are allowed but redundant (they're always on).
#
# DEPENDENCY GRAPH (non-core features)
# -------------------------------------
#   team-orchestration
#     ← agent-personas
#     ← task-delegation
#   quality-gates
#     ← healthcheck
#   permission-guards
#     ← sensitive-file-protection
#
#   All other features are dependency-free (standalone).
#
# OVERLAY PRECEDENCE (resolution order)
# --------------------------------------
# The feature-manager resolves the enabled set with strict precedence:
#
#   1. enabledFeatures (explicit list in overlay settings.yaml)  — wins if present
#   2. featurePreset   (named preset from this file)             — used if no explicit list
#   3. default: true   (per-feature defaults)                    — fallback
#
# After the base set is determined:
#   4. disabledFeatures are subtracted (cannot subtract alwaysOn)
#   5. alwaysOn features are force-added
#   6. Transitive dependencies are auto-enabled
#
# This means:
#   - enabledFeatures + disabledFeatures together = full explicit control
#   - featurePreset alone = curated bundle, disabledFeatures can carve out exceptions
#   - Neither = sensible defaults, disabledFeatures can carve out exceptions
#   - enabledFeatures takes priority over featurePreset (they're mutually exclusive)
#
# CONFLICT RESOLUTION
# -------------------
# - If both enabledFeatures AND featurePreset are set, enabledFeatures wins.
#   The CLI `features preset <name>` command clears enabledFeatures to avoid this.
# - If a feature appears in both enabledFeatures and disabledFeatures,
#   disabledFeatures wins (explicit disable is the stronger signal).
# - Enabling a feature via CLI auto-removes it from disabledFeatures.
# - Disabling a feature via CLI auto-removes it from enabledFeatures.
#
# MIGRATION / UPGRADING
# ---------------------
# When features.yaml gains new features in a kit update:
#   - New features with default: false are opt-in — existing repos are unaffected.
#   - New features with default: true will auto-enable for repos using default mode
#     (no explicit enabledFeatures or featurePreset). This is intentional — it keeps
#     default-mode repos up to date with recommended features.
#   - Repos using enabledFeatures (explicit list) are NOT affected by new features.
#     The repo owner must explicitly add new feature IDs to adopt them.
#   - Repos using featurePreset are affected if the preset definition changes.
#     Preset changes are documented in CHANGELOG.md and follow semver conventions.
#   - To pin features and avoid drift: switch from featurePreset to enabledFeatures.
#   - Schema version bumps (the `schemaVersion` field at top of this file) indicate
#     breaking changes to the feature entry format. The engine will warn if the
#     schema version is higher than what it supports.
#
# TEMPLATE USAGE
# ---------------
# Each feature injects boolean template variables. Use them in templates with
# the standard conditional syntax:
#
#   {{#if hasTeamOrchestration}}
#   ## Team Workflow
#   Use `/orchestrate` to delegate tasks across teams.
#   Team handoff chains are defined in teams.yaml.
#   {{/if}}
#
#   {{#if hasQualityGates}}
#   ## Quality Gates
#   All PRs must pass `/check` before merging.
#   {{#if hasCodingRules}}
#   Coding conventions are enforced from rules.yaml.
#   {{/if}}
#   {{/if}}
#
#   {{#unless hasSlashCommands}}
#   > Note: Slash commands are not enabled for this repo.
#   > Enable with: `agentkit features enable slash-commands`
#   {{/unless}}
#
# Every feature also sets a canonical var `feature_<id>` (hyphens → underscores):
#   feature_team_orchestration, feature_quality_gates, etc.
#
# EXPECTED GENERATED OUTPUT (example: CLAUDE.md with "standard" preset)
# ----------------------------------------------------------------------
# With standard preset (team-orchestration, quality-gates, coding-rules, etc.):
#
#   ## Team Workflow                          ← from hasTeamOrchestration
#   Use `/orchestrate` to delegate tasks...
#
#   ## Quality Gates                          ← from hasQualityGates
#   All PRs must pass `/check`...
#   Coding conventions enforced...            ← from hasCodingRules (nested)
#
#   ## Documentation                          ← from hasDocScaffolding
#   Docs live in docs/...
#
# With lean preset (no team-orchestration):
#   The "Team Workflow" section is omitted entirely.
#   Quality and docs sections still appear.
#
# With minimal preset:
#   Only quality gates and coding rules sections appear.
#   No team workflow, no docs scaffolding, no CI automation.
#
# =============================================================================

schemaVersion: 1

features:

  # ---------------------------------------------------------------------------
  # Core — Always enabled, cannot be disabled
  # ---------------------------------------------------------------------------
  - id: spec-sync
    name: Spec Sync
    category: core
    description: >-
      Render AI tool configs from YAML specs and overlays. This is the
      foundational sync engine that all other features build on.
    alwaysOn: true
    dependencies: []
    templateVars:
      - hasSpecSync

  - id: project-context
    name: Project Context
    category: core
    description: >-
      Project identity, tech stack detection, and architecture metadata
      that feeds into every generated config.
    alwaysOn: true
    dependencies: []
    templateVars:
      - hasProjectContext

  # ---------------------------------------------------------------------------
  # Workflow — Team orchestration and workflow automation
  # ---------------------------------------------------------------------------
  - id: team-orchestration
    name: Team Orchestration
    category: workflow
    description: >-
      Multi-team coordination with team definitions, handoff chains,
      and delegated task management across agent personas.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasTeamOrchestration
    affectsTemplates:
      - claude/commands/team-TEMPLATE.md
      - cursor/rules/team-*.mdc
      - windsurf/teams/

  - id: agent-personas
    name: Agent Personas
    category: workflow
    description: >-
      Specialized agent definitions with roles, responsibilities,
      conventions, and anti-patterns for focused task delegation.
    alwaysOn: false
    default: true
    dependencies: [team-orchestration]
    templateVars:
      - hasAgentPersonas
    affectsTemplates:
      - claude/agents/
      - copilot/agents/

  - id: slash-commands
    name: Slash Commands
    category: workflow
    description: >-
      Custom AI tool commands (e.g., /orchestrate, /plan, /check)
      with typed flags, allowed tools, and workflow routing.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasSlashCommands
    affectsTemplates:
      - claude/commands/
      - claude/skills/

  - id: task-delegation
    name: Task Delegation
    category: workflow
    description: >-
      Create, track, and manage delegated tasks across teams
      with priority, dependencies, and handoff chains.
    alwaysOn: false
    default: false
    dependencies: [team-orchestration]
    templateVars:
      - hasTaskDelegation

  # ---------------------------------------------------------------------------
  # Quality — Code quality, testing, and review gates
  # ---------------------------------------------------------------------------
  - id: quality-gates
    name: Quality Gates
    category: quality
    description: >-
      Automated quality checks including linting, formatting,
      type checking, testing, and build verification.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasQualityGates
    affectsTemplates:
      - claude/hooks/stop-build-check.sh

  - id: code-review
    name: Code Review
    category: quality
    description: >-
      Automated review checks for secrets, large files, TODOs,
      and code quality with configurable severity levels.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasCodeReview

  - id: coding-rules
    name: Coding Rules
    category: quality
    description: >-
      Convention enforcement via rules.yaml — naming patterns,
      error handling, performance budgets, and security guardrails.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasCodingRules
    affectsTemplates:
      - claude/rules/
      - cursor/rules/

  # ---------------------------------------------------------------------------
  # Docs — Documentation generation and management
  # ---------------------------------------------------------------------------
  - id: doc-scaffolding
    name: Doc Scaffolding
    category: docs
    description: >-
      Generate documentation structure (PRD, ADR, API docs, tech specs)
      with convention-aligned templates and paths.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasDocScaffolding
    affectsTemplates:
      - docs/

  - id: session-handoff
    name: Session Handoff
    category: docs
    description: >-
      Generate session handoff documents capturing context, decisions,
      and next steps for async collaboration.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasSessionHandoff

  - id: external-knowledge
    name: External Knowledge
    category: docs
    description: >-
      Integrate external documentation sources (Windsurf guides,
      markdown files, git repos) into template metadata overlays.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasExternalKnowledgeFeature
    affectsTemplates:
      - copilot/instructions/
      - windsurf/templates/

  # ---------------------------------------------------------------------------
  # Security — Security scanning, permissions, and guardrails
  # ---------------------------------------------------------------------------
  - id: permission-guards
    name: Permission Guards
    category: security
    description: >-
      Allow/deny permission model for tool commands with
      pre-tool-use hooks that block destructive operations.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasPermissionGuards
    affectsTemplates:
      - claude/settings.json
      - claude/hooks/

  - id: sensitive-file-protection
    name: Sensitive File Protection
    category: security
    description: >-
      Pre-tool-use hooks that prevent AI agents from modifying
      sensitive files (.env, credentials, CI configs).
    alwaysOn: false
    default: true
    dependencies: [permission-guards]
    templateVars:
      - hasSensitiveFileProtection
    affectsTemplates:
      - claude/hooks/protect-sensitive.sh

  # ---------------------------------------------------------------------------
  # Infra — Infrastructure, deployment, and observability
  # ---------------------------------------------------------------------------
  - id: cost-tracking
    name: Cost Tracking
    category: infra
    description: >-
      Session-level usage and cost tracking with aggregated
      reports, CSV/JSON export, and configurable retention.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasCostTracking

  - id: ci-automation
    name: CI Automation
    category: infra
    description: >-
      GitHub Actions workflows, issue templates, PR templates,
      and CI profile configurations.
    alwaysOn: false
    default: true
    dependencies: []
    templateVars:
      - hasCiAutomation
    affectsTemplates:
      - github/workflows/
      - github/ISSUE_TEMPLATE/

  - id: dependency-management
    name: Dependency Management
    category: infra
    description: >-
      Automated dependency updates via Renovate or Dependabot
      with configurable schedules and automerge strategies.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasDependencyManagement
    affectsTemplates:
      - renovate/renovate.json

  # ---------------------------------------------------------------------------
  # Advanced — Power-user features
  # ---------------------------------------------------------------------------
  - id: mcp-integration
    name: MCP Integration
    category: advanced
    description: >-
      Model Context Protocol server configurations and
      Agent-to-Agent (A2A) config generation.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasMcpIntegration
    affectsTemplates:
      - mcp/

  - id: healthcheck
    name: Healthcheck
    category: advanced
    description: >-
      Pre-flight validation of repo health including dependency
      status, config integrity, and environment readiness.
    alwaysOn: false
    default: false
    dependencies: [quality-gates]
    templateVars:
      - hasHealthcheck

  - id: project-review
    name: Project Review
    category: advanced
    description: >-
      Comprehensive project audit covering architecture,
      testing, documentation, and process compliance.
    alwaysOn: false
    default: false
    dependencies: []
    templateVars:
      - hasProjectReview

# =============================================================================
# Feature presets — named bundles for common adoption patterns
# =============================================================================
#
# PRESET COMPARISON TABLE
# -----------------------
# Feature                  | minimal | lean | standard | full
# -------------------------|---------|------|----------|-----
# team-orchestration       |         |      |    x     |  x
# agent-personas           |         |      |    x     |  x
# slash-commands           |         |      |    x     |  x
# task-delegation          |         |      |          |  x
# quality-gates            |    x    |  x   |    x     |  x
# code-review              |         |  x   |    x     |  x
# coding-rules             |    x    |  x   |    x     |  x
# doc-scaffolding          |         |  x   |    x     |  x
# session-handoff          |         |      |          |  x
# external-knowledge       |         |      |          |  x
# permission-guards        |    x    |  x   |    x     |  x
# sensitive-file-protection|         |      |    x     |  x
# cost-tracking            |         |      |          |  x
# ci-automation            |         |  x   |    x     |  x
# dependency-management    |         |      |          |  x
# mcp-integration          |         |      |          |  x
# healthcheck              |         |      |          |  x
# project-review           |         |      |          |  x
# -------------------------|---------|------|----------|-----
# Total (+ 2 core)         |   5     |  8   |   12     | 20
#
# Note: Core features (spec-sync, project-context) are always-on in all presets.

presets:

  # MINIMAL — 3 features + 2 core = 5 total
  # Use-case: You only want the sync engine to generate AI tool configs.
  # No team orchestration, no docs scaffolding, no CI. Just quality checks
  # and permission guardrails to keep agents safe.
  # Best for: Exploratory adoption, single-tool repos, or repos that
  # manage teams/docs/CI through other means.
  minimal:
    label: Minimal — sync + basic quality
    description: Core sync engine with basic quality gates. No team orchestration or advanced features.
    features:
      - quality-gates
      - coding-rules
      - permission-guards

  # LEAN — 6 features + 2 core = 8 total
  # Use-case: Quality and docs without the overhead of team orchestration.
  # Gets you code review, coding rules, documentation scaffolding, CI
  # automation, and permission guards — but no teams, agents, or slash commands.
  # Best for: Solo developers, small projects, or repos where a single
  # developer drives all AI interactions without delegation.
  lean:
    label: Lean — no orchestration overhead
    description: Quality and docs without team orchestration. Ideal for solo developers or small projects.
    features:
      - quality-gates
      - code-review
      - coding-rules
      - doc-scaffolding
      - permission-guards
      - ci-automation

  # STANDARD — 10 features + 2 core = 12 total (DEFAULT for `agentkit init`)
  # Use-case: The recommended starting point for most teams. Full team
  # orchestration with agent personas, slash commands, quality gates, code
  # review, documentation, security, and CI — without the advanced features
  # (cost tracking, MCP, healthcheck) that require additional setup.
  # Best for: Teams of 2-15 developers using 2+ AI tools, with code review
  # processes and CI pipelines already in place.
  standard:
    label: Standard — teams + quality + docs
    description: Full team orchestration, quality gates, documentation, and security. Best for most projects.
    features:
      - team-orchestration
      - agent-personas
      - slash-commands
      - quality-gates
      - code-review
      - coding-rules
      - doc-scaffolding
      - permission-guards
      - sensitive-file-protection
      - ci-automation

  # FULL — 18 features + 2 core = 20 total
  # Use-case: Everything the kit offers. Includes cost tracking, MCP server
  # configs, dependency management automation, session handoff, external
  # knowledge integration, healthcheck, and project review.
  # Best for: Enterprise teams, platform repos, or projects that want
  # maximum automation and observability. Expect more generated files and
  # more config surface area to maintain.
  full:
    label: Full — everything enabled
    description: All features enabled including cost tracking, MCP, healthcheck, and advanced workflows.
    features:
      - team-orchestration
      - agent-personas
      - slash-commands
      - task-delegation
      - quality-gates
      - code-review
      - coding-rules
      - doc-scaffolding
      - session-handoff
      - external-knowledge
      - permission-guards
      - sensitive-file-protection
      - cost-tracking
      - ci-automation
      - dependency-management
      - mcp-integration
      - healthcheck
      - project-review
