  packageManager: pnpm
  nodeVersion: lts/*
  frameworks:
    frontend: []
    backend: [node.js, asp.net-core, axum]
    css: []
  orm: none
  database: [none]
  search: none
  messaging: [none]
automation:
  languageProfile:
    mode: configured
    diagnostics: off
    inferFrom:
      frameworks: true
      tests: true
